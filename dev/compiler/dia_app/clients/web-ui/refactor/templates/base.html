<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>View from Web Server</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: Arial, sans-serif; display: flex; height: 100vh; }
    #main { flex: 3; padding: 20px; background: #f7f7f7; overflow-y: auto; }
    #side { flex: 1; padding: 20px; background: #eef; border-left: 1px solid #ccc; overflow-y: auto; }
    
    /* Side edges styling */
    .side-edges {
      margin: 12px 0;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 4px;
    }
    
    .side-edge {
      margin: 4px 0;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #1976d2;
    }
    
    .side-edge:hover {
      background: #f5f5f5;
      border-color: #1976d2;
    }
    
    .side-edge.active {
      background: #e3f2fd;
      border-color: #1976d2;
      font-weight: 500;
    }
    
    /* Info styling */
    .info-type {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      margin-right: 8px;
      font-weight: 500;
    }
    
    .info-type-error { background: #ffebee; color: #d32f2f; }
    .info-type-warning { background: #fff3e0; color: #f57c00; }
    .info-type-note { background: #e1f5fe; color: #0288d1; }
    .info-type-hint { background: #e8f5e9; color: #388e3c; }
    .info-type-docs { background: #f3e5f5; color: #7b1fa2; }
    
    .info-header {
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
      background: #fff;
    }
    
    .info-code {
      font-family: monospace;
      padding: 2px 4px;
      background: rgba(0,0,0,0.05);
      border-radius: 3px;
    }
    
    .code {
      font-family: monospace;
      white-space: pre;
      display: inline;
    }
    
    span.code:not(.code-section *) {
      background: #f5f5f5;
      border-radius: 3px;
    }
    
    .code-section {
      position: relative;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
      margin: 8px 0;
      font-family: monospace;
      white-space: pre;
    }
    
    .code-metadata {
      font-family: monospace;
      color: #666;
      font-size: 0.9em;
      padding: 4px 8px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .code-line {
      padding: 0 8px;
      display: flex;
      align-items: flex-start;
      min-height: 1.5em;
      line-height: 1.5;
      white-space: pre;
    }
    
    .code-content {
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      display: inline;
    }
    
    .lineno {
      color: #999;
      padding-right: 10px;
      min-width: 3em;
      text-align: right;
      user-select: none;
      position: sticky;
      left: 0;
      background: inherit;
    }
    
    /* Highlight messages */
    .highlight-messages {
      margin: 4px 0;
      padding-left: calc(3em + 18px);
      border-top: 1px solid #e0e0e0;
    }
    
    .highlight-message {
      padding: 4px 8px;
      margin: 4px 0;
      background: #fff;
      border-radius: 3px;
      border: 1px solid #e0e0e0;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .highlight-message:hover {
      background: #f5f5f5;
    }
    
    .highlight-active {
      background-color: #fff3e0 !important;
    }
    
    .side-note {
      padding: 12px 0;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 12px;
    }
    
    .side-note:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    
    .close-note {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 0;
      color: #666;
      cursor: pointer;
    }
    
    .close-note:hover {
      color: #d32f2f;
    }
    
    .close-note::after {
      content: '×';
      font-size: 1.5em;
      margin-left: 4px;
    }
    
    .unknown-component {
      display: inline-block;
      width: 1.5em;
      height: 1.5em;
      line-height: 1.5em;
      text-align: center;
      background: #ffebee;
      color: #d32f2f;
      border-radius: 50%;
      font-weight: bold;
      cursor: help;
    }
  </style>
  
  <script>
    const hlInfo = {{ hl_info_map | tojson | safe }};
    let scrollPositions = {};
    
    function saveScrollPositions() {
      scrollPositions = {
        main: document.getElementById('main').scrollTop,
        side: document.getElementById('side').scrollTop
      };
      localStorage.setItem('scrollPositions', JSON.stringify(scrollPositions));
    }
    
    function restoreScrollPositions() {
      const savedPositions = localStorage.getItem('scrollPositions');
      if (savedPositions) {
        const positions = JSON.parse(savedPositions);
        document.getElementById('main').scrollTop = positions.main || 0;
        document.getElementById('side').scrollTop = positions.side || 0;
      }
    }
    
    function handleHighlightHover(event, groups) {
      const highlightElements = document.querySelectorAll(`[data-groups~="${groups.join(' ')}"]`);
      highlightElements.forEach(el => {
        el.classList.add('highlight-active');
      });
    }
    
    function handleHighlightLeave(event, groups) {
      const highlightElements = document.querySelectorAll(`[data-groups~="${groups.join(' ')}"]`);
      highlightElements.forEach(el => {
        el.classList.remove('highlight-active');
      });
    }
    
    function handleSideInfo(event, sideEntryId, edgeId = 0) {
      saveScrollPositions();
      // Mark clicked edge as active
      document.querySelectorAll('.side-edge').forEach(edge => edge.classList.remove('active'));
      event.currentTarget.classList.add('active');
      
      fetch(`/edge?side_info_id=${sideEntryId}&edge_id=${edgeId}`)
        .then(r => r.text())
        .then(_ => {
          window.location.reload();
          // Scroll positions will be restored on load
        })
        .catch(err => console.error('Side info error:', err));
    }
    
    function handleClick(event, componentId) {
      saveScrollPositions();
      let clickType = 'CLICK';
      if (event.ctrlKey && event.shiftKey) {
        clickType = 'CLICK_INTERACTIVE_ROLLBACK';
      } else if (event.ctrlKey) {
        clickType = 'CLICK_INTERACTIVE';
      }
      fetch(`/click?component_id=${componentId}&click_type=${clickType}`)
        .then(r => r.text())
        .then(_ => window.location.reload())
        .catch(err => console.error('Click error:', err));
    }
    
    function closeSide(id) {
      saveScrollPositions();
      fetch(`/close?side_note_id=${id}`)
        .then(r => r.text())
        .then(_ => window.location.reload())
        .catch(err => console.error('Close error:', err));
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      restoreScrollPositions();
      
      // Save scroll position on scroll
      ['main', 'side'].forEach(id => {
        document.getElementById(id).addEventListener('scroll', () => {
          saveScrollPositions();
        });
      });
      
      // Initialize highlight handlers
      document.querySelectorAll('.highlight-message').forEach(msg => {
        const groups = msg.getAttribute('data-groups').split(' ');
        msg.addEventListener('mouseenter', (e) => handleHighlightHover(e, groups));
        msg.addEventListener('mouseleave', (e) => handleHighlightLeave(e, groups));
      });
    });
  </script>
</head>
<body>
  <div id="main">
    {% for diag in diagnostics %}
      {% include "components/diagnostic.html" %}
    {% endfor %}
  </div>

  <div id="side">
    {% for idx, note in side_notes | enumerate %}
      {% include "components/side_note.html" %}
    {% endfor %}
  </div>
</body>
</html>
