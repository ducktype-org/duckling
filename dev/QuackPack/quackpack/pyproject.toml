[project]
name = "quackpack"
version = "0.1.0"
description = "Package manager for Duckling"
readme = "README.md"
authors = [
    { name = "Ignacy Gębuś", email = "ig448499@students.mimuw.edu.pl" },
    { name = "Tymoteusz Kucharek", email = "tk448520@students.mimuw.edu.pl" },
    { name = "Stanisław Wiśniewski", email = "sw448598@students.mimuw.edu.pl" },
    { name = "Artur Wojtuszkiewicz", email = "aw448602@students.mimuw.edu.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "common",
    "rich-argparse>=1.6.0",
    "pydantic>=2.10.4",
    "pyyaml>=6.0.2",
    "pycurl>=7.45.4",
    "gitpython>=3.1.44",
    "uvloop>=0.21.0",
]

[project.scripts]
quackpack = "quackpack:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.pyright]
venvPath = "./"
venv = ".venv/"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.7",
]
