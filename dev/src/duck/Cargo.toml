[package]
name = "duck"
version = "0.3.0"
edition.workspace = true
publish.workspace = true

[workspace]
members = [".", "duck_core", "quackpack", "duck-fmt"]
default-members = [".", "duck_core", "quackpack"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.4", features = ["cargo"] }
console = { version = "0.16.4", default-features = false, features = ["std"] }
curl = "0.4.50"
git2 = { version = "0.21.0", features = ["cred", "https", "ssh"] }
itertools = "0.15.0"
libc = "0.2.189"
libgit2-sys = "0.18.7"
openssl = "0.10.81"
openssl-sys = "0.9.117"
rusqlite = { version = "0.39.0", default-features = false, features = ["cache", "bundled"] }
# Disable `default-features`, so we don't enable the default `bindgen` feature,
# which uses `bindgen` dependency, which requires `libclang` DLL, which is sometimes missing in CI...
# Our default SCiP (bundled) has pinned release, so bindings are deterministic and are downloaded.
# NOTE: `from-source` pulls-in `bindgen`.
russcip = { version = "0.10.0", default-features = false }
scip-sys = { version = "0.1.28", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde-untagged = "0.1.9"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

httpmock = { version = "0.8.3", default-features = false }
windows-sys = { version = "0.61.2", features = [ "Win32_Foundation", "Win32_System_Console"] }
duck_core = { path = "duck_core" }
quackpack = { path = "quackpack", default-features = false }

[dependencies]
clap = { workspace = true }
clap_complete = { version = "4.6.7", optional = true }
console = { workspace = true }
curl = { workspace = true }
duck_core = { workspace = true }
git2 = { workspace = true }
itertools = { workspace = true }
libgit2-sys = { workspace = true }
openssl = { workspace = true }
openssl-sys = { workspace = true }
quackpack = { workspace = true }
rusqlite = { workspace = true }
russcip = { workspace = true }
scip-sys = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }

[features]
# Hack around https://github.com/scipopt/scip-sys/issues/39
default = ["bundled-scip", "shell-completion"]

shell-completion = ["dep:clap_complete"]

bundled-all = ["bundled-sqlite3", "bundled-openssl", "bundled-git2", "bundled-curl", "static-scip"]
bundled-curl = ["curl/static-curl", "curl/force-system-lib-on-osx"]
bundled-git2 = ["libgit2-sys/vendored"]
bundled-openssl = ["openssl/vendored"]
bundled-sqlite3 = ["rusqlite/bundled"]
bundled-scip = ["russcip/bundled", "quackpack/bundled-scip"]
static-scip = ["russcip/from-source", "quackpack/static-scip"]
