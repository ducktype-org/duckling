[package]
name = "duck"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "duck"
path = "src/lib/lib.rs"

[[bin]]
name = "duck"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.4", features = ["cargo"] }
clap_complete = { version = "4.6.7", optional = true }
console = { version = "0.16.4", default-features = false, features = ["std"] }
curl = "0.4.50"
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
futures = "0.3.33"
git2 = "0.21.0"
http = "1.4.2"
itertools = "0.15.0"
libc = "0.2.189"
libgit2-sys = "0.18.7"
libssh2-sys = "0.3.2"
openssl = "0.10.81"
openssl-sys = "0.9.117"
percent-encoding = { version = "2.3.2", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["perf", "std"] }
rusqlite = { version = "0.39.0", default-features = false, features = ["cache", "bundled"] }
# Disable `default-features`, so we don't enable the default `bindgen` feature,
# which uses `bindgen` dependency, which requires `libclang` DLL, which is sometimes missing in CI...
# Our default SCiP (bundled) has pinned release, so bindings are deterministic and are downloaded.
# NOTE: `from-source` pulls-in `bindgen`.
russcip = { version = "0.10.0", default-features = false }
scip-sys = { version = "0.1.28", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde-untagged = "0.1.9"
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
shellexpand = "3.1.2"
soft-canonicalize = "0.5.6"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [ "Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
httpmock = { version = "0.8.3", default-features = false }

[features]
# Hack around https://github.com/scipopt/scip-sys/issues/39
default = ["bundled-scip"]

shell-completion = ["dep:clap_complete"]

bundled-all = ["bundled-sqlite3", "bundled-openssl", "bundled-git2", "bundled-ssh2", "bundled-curl", "static-scip"]
bundled-curl = ["curl/static-curl", "curl/force-system-lib-on-osx"]
bundled-git2 = ["libgit2-sys/vendored"]
bundled-openssl = ["openssl/vendored"]
bundled-sqlite3 = ["rusqlite/bundled"]
bundled-ssh2 = ["libssh2-sys/vendored-openssl"]
# NOTE: These two should not be enabled at the same time.
bundled-scip = ["russcip/bundled"]
static-scip = ["russcip/from-source"]
