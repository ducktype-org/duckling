[package]
name = "duck"
version = "0.1.0"
edition = "2024"

[lib]
name = "duck_lib"
path = "src/lib/lib.rs"

[[bin]]
name = "duck"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["cargo"] }
clap_complete = { version = "4.5.58", optional = true }
console = "0.16.1"
itertools = "0.14.0"
paste = "1.0.15"
rustvil = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
symbol_table = { version = "0.5.0", features = ["global", "serde"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.23.0"

[features]
shell-completion = ["clap_complete"]
