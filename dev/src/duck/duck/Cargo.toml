[package]
name = "duck"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["cargo"] }
clap_complete = "4.5.58"
console = "0.16.1"
itertools = "0.14.0"
paste = "1.0.15"
quackpack = { version = "0.1.0", path = "../quackpack" }
rustvil = "0.4.0"
thiserror = "2.0.17"
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[profile.test]
opt-level = 0
debug = true
lto = false
codegen-units = 1
incremental = false

[dev-dependencies]
quackpack = { version = "0.1.0", path = "../quackpack", features = ["test_utils"] }
