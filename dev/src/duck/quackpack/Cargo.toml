[package]
name = "quackpack"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
paste = "1.0.15"
rustvil = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
symbol_table = { version = "0.5.0", features = ["global", "serde"] }
