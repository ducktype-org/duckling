[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duckling-kernel"
version = "0.2.0"
description = "Jupyter kernel for the Duckling language"
requires-python = ">=3.10"
dependencies = ["ipykernel>=6", "jupyter_client>=7"]

[tool.setuptools]
packages = ["duckling_kernel"]
