metadata:
  id: error.type_check.no_match_2op
  code: 1001
  active_from: 0.0.1
  active_until: now

params:
  operator:
    description: "The operator which does not match."
  left_type:
    description: "Type of the left operand."
  right_type:
    description: "Type of the right operand."
  is_static:
    description: "Whether the error is displayed in a static message."
  has_expanded_left_type:
    description: "Whether the type of the left operand can be expanded."
  expanded_left_type:
    description: "Expanded type of the left operand."
    optional: true
  has_expanded_right_type:
    description: "Whether the type of the right operand can be expanded."
  expanded_right_type:
    description: "Expanded type of the right operand."
    optional: true

header_message:
  - "no matching `{{ operator }}` "
  - on: "operator"
    include:
      type: docs
      family: operator
      name: general
  - " for types `{{ left_type }}`{{ opt_expanded_left_type }}"
  - " and `{{ right_type }}`{{ opt_expanded_right_type }}"

pointer_messages:
  cause:
    priority: 1
    type: error
    content: "used here"

fragments:
  opt_expanded_left_type:
    - case: "{{ is_static }}"
      of:
        true:
          - case: "{{ has_expanded_left_type }}"
            of:
              true: " (aka `{{ expanded_left_type }}`)"
              "[other]":
        "[other]":
  opt_expanded_right_type:
    - case: "{{ is_static }}"
      of:
        true:
          - case: "{{ has_expanded_right_type }}"
            of:
              true: " (aka `{{ expanded_right_type }}`)"
              "[other]":
        "[other]":