metadata:
  type: "docs"
  family: "builtin"
  name: "type_integer"
  code: "1001"
  active_from: "0.0.1"
  active_until: "now"

header_message:
  - "type `"
  - param: "type"
  - "` is a built-in "
  - case:
      param: "is_signed"
    of:
      true: "signed"
      "[other]": "unsigned"
  - " integer type stored in "
  - param: "bit_count"
  - " bits"

params:
  type:
    description: "Integer type referred to."
  bit_count:
    description: "Number of bits used for this type."
  is_signed:
    description: "Whether this type is signed."