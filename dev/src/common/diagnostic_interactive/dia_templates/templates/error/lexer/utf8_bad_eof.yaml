metadata:
  type: "error"
  family: "lexer"
  name: "utf8_bad_eof"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code_location:
    description: "The location of the error."
  byte:
    description: "The byte offset where the error occurred."
  code_point_start:
