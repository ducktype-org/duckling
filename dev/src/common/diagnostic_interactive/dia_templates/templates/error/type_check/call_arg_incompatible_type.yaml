metadata:
  type: "error"
  family: "type_check"
  name: "call_arg_incompatible_type"
  code: "6001"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"


params:
  given_type:
    description: "The given type of the argument."
  expected_type:
    description: "The expected type of the argument."
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."
  function_name:
    description: "The name of the function being called."
    optional: true


header_message:
  - case:
      is_param_provided: "function_name"
    of:
      true:
        - "Failed to call `"
        - param: "function_name"
        - "``."
      false: []
  - "The given argument type `"
  - param: "given_type"
  - "` is incompatible with the expected type `"
  - param: "expected_type"
  - "`."


description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"


pointer_messages:
  cause:
    priority: 1
    type: "error"
    content: []

