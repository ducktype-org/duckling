metadata:
  type: "error"
  family: "type_check"
  name: "call_arg_unknown_named"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"


params:
  argument_name:
    description: "Identifier of the named argument that is not part of the function signature."
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."

header_message:
  - "Named argument `"
  - param: "argument_name"
  - "` is not defined in the callee's parameter list."


description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"


pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "unknown named argument provided here"
