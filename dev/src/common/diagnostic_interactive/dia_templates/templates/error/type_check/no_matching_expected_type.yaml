      url:
        param: "message_id"
      content:
        - "Accepted type `"
        - param: "accepted_type"
        - "`: see why the conversion to it is not possible."
    params:
      accepted_type:
        description: "One of the types accepted in this place."
      message_id:
        description: "The message ID with the error of the conversion to this type."
