metadata:
  type: "error"
  family: "type_check"
  name: "inherited_type_with_specifiers"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"


params:
  class_name:
    description: "Name of the class that declares the inheritance."
  inheritance_kind:
    description: "Whether the rejected type is the extended class or an implemented interface."
  inherited_type:
    description: "The rejected type, as written by the user."
  specifiers:
    description: "The specifiers found on the rejected type."
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."


header_message:
  - "Type `"
  - param: "inherited_type"
  - "` cannot be used as the "
  - param: "inheritance_kind"
  - " of class `"
  - param: "class_name"
  - "`: specifiers ("
  - param: "specifiers"
  - ") are not allowed here."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"


pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "here"
