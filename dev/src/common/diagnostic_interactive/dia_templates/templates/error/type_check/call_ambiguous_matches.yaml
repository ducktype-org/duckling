    priority: 1
    type: "error"
    content: 
      - "value used here"

explore_links:
  exact_matches:
    content:
      content:
        - "Found "
        - param: "no_matches"
        - " exact matches."
      url:
        param: "linked_diagnostic"
    params:
      no_matches:
        description: "Number of exact matches found."
      linked_diagnostic:
        description: "A link to a diagnostic message showing the exact matches."
  ambiguous_matches:
    content:
      content:
        - "Found "
        - param: "no_matches"
        - " coercible matches."
      url:
        param: "linked_diagnostic"
    params:
      no_matches:
        description: "Number of coercible matches found."
      linked_diagnostic:
        description: "A link to a diagnostic message showing the coercible matches."
  failed_matches:
    content:
      content:
        - "Found "
        - param: "no_matches"
        - " failed matches."
      url:
        param: "linked_diagnostic"
