metadata:
  type: "error"
  family: "type_check"
  name: "call_ambiguous_matches"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"


params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."


header_message:
  - "Call failed due to ambiguous overload resolution."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"


pointer_messages:
  cause:
    priority: 1
    type: "error"
    content: 
      - "here"

explore_links:
  exact_candidates:
    content:
      - "Found "
      - param: "no_candidates"
      - " exact matches for the call."
    params:
      no_candidates:
        description: "The number of exact matches found."
  coercible_candidates:
    content:
      - "Found "
      - param: "no_candidates"
      - " coercible matches for the call."
    params:
      no_candidates:
        description: "The number of coercible matches found."
  failed_candidates:
    content:
      url: 
        param: "message_id" 
      content:
      - "Found "
      - param: "no_candidates"
      - " candidates where the call failed."
    params:
      no_candidates:
        description: "The number of failed matches found."
      message_id:
        description: "The message ID containing details about the failed candidates."
