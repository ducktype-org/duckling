metadata:
  type: "error"
  family: "type_check"
  name: "incompatible_types"
  code: "100"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"


params:
  given_type:
    description: "The given type."
  expected_type:
    description: "The expected type."
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."


header_message:
  - "Call failed due to ambiguous overload resolution."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"


pointer_messages:
