metadata:
  type: "error"
  family: "type_check"
  name: "call_arg_missing_argument"
  code: "6007"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"


params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."
  function_name:
    description: "The name of the function being called."
    optional: true


header_message:
  - case:
      is_param_provided: "function_name"
    of:
      true:
        - "Failed to call "
        - param: "function_name"
        - ". "
      false: []
  - "The call is missing a required argument with no default value."


description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"


pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "call site is missing this argument"
