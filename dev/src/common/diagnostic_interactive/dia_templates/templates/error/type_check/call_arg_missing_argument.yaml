metadata:
  type: "error"
  family: "type_check"
  name: "call_arg_missing_argument"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet of the function call."
  code_location:
    description: "The location of the function call code snippet."
  missing_arg_code:
    description: "The code snippet of function declaration where the argument is missing."
    optional: true
  missing_arg_code_location:
    description: "The location of the function declaration code snippet where the argument is missing."
    optional: true

header_message:
  - "The call is missing a required argument with no default value."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"
  - case:
      is_param_provided: "missing_arg_code"
    of:
      true:
        - "For the function declared here: "
        - codeblock:
            param: "missing_arg_code"
          location:
            param: "missing_arg_code_location"
      false: "The function declaration is not available."

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content: []
  missing_arg:
    priority: 1
    type: "error"
    content:
      - "missing argument is required here"
