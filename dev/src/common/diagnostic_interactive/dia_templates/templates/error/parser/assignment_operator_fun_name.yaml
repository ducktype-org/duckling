metadata:
  type: "error"
  family: "parser"
  name: "assignment_operator_fun_name"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."
  operator:
    description: "The assignment operator used as a function name."

header_message:
  - "Custom assignment operators such as `"
  - param: "operator"
  - "` are not supported yet. Define the base operator instead."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "here"
