metadata:
  type: "error"
  family: "parser"
  name: "bad_statement_choice"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."
  type_name:
    description: "The name of the type expected."

header_message:
  - "Token doesn't match with chosen statement of `"
  - param: "type_name"
  - "`."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "here"
