metadata:
  type: "error"
  family: "parser"
  name: "no_identifier"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."
  but_got:
    description: "What was found instead of the expected identifier."

header_message:
  - "Expected an identifier here, but got: "
  - param: "but_got"
  - "."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "here"
