metadata:
  type: "error"
  family: "misc"
  name: "todo_code"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"


params:
  header_message:
    description: "The header message of the TODO error."
  
  description:
    description: "The detailed description of the TODO error."
  
  code:
    description: "The code snippet where the TODO is located."
  
  code_location:
    description: "Location of the code snippet."
    component_type: "code_location"
  
  pointer_message_content:
    description: "The pointer message indicating the cause location."


header_message:
  param: "header_message"


description:
  - param: "description"
  - codeblock:
      param: "code"
    location:
      param: "code_location"


pointer_messages:
  cause:
    priority: 1
    type: "error"
    content: 
      param: "pointer_message_content"


