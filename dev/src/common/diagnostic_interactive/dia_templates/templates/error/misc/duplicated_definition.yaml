metadata:
  template_type: "message"
  type: "error"
  family: "misc"
  name: "duplicated_definition"
  code: "1002"  
  active_from: "0.0.1"
  active_until: "now"

params:
  symbol_name:
    description: "The name of the duplicated symbol/function."
    component_type: "text"
  code:
    description: "The code snippet where the duplicated definition occurred."
  code_location:
    description: "The location of the code snippet."
  pointer_message_content:
    description: "Text under the error indicator arrows."
    component_type: "text"

header_message:
  - "Symbol '"
  - param: "symbol_name"
  - "' is already defined."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content: 
      param: "pointer_message_content"
