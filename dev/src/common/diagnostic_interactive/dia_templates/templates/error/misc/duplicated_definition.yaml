metadata:
  template_type: "message"
  type: "error"
  family: "misc"
  name: "duplicated_definition"
  code: "1002"  
  active_from: "0.0.1"
  active_until: "now"

params:
  symbol_name:
    description: "The name of the duplicated symbol/function."
    component_type: "text"
  pointer_message_content:
    description: "Text under the error indicator arrows."
    component_type: "text"

header_message:
  - "symbol '"
  - param: "symbol_name"
  - "' is already defined" 

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content: 
      param: "pointer_message_content"