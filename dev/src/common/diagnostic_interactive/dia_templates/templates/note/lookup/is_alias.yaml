metadata:
  type: "note"
  family: "lookup"
  name: "is_alias"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

header_message:
  - "name `"
  - param: "alias_name"
  - "` is an alias for `"
  - param: "underlying_name"
  - "`"



params:
  alias_name:
    description: "The name which is an alias for another name."
  underlying_name:
    description: "The name the alias evaluates to."