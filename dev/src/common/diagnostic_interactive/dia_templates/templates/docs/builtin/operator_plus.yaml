metadata:
  type: "docs"
  family: "builtin"
  name: "operator_plus"
  code: "1101"
  active_from: "0.0.1"
  active_until: "now"

header_message:
  - "operator "
  - macro: "plus"
  - " is a built-in operator which computes the sum of both arguments"

description:
  - "The "
  - macro: "plus"
  - " operator specifically requires the first argument to be of type `"
  - param: "first_arg_type"
  - "` and the second argument to be of type `"
  - param: "second_arg_type"
  - "`."

params:
  first_arg_type:
    description: "Type of first argument of this operator."
  second_arg_type:
    description: "Type of second argument of this operator."

macros:
  plus:
    - "`+("
    - param: "first_arg_type"
    - ", "
    - param: "second_arg_type"
    - ")`"