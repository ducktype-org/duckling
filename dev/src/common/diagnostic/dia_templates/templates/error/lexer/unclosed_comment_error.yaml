metadata:
  type: "error"
  family: "lexer"
  name: "unclosed_comment_error"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."
  closing_delimiter:
    description: "The expected closing delimiter for the block comment."

header_message:
  - "Unclosed block comment starting here. Expected closing delimiter `"
  - param: "closing_delimiter"
  - "`."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "here"
