metadata:
  type: "error"
  family: "parser"
  name: "opening_bracket_missing"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."
  bracket:
    description: "The expected opening bracket."
  list_type:
    description: "The type of list being parsed."

header_message:
  - "Opening bracket "
  - param: "bracket"
  - " of a "
  - param: "list_type"
  - " list expected after here."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "here"
