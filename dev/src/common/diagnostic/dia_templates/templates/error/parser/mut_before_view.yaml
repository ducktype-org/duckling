metadata:
  type: "error"
  family: "parser"
  name: "mut_before_view"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the `mut` keyword."
  view:
    description: "The view written after `mut`, like `ref`."

header_message:
  - "`mut` is written after the view: `"
  - param: "view"
  - " mut`, not `mut "
  - param: "view"
  - "`."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"
  - "In a writable view `mut` follows the view, like in `ref mut T` or `ptr mut T`."

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "did you mean `"
      - param: "view"
      - " mut`?"
