metadata:
  type: "error"
  family: "parser"
  name: "operator_without_operands"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The parameter list of the operator declaration."
  code_location:
    description: "The location of the parameter list."

header_message:
  - "Operator declarations must take at least one operand."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "expected 1 or 2 operands, but 0 are declared"
