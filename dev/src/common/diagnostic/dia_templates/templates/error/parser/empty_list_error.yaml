metadata:
  type: "error"
  family: "parser"
  name: "empty_list_error"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."
  list_type:
    description: "The type of the list."

header_message:
  - "This "
  - param: "list_type"
  - " list shouldn't be empty."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "here"
