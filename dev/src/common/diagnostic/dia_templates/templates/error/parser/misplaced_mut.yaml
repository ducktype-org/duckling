metadata:
  type: "error"
  family: "parser"
  name: "misplaced_mut"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the `mut` keyword."

header_message:
  - "`mut` can only follow `ref`, `ptr`, `manyptr`, `cptr` or `slice`."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"
  - "`mut` is a part of a writable view, like `ref mut T`. Whether a variable, a parameter or a field may be changed is a part of its declaration: it can be changed unless it is declared with `let`."

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "`mut` here"
