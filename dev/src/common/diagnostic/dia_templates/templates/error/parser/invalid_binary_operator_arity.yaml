metadata:
  type: "error"
  family: "parser"
  name: "invalid_binary_operator_arity"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The parameter list of the operator declaration."
  code_location:
    description: "The location of the parameter list."
  declared_operands:
    description: "The number of declared operands, including the implicit `self` of a method."
  has_self:
    description: "Whether the operator is a non-static method, whose `self` is the first operand."

header_message:
  - "Binary operator declarations must take exactly two operands."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "expected 2 operands, but "
      - param: "declared_operands"
      - case:
          param: "declared_operands"
        of:
          "1": " is declared"
          default: " are declared"
      - case:
          param: "has_self"
        of:
          "true": ", including `self` as the first"
          "false": []
