metadata:
  type: "error"
  family: "type_check"
  name: "block_expr_not_allowed"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  place:
    description: "Where the block expression is used, e.g. `a default argument`."
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."

header_message:
  - "A block expression cannot be used in "
  - param: "place"
  - "."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content: "block expression used here"
