  family: "type_check"
  name: "no_enclosing_loop"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  action:
    description: "The break or continue keyword."
  code:
    description: "The code snippet."
  code_location:
    description: "The location of the action."

header_message:
  - "`"
