metadata:
  type: "error"
  family: "type_check"
  name: "const_in_type"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet."
  code_location:
    description: "The location of the `const` keyword used in a type."

header_message:
  - "`const` declares a compile-time constant and is not a part of a type."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"
  - "To mark a type as immutable, write `imm` instead of `const`."

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "`const` used as a type qualifier here"
