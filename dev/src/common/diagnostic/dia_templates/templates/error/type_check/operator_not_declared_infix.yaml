metadata:
  type: "error"
  family: "type_check"
  name: "operator_not_declared_infix"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  operator:
    description: "The identifier used as an infix operator."
  code:
    description: "The code snippet."
  code_location:
    description: "The location."

header_message:
  - "`"
  - param: "operator"
  - "` cannot be used as an infix operator because no matching declaration is marked `infix`."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "error"
    content:
      - "used as an infix operator here"
