metadata:
  type: "note"
  family: "lexer"
  name: "end_block_note"
  code: "0"
  active_from: "0.0.1"
  active_until: "now"
  template_type: "message"

params:
  code:
    description: "The code snippet where the error occurred."
  code_location:
    description: "The location of the code snippet."
  closing_bracket:
    description: "The expected closing bracket."

header_message:
  - "Expected to be closed with "
  - param: "closing_bracket"
  - "."

description:
  - codeblock:
      param: "code"
    location:
      param: "code_location"

pointer_messages:
  cause:
    priority: 1
    type: "note"
    content:
      - "here"
