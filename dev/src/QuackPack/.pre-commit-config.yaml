repos:
  - repo: local
    hooks:
      # Run code formatter.
      - id: format
        name: Run formatter
        entry: uv
        args: [ run, ruff, format, --diff ]
        types: [ python ]
        stages: [ pre-push ]
        language: system
      # Run code linter.
      - id: lint
        name: Run linter
        entry: uv
        args: [ run, ruff, check ]
        types: [ python ]
        stages: [ pre-push ]
        language: system
      # Run static type-checker.
      - id: pyright
        name: Run pyright
        entry: uv
        args: [ run, pyright ]
        pass_filenames: false
        types: [ python ]
        stages: [ pre-push ]
        language: system
