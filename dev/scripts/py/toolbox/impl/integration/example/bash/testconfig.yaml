Tests:
  test-shell-cat:
    Run: "cat @{run_args}"
    run_args: ""
    Cases:
      hello-world:
        Input:
          String: "Hello, world!"
        Output:
          String: "Hello, world!"
      error-no-file:
        run_args: inexistent-file
        ExitCode: 1
  test-shell-echo:
    Run: "echo @{run_args}"
    run_args: ""
    Cases:
      hello-world:
        run_args: '"Hello, world!"'
        Output:
          String: "Hello, world!\n"
