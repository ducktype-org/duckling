name = "C++ tests"

# subtests = ["subpack1"]

[env]
lolz = "rofl"

[build]
compiler = "g++"
compile_args_misc = "-O2 -std=c++23 -Wall"

[tests.test1]
name = "Custom name"
compile_file = "file_fib.cpp"
compile_args = "-o file_fib"
run_program = "./file_fib"
[tests.test1.run_cases]
simple = { input = { string = "5" }, output = { string = "0 1 1 2 3 " } }
normal = { name = "Up to 100", input = { string = "100" }, output = { program = "python3 gen_fibs.py 100" } }
# alternative syntax to specify the test
[tests.test1.run_cases.large]
name = "Up to 1e5"
input = { string = 1e5 }
exit_code = 1

[tests.test-args]
compiler_args = ""
compiler_args_misc = ""
