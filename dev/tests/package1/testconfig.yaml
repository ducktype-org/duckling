Name: "C++ tests"

compile_flags: "-O2 -std=c++23 -Wall"
compile_args: "-o @{program_name}"

Compile: "g++ @{program_name}.cpp @{compile_args} @{compile_flags}"
Run: "./@{program_name}"
PostRun: "echo Ran @{program_name}!"
Clean: "rm -f @{program_name}"

FailFast: true
ExitCode: 0
TimeOut: 10

# SubTests = ["subpack1"]

Tests:
  fib-tests:
    Name: "Custom name"
    program_name: "file_fib"
    RunCases:
      simple:
        Input:
          string: "5"
        Output:
          string: "0 1 1 2 3 "
      normal:
        Name: "Up to 100"
        Input:
          string: "100"
        Output:
          run: "python3 gen_fibs.py 100"
      large:
        Name: "Up to 100000"
        Input:
          string: 100000
        Err:
          string: "Too large\n"
        ExitCode: 1

  test-shell-cat:
    Compile: ""
    program_name: "cat"
    Run: "@{program_name}"
    RunCases:
      hello-world:
        Input:
          string: "Hello, world!"
        Output:
          string: "Hello, world!"

  test-shell-echo:
    Compile: ""
    program_name: "echo"
    Run: "@{program_name}"
    RunCases:
      hello-world:
        RunArgs: "\"Hello, world!\""
        Output:
          string: "Hello, world!\n"
