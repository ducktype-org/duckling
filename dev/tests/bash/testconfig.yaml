Tests:
  test-shell-cat:
    Run: "cat"
    RunCases:
      hello-world:
        Input:
          string: "Hello, world!"
        Output:
          string: "Hello, world!"
      error-no-file:
        RunArgs: inexistent-file
        ExitCode: 1
  test-shell-echo:
    Run: "echo"
    RunCases:
      hello-world:
        RunArgs: '"Hello, world!"'
        Output:
          string: "Hello, world!\n"
  test-timeout:
    Run: "sleep"
    TimeOut: 1
    ExitCode: 124  # 124 means "timed out"
    RunCases:
      hello0.5:
        RunArgs: "0.5"
        ExitCode: 0
      hello1:
        RunArgs: "1"
      hello5:
        RunArgs: "5"
