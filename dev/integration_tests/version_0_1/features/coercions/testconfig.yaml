# Test configuration for coercions
# Tests implicit and explicit type coercions between numeric types

Tests:
  coercion_cast_simple_test:
    Description: Test for implicit and explicit type coercions.
    Cases:
      all:
        backend: all
        Output:
          String: "1\n30\n4\n"
        ExitCode: 0
  casts_test:
    Description: Tests for casting numerical types and booleans.
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "-1\n-1\n255\n-1\n-42\n2147483647\n-2147483648\n7\n9\n1\n123.5\n789.2\n42\n99\n3\n2\n-7\n-8\n"
        ExitCode: 0
  coercions_test:
    Description: Tests for coercing boolean value from a numerical type.
    Cases:
      all:
        backend: all
        Output:
          String: ""
        ExitCode: 0
  declaration_coercions:
    Cases:
      all:
        backend: all
        Output:
          String: "0\n1\n-1\n0\n1\n-1\n0\n1\n-1\n0\n1\n-1\n0\n1\n-1\n0\n1\n-1\n"
        ExitCode: 0
