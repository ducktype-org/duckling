# Test configuration for simple-cffi
# Tests C FFI (Foreign Function Interface) by calling libc's abs function

Tests:
  simple-cffi-test:
    Description: Tests for C FFI.
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "10\n25\n15\n"
        ExitCode: 0
      dvm:
        backend: dvm
        Output:
          String: "10\n25\n15\n"
        ExitCode: 0

  cffi-libc-test:
    Description: Tests for CFFI in complex contexts.
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "5\n7\n1\n6\n42\n100\n7\n"
        ExitCode: 0
      dvm:
        backend: dvm
        Output:
          String: "5\n7\n1\n6\n42\n100\n7\n"
        ExitCode: 0
        