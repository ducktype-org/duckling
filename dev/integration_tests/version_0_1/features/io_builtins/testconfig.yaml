# Test configuration for io-builtins
# Tests builtin output functions and print function

Tests:
  print_mixed:
    Description: printing number types and strings.
    Cases:
      all:
        backend: all
        Output:
          String: "123\n123\n3.14159\nHello, Duckling!\nTab:\tNewline:\nEnd\n15\n42\nPoint(3,4)\n"
        ExitCode: 0

  print_primitive:
    Description: printing all primitive types.
    Cases:
      all:
        backend: all
        Output:
          String: "1\n2\n3\n4\n6\n7\n8\n9\n3.14\n2.718\n()trueAHelloWorld"
        ExitCode: 0
