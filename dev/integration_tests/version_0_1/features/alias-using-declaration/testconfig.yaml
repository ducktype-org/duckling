# Test configuration for alias-using-declaration
# Tests alias (symbol aliases) and using (namespace imports)

Tests:
  alias-test:
    Description: Tests for alias declarations on functions and variables.
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "1\n10\n2\n40\n2\n"
        ExitCode: 0
      dvm:
        backend: dvm
        Output:
          String: "1\n10\n2\n40\n2\n"
        ExitCode: 0
  using-test:
    Description: Tests for using declarations to import symbols from namespaces.
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "10\n12\n9\n3\n11\n9\n8\n"
        ExitCode: 0
      dvm:
        backend: dvm
        Output:
          String: "10\n12\n9\n3\n11\n9\n8\n"
        ExitCode: 0
