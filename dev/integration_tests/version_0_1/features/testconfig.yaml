# Tests for Duckling's version 0.1.

clean_cmd: "rm -rf build"

backend: "nobackend"
# If set to "true" the produced duckling executable will be run with valgrind and checked for leaks.
valgrind: "false"

compile_dvm_options: ""
compile_llvm_options: ""
# Runs an extra deterministic compile check before normal compile_package.
# You can override this to "false" in any subtree/test when duplication-based checks fail
# for test-specific reasons (for example repeated globals or intentionally conflicting symbols).
enable_conc_deterministic_tests: "true"
# Number of duckc worker threads used for compilation and determinism checks.
duckc_worker_count: "3"

# Path to the local helper script used by the deterministic pre-check.
compile_determinism_script: "@{dev_dir}/integration_tests/compiler/compilation/scripts/concurrent_compile_determinism.py"
# Path to the helper script that runs multiple commands and asserts identical stdout/stderr/exit code.
compare_runs_script: "@{dev_dir}/integration_tests/compiler/compilation/scripts/compare_runs.py"

compile_dvm_backend_deterministically_cmd: "if [ '@{enable_conc_deterministic_tests}' = 'true' ]; then python3 @{compile_determinism_script} --duckc-path @{duckc_path} --module-name @{Name} --duckc-worker-count @{duckc_worker_count} --compile-options='@{compile_dvm_options}' --backend dvm; else true; fi"
compile_llvm_backend_deterministically_cmd: "if [ '@{enable_conc_deterministic_tests}' = 'true' ]; then python3 @{compile_determinism_script} --duckc-path @{duckc_path} --module-name @{Name} --duckc-worker-count @{duckc_worker_count} --compile-options='@{compile_llvm_options}' --backend llvm; else true; fi"

compile_dvm_backend_cmd:  "@{compile_dvm_backend_deterministically_cmd} && @{duckc_path} compile_package duck_modules/@{Name} -w @{duckc_worker_count} -a build -n package_@{Name} @{compile_dvm_options} --dvm-backend"
compile_llvm_backend_cmd: "@{compile_llvm_backend_deterministically_cmd} && @{duckc_path} compile_package duck_modules/@{Name} -w @{duckc_worker_count} -a build -n package_@{Name} @{compile_llvm_options}"

# "compile only" commands used by the all backend (determinism checks run separately before these).
compile_dvm_only_cmd: "@{duckc_path} compile_package duck_modules/@{Name} -w @{duckc_worker_count} -a build -n package_@{Name} @{compile_dvm_options} --dvm-backend"
compile_llvm_only_cmd: "@{duckc_path} compile_package duck_modules/@{Name} -w @{duckc_worker_count} -a build -n package_@{Name} @{compile_llvm_options}"

compiled_to_llvm: "./build/package_llvm.exe"
compiled_to_dvm: "./build/package_dvm.dbc"

# Deliberately empty, so as not to recompile duckc and dvm for each test.
PreNode: ""

Clean: "@{clean_cmd}"
PreCase: "@{clean_cmd} && mkdir build;
  case '@{backend}' in
    dvm)       @{compile_dvm_backend_cmd}                                                                                ;;
    llvm)      @{compile_llvm_backend_cmd}                                                                               ;;
    all)       @{compile_dvm_backend_deterministically_cmd} && @{compile_llvm_backend_deterministically_cmd} &&
               @{compile_dvm_only_cmd} && @{compile_llvm_only_cmd}                                                      ;;
    nobackend) echo 'Backend undefined'; exit 1                                                                          ;;
    *)         echo 'Unknown backend';   exit 1                                                                          ;;
  esac;"

Run: "
  case '@{backend}' in
    dvm) @{dvm_path} run @{compiled_to_dvm}       ;;
    llvm)
      if [ '@{valgrind}' = 'true' ]; then
        valgrind --leak-check=full --error-exitcode=1 @{compiled_to_llvm};
      else
        @{compiled_to_llvm};
      fi
      ;;
    all)
      _llvm=@{compiled_to_llvm};
      _dvm=\"@{dvm_path} run @{compiled_to_dvm}\";
      python3 @{compare_runs_script} --cmd llvm \"$_llvm\" --cmd dvm \"$_dvm\";
      ;;
    nobackend) echo \"Backend undefined\"; exit 1 ;;
    *)         echo \"Unknown backend\";   exit 1 ;;
  esac;"

SubDirs:
#################################
#         WORKING FULLY
#################################
  - comparison_operators_on_integers
  - constants
  - ffi
  - float_literals
  - function_call
  - namespace_declaration
  - simple_ifs
  - unit_type
#################################
#         ONLY LLVM WORKING
#################################
  - simple_cffi
  - coercions # (requires `builtin_output_f64` in DVM)
  # - first_class_typing
#################################
#         ONLY DVM WORKING
#################################
  # very funny
#################################
#         NOT WORKING
# this is mainly due to the features not being implemented yet
#################################
  # - arithmetic_operators_on_integers (requires exponentiation)
  # - overloading (requires operator names, and, in one case, string `==` comparison)
  # - primitive_integers (requires byte type)
  # - type_deduction (requires deduction for fields with initializers)
  # - function_definition (requires static variables in functions)
  # - let_simple_declaration (requires proper shadowing handling)
  # - alias_using_declaration (requires linked scopes for functions)
  # - boolean_operators (requires short-circuit evaluation)
  # - variable_simple_declaration (requires i128 and u128, also a VM bugfix)
  # - io_builtins (requires format strings and a `print` function)
  # - while_loops (requires break statements, DVM cannot perform 100M loop iters in one second)
  # - primitive_booleans (requires xor)
  # - class_declaration (requires DVM backend determinism)
  # - simple_chars (requires strings in DVM, and -(char, u8) operator — reconsider adding it.)
  # - simple_strings (requires string access operator and format strings)
