# Test configuration for primitive-booleans
# Tests boolean literals, assignment, boolean operators (and, or, not, xor), ternary expressions

Tests:
  primitive-booleans-test:
    Description: Tests for primitive boolean types and operations.
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "1\n3\n5\n7\n9\n11\n"
        ExitCode: 0
      dvm:
        backend: dvm
        Output:
          String: "1\n3\n5\n7\n9\n11\n"
        ExitCode: 0
  boolean-expressions-test:
    Description: Tests for primitive boolean types and operations.
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "100\n200\n50\n20\n1\n2\n3\n4\n5\n10\n15\n"
        ExitCode: 0
      dvm:
        backend: dvm
        Output:
          String: "100\n200\n50\n20\n1\n2\n3\n4\n5\n10\n15\n"
        ExitCode: 0
