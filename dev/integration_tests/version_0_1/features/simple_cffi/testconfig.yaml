# Test configuration for simple-cffi
# Tests C FFI (Foreign Function Interface) by calling libc's abs function
# Note: This test is separate from ffi test, because of architectural differences
#       I can change it upon request.

Tests:
  cffi_libc_test:
    Description: Tests for CFFI in complex contexts.
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "5\n7\n1\n6\n42\n100\n7\n"
        ExitCode: 0
      dvm:
        backend: dvm
        Output:
          String: "5\n7\n1\n6\n42\n100\n7\n"
        ExitCode: 0
        