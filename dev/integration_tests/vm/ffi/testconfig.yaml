# Tests for loading system shared libraries for FFI symbol resolution:
# the `--ffi-lib` CLI option and bare sonames in `ffi object` declarations.

# Deliberately empty, the parent node already compiles the VM.
PreNode: ""

# Bare soname of the system math library, resolved by the platform's dynamic loader
# (libm.so.6 on Linux, libm.dylib on macOS).
Env:
    math_lib: '[ "@{is_macos}" = true ] && echo libm.dylib || echo libm.so.6'

Tests:
  ffi-system-lib:
    Cases:
      cli-option:
        Run: "@{dvm_path} run cos.dbc --ffi-lib $math_lib"
        Output:
          String: "1\n"
      # cos_ffi_object.dbc bakes in `libm.so.6`; copy it to a scratch dir and rewrite the soname
      # to the platform's before running.
      bare-soname-in-bytecode:
        Env:
            DIT_TMP_DIR: "@{new_tmp_dir}"
        tmp_env_files: "cos_ffi_object.dbc"
        PreCase: "@{make_tmp_env}"
        Run: '@{at_tmp_env} "sed \"s|libm.so.6|$math_lib|\" cos_ffi_object.dbc > prog.dbc && @{dvm_path} run prog.dbc"'
        PostCase: "@{cleanup_tmp_env}"
        Output:
          String: "1\n"
      # The quoted grep pattern must be a single word, DIT splits the command naively.
      missing-library-fails:
        Run: "@{dvm_path} run cos.dbc --ffi-lib libduckling_no_such_lib.so 2>&1 | grep -c Failed"
        Output:
          String: "1\n"
