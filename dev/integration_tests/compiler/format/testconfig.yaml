# Formatter (duckfmt) CLI tests

compile_duckfmt: "cmake --build @{build_dir} -j -- duckfmt"
PreNode: "@{compile_duckfmt}"

Run: "@{duckfmt_path} @{run_args}"

Tests:
  format-cli:
    Cases:
      format-stdout:
        # Default formatting prints normalized source (comments included) to stdout.
        run_args: "format_unformatted.duck"
        Output:
          File: format_formatted.duck
      format-check-ok:
        # --check succeeds (exit 0) on an already-formatted file.
        run_args: "-k format_formatted.duck"
      format-check-fail:
        # --check fails (exit 1) on an unformatted file.
        run_args: "-k format_unformatted.duck"
        ExitCode: 1
      format-missing-config:
        # A non-existent config path errors cleanly instead of crashing.
        run_args: "-c does_not_exist.json format_unformatted.duck"
        ExitCode: 1
