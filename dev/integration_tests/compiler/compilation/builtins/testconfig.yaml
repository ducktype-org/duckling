# Tests for statements

Tests:
  new_builtins:
    Cases:
      dvm:
        backend: dvm
        ExitCode: 0
        Output:
          String: "HELLO\nH0falsetruetrueptr(null)"
  # Freeing a table of aggregates that hold a pointer only leaks on stderr, so `Err` is what makes
  # this case fail - the exit code stays 0 either way.
  dvm_alloc_nested:
    Cases:
      dvm:
        backend: dvm
        ExitCode: 0
        Output:
          String: "5\n"
        Err:
          String: ""
  numeric_io:
    Cases:
      llvm:
        backend: llvm
        Input:
          String: "42\n-42\n18446744073709551615\n3.141\n-6.022e+23\n"
        Output:
          String: "42\n-42\n18446744073709551615\n3.141\n-6.022e+23\n"
      # @TODO: #1782 Add dvm test when DVM supports more builtins.
  to_string:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "123.14dtrue()(John Smith,42,1.69)Person(John Smith,42,1.69)ptr()"
  format_strings:
    Cases:
      llvm:
        backend: llvm
        Input:
          String: "John\n42\n69\n"
        Output:
          String: "What is your name?\nWhat is your favourite number?\nAnd another?\nHello John, did you know that 42 + 69 = 111?\n"
