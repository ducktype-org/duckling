# Multi-package compilation tests.
#
# Exercises `duckc compile_packages` driven by a JSON manifest:
# multiple packages, mixed strategies (lib/.a, dvm/.dbc, native/.exe),
# linker + archiver options, all in one invocation.
# DVM artifacts are produced but not executed (DVM execution not yet hooked up
# for multi-package output).

# linking_options in the manifest reference artifacts as build/...;
# rewrite them to the case's tmp build dir in a generated copy. The
# pattern is anchored to a preceding quote or space, so that only whole
# path tokens starting with build/ are rewritten.
case_manifest: "$DIT_TMP_DIR/manifest.json"
make_manifest: 'sed "s|\([\" ]\)build/|\1$DIT_TMP_DIR/build/|g" duck_modules/@{Name}/manifest.json > @{case_manifest}'

# The manifest's linking options name the libraries by their path in @{case_build}, so the
# check has to build there too - see its `--build-dir`.
compile_deterministically_cmd: "if [ '@{enable_conc_deterministic_tests}' = 'true' ]; then python3 @{compile_determinism_script} --duckc-path @{duckc_path} --manifest @{case_manifest} --duckc-worker-count @{duckc_worker_count} --build-dir @{case_build}; else true; fi"
compile_only_cmd:  "@{duckc_path} compile_packages @{case_manifest} -w @{duckc_worker_count} -a @{case_build}"


PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts} && @{make_manifest} && @{compile_deterministically_cmd} && @{compile_only_cmd}"

# Run only LLVM executables; DVM run is intentionally skipped.
Run: "@{case_build}/app1.exe && @{case_build}/app2.exe && @{case_build}/app3.exe && @{case_build}/app3_alias.exe && @{case_build}/app4.exe"

Tests:
  multi_package:
    Cases:
      all:
        Output:
          String: "10\n42\n20\n73\n42\n42\n73\n1\n"
        ExitCode: 0
