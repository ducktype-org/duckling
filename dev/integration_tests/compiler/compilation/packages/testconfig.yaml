# Multi-package compilation tests.
#
# Exercises `duckc compile_packages` driven by a JSON manifest:
# multiple packages, mixed strategies (lib/.a, dvm/.dbc, native/.exe),
# linker + archiver options, all in one invocation.
# DVM artifacts are not executed, with one exception: a `dvm_exe` output only
# carries its own package's code, so `app2_dvm_linked.dbc` uses
# `dvm_linking_options` to pull in the dependency `.dbc` (and to load a shared
# library) and is therefore runnable.

# DVM fails in determinizm check
enable_conc_deterministic_tests: "false"


# linking_options in the manifest reference artifacts as build/...;
# rewrite them to the case's tmp build dir in a generated copy. The
# pattern is anchored to a preceding quote or space, so that only whole
# path tokens starting with build/ are rewritten.
case_manifest: "$DIT_TMP_DIR/manifest.json"
# The libm soname in dvm_linking_options.shared_libraries is dlopen-ed by the
# DVM, so rewrite it to the macOS spelling when running there.
libm_soname: '$([ "@{is_macos}" = true ] && echo libm.dylib || echo libm.so.6)'
make_manifest: 'sed -e "s|\([\" ]\)build/|\1$DIT_TMP_DIR/build/|g" -e "s|libm.so.6|@{libm_soname}|g" duck_modules/@{Name}/manifest.json > @{case_manifest}'

compile_deterministically_cmd: "if [ '@{enable_conc_deterministic_tests}' = 'true' ]; then python3 @{compile_determinism_script} --duckc-path @{duckc_path} --manifest @{case_manifest} --duckc-worker-count @{duckc_worker_count}; else true; fi"
compile_only_cmd:  "@{duckc_path} compile_packages @{case_manifest} -w @{duckc_worker_count} -a @{case_build}"


PreCase: "mkdir -p @{case_build} && @{make_manifest} && @{compile_deterministically_cmd} && @{compile_only_cmd}"

# Run the LLVM executables, plus the one DVM output that links its dependency.
Run: "@{case_build}/app1.exe && @{case_build}/app2.exe && @{case_build}/app3.exe && @{case_build}/app3_alias.exe && @{dvm_path} run @{case_build}/app2_dvm_linked.dbc"

Tests:
  multi_package:
    Cases:
      all:
        Output:
          String: "10\n42\n20\n73\n42\n42\n73\n20\n"
        ExitCode: 0
