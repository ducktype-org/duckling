# @TODO: #2464 reenable it, currently mangling of symbols inside macros is not correct, and it causes tests that duplicate modules to fail.
enable_conc_deterministic_tests: "false"

Tests:
  simple_expand_1:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "2\n"
        ExitCode: 0
      dvm:
        backend: dvm
        Output:
          String: "2\n"
        ExitCode: 0

  simple_expand_2:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "2\n2\n"
        ExitCode: 0
      dvm:
        backend: dvm
        Output:
          String: "2\n2\n"
        ExitCode: 0

  simple_expand_3:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "1\n2\n"
        ExitCode: 0
      dvm:
        backend: dvm
        Output:
          String: "1\n2\n"
        ExitCode: 0

  various_statements:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "177\n"
        ExitCode: 0
