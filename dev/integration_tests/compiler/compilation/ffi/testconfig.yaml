# C ABI FFI test. A C source file is compiled separately with clang and linked into the
# duckling package via --additional-link-options. The C object is built in its own directory
# so the duckc artifact-cache clean (which wipes @{case_build}) cannot delete it.
#
# clang (not gcc) is required for the sub-word integer cases: gcc defensively re-extends
# narrow parameters in the callee, masking a missing caller-side signext, whereas clang
# trusts the caller's extension and would compute the wrong result if it were absent.

case_build_c: "$DIT_TMP_DIR/build_c"
# Compile both sides at -O3: the C callee then trusts the caller's sub-word extension
# (no defensive re-extend), and duckc's optimized codegen is the path under test.
compile_c_sample: "$(command -v clang-19 || command -v clang) -O3 -c -o @{case_build_c}/c_lib.o c_lib.c"
create_dirs: "mkdir -p @{case_build} && mkdir -p @{case_build_c}"
PreCase: "@{create_dirs} && @{compile_c_sample} && @{duckc_path} compile_package duck_modules/ffi -a @{case_build} -n duck_modules/package_ffi -O 3 @{std_artifacts_path_flag} --additional-link-options @{case_build_c}/c_lib.o"
Run: "@{case_build}/package_llvm.exe"

Tests:
  ffi:
    Cases:
      all:
        Output:
          String: "7\n12\n100\n600\n1\n2\n5\n10\n15\n7\n14\n21\n28\n7\n14\n21\n-21554\n-55\n5\n11\n18\n6\n10\n"
        ExitCode: 0
