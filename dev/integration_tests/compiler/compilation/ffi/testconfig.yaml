# C ABI struct-passing FFI test. A C source file is compiled separately with gcc and
# linked into the duckling package via --additional-link-options. The C object is built
# in its own directory so the duckc artifact-cache clean (which wipes @{case_build})
# cannot delete it.

case_build_c: "$DIT_TMP_DIR/build_c"
compile_gcc_sample: "gcc -c -o @{case_build_c}/c_lib.o c_lib.c"
create_dirs: "mkdir -p @{case_build} && mkdir -p @{case_build_c}"
PreCase: "@{create_dirs} && @{compile_gcc_sample} && @{duckc_path} compile_package duck_modules/ffi -a @{case_build} -n duck_modules/package_ffi --additional-link-options @{case_build_c}/c_lib.o"
Run: "@{case_build}/package_llvm.exe"

Tests:
  ffi:
    Cases:
      all:
        Output:
          String: "7\n12\n100\n600\n1\n2\n5\n10\n15\n7\n14\n21\n28\n7\n14\n21\n"
        ExitCode: 0
