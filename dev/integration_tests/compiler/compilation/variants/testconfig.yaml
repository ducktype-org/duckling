# Tests for variant types
Tests:
  variant_match:
    Cases:
      all:
        backend: all
        Output:
          String: ""
        ExitCode: 0

  # @TODO: #3225 run this on the DVM too. `Memory::iterateOverDataAndExecute` treats a variant as
  # a leaf, so copying one never adjusts the refcount of a `ref`/`box` payload and the VM reports
  # a leak.
  variant_owning_alternatives:
    Cases:
      llvm_valgrind:
        backend: llvm
        valgrind: "true"
        TimeOut: 3 # 1 second is often not enough on runners
        Output:
          String: ""
        ExitCode: 0
