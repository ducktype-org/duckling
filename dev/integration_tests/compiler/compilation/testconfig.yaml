# Compilation tests

clean_cmd: "rm -rf build"

backend: "nobackend"
# If set to "true" the produced duckling executable will be run with valgrind and checked for leaks.
valgrind: "false"

compile_dvm_options: ""
compile_llvm_options: ""

compile_dvm_backend_cmd:  "@{duckc_path} compile_package duck_modules/@{Name} -w @{duckc_worker_count} -a build -n package_@{Name} @{compile_dvm_options} --dvm-backend"
compile_llvm_backend_cmd: "@{duckc_path} compile_package duck_modules/@{Name} -w @{duckc_worker_count} -a build -n package_@{Name} @{compile_llvm_options}"

compiled_to_llvm: "./build/package_llvm.exe"
compiled_to_dvm: "./build/query/query*/*.dbc" # ??

# Deliberately empty, so as not to recompile duckc and dvm for each test.
PreNode: ""

Clean: "@{clean_cmd}"
PreCase: "@{clean_cmd} && mkdir build;
  case '@{backend}' in
    dvm)       @{compile_dvm_backend_cmd}                   ;;
    llvm)      @{compile_llvm_backend_cmd}                  ;;
    nobackend) echo 'Backend undefined'; exit 1             ;;
    *)         echo 'Unknown backend';   exit 1             ;;
  esac;"

Run: "
  case '@{backend}' in
    dvm) @{dvm_path} run @{compiled_to_dvm}       ;;
    llvm)
      if [ '@{valgrind}' = 'true' ]; then
        valgrind --leak-check=full --error-exitcode=1 @{compiled_to_llvm};
      else
        @{compiled_to_llvm};
      fi
      ;;
    nobackend) echo \"Backend undefined\"; exit 1 ;;
    *)         echo \"Unknown backend\";   exit 1 ;;
  esac;"

Tests:
  base:
    Cases:
      dvm:
        backend: dvm
        Output:
          String: "4\n1\n23\n4\n1\n4\n4\n8\n4\n8\n76\n"
        ExitCode: 76
      llvm:
        backend: llvm
        Output:
          String: "4\n1\n23\n4\n1\n4\n4\n8\n4\n8\n76\n"
        ExitCode: 76

SubDirs:
  - expressions
  - comp_time
  - builtins
  - samples
  - statements
  - functions
  - constants
  - classes
  - static_arrays
  - dynamic_arrays
  - optimisations
  - references
  - boxes
  - imports
  - macros
  - diagnostics
