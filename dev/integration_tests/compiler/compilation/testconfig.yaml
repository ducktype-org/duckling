# Compilation tests

PreCase: "@{clean_cmd} && mkdir build"
clean_cmd: "rm -rf build"
Clean: "@{clean_cmd}"
Run: "@{duck_path} compile_package -a build @{CaseName} && ./build/package_llvm.exe"

SubDirs:
  - expressions

Tests:
  compile-simple:
    Cases:
      sample_duck:
        # "sample_duck" is the name of the test case, which is used in
        # run_args variable. "sample_duck" is also the folder which has our duck file.
        ExitCode: 3
  base:
    Cases:
      base:
        Output:
          String: "4 \n76 \n94 \n12 \n"
          # I don't know there is a whitespace at the end of each line.
          # @TODO: fix trailing space
        ExitCode: 76

