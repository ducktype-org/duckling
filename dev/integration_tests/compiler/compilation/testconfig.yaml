# Compilation tests

clean_cmd: "rm -rf duck_build"

backend: "nobackend"

compile_dvm_backend_cmd: "@{duck_path} compile_package --dvm-backend duck_modules/@{Name}"
compile_llvm_backend_cmd: "@{duck_path} compile_package duck_modules/@{Name}"

compiled_to_llvm: "./duck_build/package_llvm.exe"
compiled_to_dvm: "./duck_build/query/query*/*.dbc" # ??

Clean: "@{clean_cmd}"
PreCase: "@{clean_cmd} &&
  @{compile_duck};
  case '@{backend}' in
    dvm)       @{compile_dvm} && @{compile_dvm_backend_cmd} ;;
    llvm)      @{compile_llvm_backend_cmd}                  ;;
    nobackend) echo 'Backend undefined'; exit 1             ;;
    *)         echo 'Unknown backend';   exit 1             ;;
  esac;"
Run: "
  case '@{backend}' in
    dvm) @{dvm_path} run @{compiled_to_dvm}       ;;
    llvm) @{compiled_to_llvm}                     ;;
    nobackend) echo \"Backend undefined\"; exit 1 ;;
    *)         echo \"Unknown backend\";   exit 1 ;;
  esac;"

Tests:
  base:
    Cases:
      dvm:
        backend: dvm
        Output:
          String: "4\n1\n23\n4\n1\n4\n4\n8\n4\n8\n76\n"
          # I don't know there is a whitespace at the end of each line.
          # @TODO: fix trailing space
        ExitCode: 76
      llvm:
        backend: llvm
        Output:
          String: "4 \n1 \n23 \n4 \n1 \n4 \n4 \n8 \n4 \n8 \n76 \n"
        ExitCode: 76

SubDirs:
  - expressions
  - samples
  - statements
  - functions
