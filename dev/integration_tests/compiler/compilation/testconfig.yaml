# Compilation tests

clean_cmd: "rm -rf build"

backend: "nobackend"
# If set to "true" the produced duckling executable will be run with valgrind and checked for leaks.
valgrind: "false"

compile_dvm_options: ""
compile_llvm_options: ""
# Runs an extra deterministic compile check before normal compile_package.
# You can override this to "false" in any subtree/test when duplication-based checks fail
# for test-specific reasons (for example repeated globals or intentionally conflicting symbols).
enable_conc_deterministic_tests: "true"
# Number of duckc worker threads used for compilation and determinism checks.
duckc_worker_count: "3"

# Path to the local helper script used by the deterministic pre-check.
compile_determinism_script: "@{dev_dir}/integration_tests/compiler/compilation/scripts/concurrent_compile_determinism.py"
# Path to the helper script that runs multiple commands and asserts identical stdout/stderr/exit code.
compare_runs_script: "@{dev_dir}/integration_tests/compiler/compilation/scripts/compare_runs.py"

module_to_compile: "@{Name}"
compile_dvm_backend_deterministically_cmd: "if [ '@{enable_conc_deterministic_tests}' = 'true' ]; then python3 @{compile_determinism_script} --duckc-path @{duckc_path} --module-name @{module_to_compile} --duckc-worker-count @{duckc_worker_count} --compile-options='@{compile_dvm_options}' --backend dvm; else true; fi"
compile_llvm_backend_deterministically_cmd: "if [ '@{enable_conc_deterministic_tests}' = 'true' ]; then python3 @{compile_determinism_script} --duckc-path @{duckc_path} --module-name @{module_to_compile} --duckc-worker-count @{duckc_worker_count} --compile-options='@{compile_llvm_options}' --backend llvm; else true; fi"

compile_dvm_backend_cmd:  "@{compile_dvm_backend_deterministically_cmd} && @{duckc_path} compile_package duck_modules/@{module_to_compile} -w @{duckc_worker_count} -a build -n package_@{module_to_compile} @{compile_dvm_options} --dvm-backend"
compile_llvm_backend_cmd: "@{compile_llvm_backend_deterministically_cmd} && @{duckc_path} compile_package duck_modules/@{module_to_compile} -w @{duckc_worker_count} -a build -n package_@{module_to_compile} @{compile_llvm_options}"

# "compile only" commands used by the all backend (determinism checks run separately before these).
compile_dvm_only_cmd: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -w @{duckc_worker_count} -a build -n package_@{module_to_compile} @{compile_dvm_options} --dvm-backend"
compile_llvm_only_cmd: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -w @{duckc_worker_count} -a build -n package_@{module_to_compile} @{compile_llvm_options}"

compiled_to_llvm: "./build/package_llvm.exe"
compiled_to_dvm: "./build/package_dvm.dbc"

# Deliberately empty, so as not to recompile duckc and dvm for each test.
PreNode: ""

# Clean: "@{clean_cmd}"
PreCase: "@{clean_cmd} && mkdir build;
  # echo $(pwd);
  # ls $(pwd);
  # realpath build;
  case '@{backend}' in
    dvm)       @{compile_dvm_backend_cmd}                                                                                ;;
    llvm)      @{compile_llvm_backend_cmd}                                                                               ;;
    all)       @{compile_dvm_backend_deterministically_cmd} && @{compile_llvm_backend_deterministically_cmd} &&
               @{compile_dvm_only_cmd} && @{compile_llvm_only_cmd}                                                      ;;
    nobackend) echo 'Backend undefined'; exit 1                                                                          ;;
    *)         echo 'Unknown backend';   exit 1                                                                          ;;
  esac;"

Run: "
  case '@{backend}' in
    dvm) @{dvm_path} run @{compiled_to_dvm}       ;;
    llvm)
      if [ '@{valgrind}' = 'true' ]; then
        valgrind --leak-check=full --error-exitcode=1 @{compiled_to_llvm};
      else
        @{compiled_to_llvm};
      fi
      ;;
    all)
      _llvm=@{compiled_to_llvm};
      _dvm=\"@{dvm_path} run @{compiled_to_dvm}\";
      python3 @{compare_runs_script} --cmd llvm \"$_llvm\" --cmd dvm \"$_dvm\";
      ;;
    nobackend) echo \"Backend undefined\"; exit 1 ;;
    *)         echo \"Unknown backend\";   exit 1 ;;
  esac;"

Tests:
  base:
    Cases:
      all:
        backend: all
        Output:
          String: "4\n1\n23\n4\n1\n4\n4\n8\n4\n8\n76\n"
        ExitCode: 76

SubDirs:
  - expressions
  - comp_time
  - builtins
  - samples
  - statements
  - functions
  - constants
  - classes
  - extern_c
  - static_arrays
  - dynamic_arrays
  - optimisations
  - references
  - boxes
  - pointers
  - globals
  - tuples
  - imports
  - macros
  - diagnostics
  - packages
  - standard_library
  - conditional_compilation
