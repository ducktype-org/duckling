# Tests for static array types
# @TODO: #1916 Add DVM cases
Tests:
  simple_arrays:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "100\n200\n300\n600\n20\n88888888\n42\n11\n13\n3.25\n"
        ExitCode: 0

  bubble_sort:
    Cases:
      llvm:
        backend: llvm
        Input:
          String: "8\n5\n2\n9\n2\n1\n3\n9\n1\n"
        Output:
          String: "1\n1\n2\n2\n3\n5\n9\n9\n"
        ExitCode: 0

  sieve:
    Cases:
      llvm:
        backend: llvm
        Input: 
          String: "20\n"
        Output:
          String: "88888888\n2\n3\n5\n7\n11\n13\n17\n19\n"
        ExitCode: 0

  arrays_and_records:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "40\n6\n777\n"
        ExitCode: 0

  arrays_and_meta:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "1\n0\n0\n123\n"
        ExitCode: 0

  empty_arrays:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "111\n222\n333\n"
        ExitCode: 0

  arrays_and_namespaces:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "123\n"
        ExitCode: 0
