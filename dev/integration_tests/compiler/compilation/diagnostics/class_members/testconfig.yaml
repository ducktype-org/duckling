# Diagnostics for the special class members (`T()`, `T.name()`, `T.copy`, `T.move`, `T.destroy`).
#
# The compiler's stderr carries volatile parts (std-lib warnings, source paths), so the
# diagnostic is asserted with `expect_output` regexes instead of a literal `Err` comparison.

# @TODO: #2448 Investigate why deterministic compilation check fails for these tests
enable_conc_deterministic_tests: "false"

compile_cmd: "@{duckc_path} compile_package duck_modules/@{Name} -w @{duckc_worker_count}
  -a @{case_build} -n package_@{Name} @{std_artifacts_path_flag}"

Run: "@{expect_output} --expect-exit 1 --err-regex \"@{expected_error}\" -- @{compile_cmd}"

Tests:
  user_defined_constructor:
    Cases:
      llvm:
        backend: llvm
        expected_error: "User-defined constructors are not yet supported"
        ExitCode: 0
