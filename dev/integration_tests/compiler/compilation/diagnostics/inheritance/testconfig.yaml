# Specifiers (`ref`, `const`, ...) are not allowed on the extended class or on the
# implemented interfaces of a class declaration - the compiler must reject them.

# The compilation is expected to fail, so the determinism pre-check does not apply.
enable_conc_deterministic_tests: "false"

# `expect_output` runs with `shell=False`, so the duckc invocation is spelled out here
# instead of reusing `@{compile_llvm_backend_cmd}` (which contains `&&`). The case's own
# `ExitCode` is the helper's; `--expect-exit 1` is what asserts that duckc failed.
compile_cmd: "@{duckc_path} compile_package duck_modules/@{Name} -w @{duckc_worker_count}
  -a @{case_build} -n package_@{Name} @{std_artifacts_path_flag}"

Run: "@{expect_output} --expect-exit 1 --err-regex \"@{expected_error}\" -- @{compile_cmd}"

Tests:
  extends_specifier:
    Cases:
      llvm:
        backend: llvm
        expected_error: "cannot be used as the extended class of class .Derived.: specifiers \\(.ref.\\) are not allowed here"
        ExitCode: 0
  implements_specifier:
    Cases:
      llvm:
        backend: llvm
        expected_error: "cannot be used as the implemented interface of class .Derived.: specifiers \\(.const.\\) are not allowed here"
        ExitCode: 0
