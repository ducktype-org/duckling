# Diagnostics for entities defined more than once.

# These modules define conflicting symbols on purpose, which is what the deterministic
# re-compile check chokes on (same reason as the `initialization` subtree).
enable_conc_deterministic_tests: "false"

# The compilation is done by `Run` here, so `PreCase` only has to prepare the scratch
# directory and the private copy of the warm std artifacts.
PreCase: "mkdir -p @{case_build}; @{copy_std_artifacts}"

# duckc's diagnostics carry ANSI escapes and absolute paths, so the expected stderr is
# matched with regexes rather than compared literally. `expect_output` swallows it and
# forwards only stdout, which is dropped by the redirection below.
Tests:
  duplicated_class_field:
    Cases:
      llvm:
        backend: llvm
        Run: "@{expect_output} --expect-exit 1
          --err-regex \"Symbol 'y' is already defined\\.\"
          --err-regex 'Previous declaration here\\.'
          -- sh -c '@{compile_llvm_only_cmd} >/dev/null'"
        Output:
          String: ""
        ExitCode: 0
