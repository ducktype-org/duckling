# Tests for `extern("C")` classes: layout compatibility in the prefix and block
# specifier forms.

# Determinism check trips on the parallel symbol-ABI query for some of these
# tests; disabling matches the convention used by other class-related tests.
enable_conc_deterministic_tests: "false"

Tests:
  extern_c_class:
    Cases:
      all:
        backend: all
        Output:
          String: "3\n17\n11\n22\n42\n7\n7\n9\n11\n"
