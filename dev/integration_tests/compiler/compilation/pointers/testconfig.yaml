# Pointer type tests (ptr, manyptr, cptr)

Tests:
  manyptr:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "1\n3\n7\n42\n43\n30\n"
        ExitCode: 0
      llvm_valgrind:
        backend: llvm
        valgrind: "true"
        TimeOut: 3
        Output:
          String: "1\n3\n7\n42\n43\n30\n"
        ExitCode: 0

  nested_pointers:
    Cases:
      all:
        backend: all
        Output:
          String: "100\n999\n10\n3\n"
        ExitCode: 0

  ptr_deref_ref:
    Cases:
      all:
        backend: all
        Output:
          String: "30\n"
        ExitCode: 0

  ref_to_index:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "10\n99\n"
        ExitCode: 0
      llvm_valgrind:
        backend: llvm
        valgrind: "true"
        TimeOut: 3
        Output:
          String: "10\n99\n"
        ExitCode: 0

  # @TODO: #2228 Replace all panicked tests output here with regex shortened versions
  dvm_use_after_free_local:
    Cases:
      dvm:
        backend: dvm
        Output:
          String: ""
        Err:
          String: 'VMThread has panicked: Data was freed\n{\"data\":{\"error\":\"Execution panicked with error: Data was freed\"},\"type\":\"OtherError\"}block.refcount != 0, BlockID=2\n'
        ExitCode: 1
  dvm_use_after_free_box:
    Cases:
      dvm:
        backend: dvm
        Output:
          String: ""
        Err:
          String: 'VMThread has panicked: Data was freed\n{\"data\":{\"error\":\"Execution panicked with error: Data was freed\"},\"type\":\"OtherError\"}block.refcount != 0, BlockID=2\n'
        ExitCode: 1
  dvm_uninitialized_access:
    Cases:
      dvm:
        backend: dvm
        Output:
          String: ""
        Err:
          String: 'VMThread has panicked: Accessing null pointer\n{\"data\":{\"error\":\"Execution panicked with error: Accessing null pointer\"},\"type\":\"OtherError\"}block.refcount != 0, BlockID=3\n'
        ExitCode: 1
  slices:
    enable_conc_deterministic_tests: "false"
    Cases:
      all:
        backend: all
        Output:
          String: "Hello from VM!\nl\n15\nHello from Duckling!\n"
        ExitCode: 0
  slices_out_of_bounds:
    enable_conc_deterministic_tests: "false"
    Cases:
      llvm:
        backend: llvm
        ExitCode: 134
      dvm:
        backend: dvm
        Output:
          String: "Program panicked!\n"
        Err:
          String: 'VMThread has panicked: Program panicked\n{\"data\":{\"error\":\"Execution panicked with error: Program panicked\"},\"type\":\"OtherError\"}block.refcount != 0, BlockID=1\n'
        ExitCode: 1
  slices_negative_index:
    enable_conc_deterministic_tests: "false"
    Cases:
      llvm:
        backend: llvm
        ExitCode: 134
      dvm:
        backend: dvm
        ExitCode: 1

