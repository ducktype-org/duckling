# Pointer type tests (ptr, manyptr, cptr)

Tests:
  manyptr_malloc:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "1\n3\n7\n"
        ExitCode: 0
      llvm_valgrind:
        backend: llvm
        valgrind: "true"
        TimeOut: 3
        Output:
          String: "1\n3\n7\n"
        ExitCode: 0

  ptr_deref_ref:
    Cases:
      all:
        backend: all
        Output:
          String: "30\n"
        ExitCode: 0

  ref_to_index:
    Cases:
      llvm:
        backend: llvm
        Output:
          String: "10\n99\n"
        ExitCode: 0
      llvm_valgrind:
        backend: llvm
        valgrind: "true"
        TimeOut: 3
        Output:
          String: "10\n99\n"
        ExitCode: 0

  dvm_use_after_free_local:
    Cases:
      dvm:
        backend: dvm
        Output:
          String: ""
        Err:
          String: 'VMThread has panicked: Data was freed\n{\"data\":{\"error\":\"Execution panicked with error: Data was freed\"},\"type\":\"OtherError\"}block.refcount != 0, BlockID=0\n'
        ExitCode: 1
