# Compilation tests

# Every case gets a private scratch directory for its build artifacts,
# so cases can run concurrently and never dirty the source tree.
Env:
    DIT_TMP_DIR: "@{new_tmp_dir}"
    DUCKC_STD_ARTIFACTS_PATH: "echo @{case_std_artifacts}"

case_build: "$DIT_TMP_DIR/build"
# Private copy of the shared warm std artifacts (see the root testconfig).
# duckc rewrites the artifacts directory on exit (#3169), so concurrent cases
# must not point at the shared one.
case_std_artifacts: "$DIT_TMP_DIR/std_artifacts"
copy_std_artifacts: "cp -r @{std_artifacts_dir} @{case_std_artifacts} 2>/dev/null || true"

# Backend the case is compiled and run with: dvm, llvm, llvm_valgrind (native run under
# valgrind, checked for leaks) or all (both backends, outputs compared).
backend: "nobackend"

# Skip valgrind cases on macOS (no valgrind on Apple Silicon). Inherited by every case;
# non-valgrind cases are always enabled. Enabled iff not-a-valgrind-case OR not-macOS.
Enabled: '[ "@{backend}" != "llvm_valgrind" ] || [ "@{is_macos}" != "true" ]'

# Optional regexes matched against the run's stdout/stderr instead of a literal
# `Output`/`Err` comparison, for cases whose output has volatile parts (e.g. a
# DVM panic's `BlockID=N`). When either is set the dvm and (non-valgrind) llvm
# runs are wrapped with the `expect_output` helper, which asserts the regexes,
# forwards stdout, and swallows the volatile stderr. See
# integration_tests/helpers/expect_output.py.
stdout_regex: ""
stderr_regex: ""

compile_dvm_options: ""
compile_llvm_options: ""
std_artifacts_path_flag: "--custom-std-artifacts-path @{case_std_artifacts}"
# Compiles the package with 1 and with `duckc_worker_count` workers and compares the
# artifacts. The concurrent pass produces the binary the case runs, so the check costs
# one extra compile per backend, not two. Override to "false" in any subtree/test that
# cannot be compiled twice (for example intentionally conflicting symbols).
enable_conc_deterministic_tests: "true"
# Duplicates every module x3 in the checked package, so worker threads process identical
# function bodies in parallel and non-determinism has a chance to show. Such a build links
# extra copies of every module, whose module-level side effects change what the program
# prints, so the case binary then comes from its own plain compile - a third compile per
# backend. Enabled only in the subtrees that carry the concurrency stress.
determinism_duplicate_sources: "false"
# Number of duckc worker threads used for compilation and determinism checks.
duckc_worker_count: "3"
# Each case occupies that many threads, so the scheduler runs fewer cases at
# once instead of oversubscribing the machine (and blowing the `TimeOut`s).
# However, most cases do not consume all "duckc_worker_count" threads consitently,
# so this number is reduced so speed the tests up.
NeededThreads: "2"

# Path to the local helper script used by the deterministic pre-check.
compile_determinism_script: "@{dev_dir}/integration_tests/compiler/features/scripts/concurrent_compile_determinism.py"
# Path to the helper script that runs multiple commands and asserts identical stdout/stderr/exit code.
compare_runs_script: "@{dev_dir}/integration_tests/compiler/features/scripts/compare_runs.py"

module_to_compile: "@{Name}"
determinism_check_cmd: "python3 @{compile_determinism_script} --duckc-path @{duckc_path} --module-name @{module_to_compile} --duckc-worker-count @{duckc_worker_count}"
# The check's concurrent pass builds into @{case_build}, so its output is the binary the
# case runs. It keeps that directory (the other backend's artifacts may already be there)
# and compares only the current backend's.
determinism_reuse_flags: "--no-duplicate --artifacts-out @{case_build}"
determinism_dup_flags: "--copy-count 3"

compile_dvm_only_cmd: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -w @{duckc_worker_count} -a @{case_build} -n package_@{module_to_compile} @{std_artifacts_path_flag} @{compile_dvm_options} --dvm-backend"
compile_llvm_only_cmd: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -w @{duckc_worker_count} -a @{case_build} -n package_@{module_to_compile} @{std_artifacts_path_flag} @{compile_llvm_options}"

compile_dvm_backend_cmd: "if [ '@{enable_conc_deterministic_tests}' != 'true' ]; then @{compile_dvm_only_cmd};
  elif [ '@{determinism_duplicate_sources}' = 'true' ]; then @{compile_dvm_only_cmd} && @{determinism_check_cmd} --compile-options='@{compile_dvm_options}' --backend dvm @{determinism_dup_flags};
  else @{determinism_check_cmd} --compile-options='@{compile_dvm_options}' --backend dvm @{determinism_reuse_flags}; fi"
compile_llvm_backend_cmd: "if [ '@{enable_conc_deterministic_tests}' != 'true' ]; then @{compile_llvm_only_cmd};
  elif [ '@{determinism_duplicate_sources}' = 'true' ]; then @{compile_llvm_only_cmd} && @{determinism_check_cmd} --compile-options='@{compile_llvm_options}' --backend llvm @{determinism_dup_flags};
  else @{determinism_check_cmd} --compile-options='@{compile_llvm_options}' --backend llvm @{determinism_reuse_flags}; fi"

compiled_to_llvm: "@{case_build}/package_llvm.exe"
compiled_to_dvm: "@{case_build}/package_dvm.dbc"

# Deliberately empty, so as not to recompile duckc and dvm for each test.
PreNode: ""

PostCase: "@{cleanup_tmp_env}"
PreCase: "mkdir -p @{case_build}; @{copy_std_artifacts};
  case '@{backend}' in
    dvm)                @{compile_dvm_backend_cmd}                                                                                ;;
    llvm)               @{compile_llvm_backend_cmd}                                                                               ;;
    llvm_valgrind)      @{compile_llvm_backend_cmd}                                                                               ;;
    all)                @{compile_dvm_backend_cmd} && @{compile_llvm_backend_cmd}                                                 ;;
    nobackend) echo 'Backend undefined'; exit 1                                                                          ;;
    *)         echo 'Unknown backend';   exit 1                                                                          ;;
  esac;"

Run: "
  case '@{backend}' in
    dvm)
      if [ -n \"@{stdout_regex}\" ] || [ -n \"@{stderr_regex}\" ]; then
        @{expect_output} --out-regex \"@{stdout_regex}\" --err-regex \"@{stderr_regex}\" -- @{dvm_path} run @{compiled_to_dvm};
      else
        @{dvm_path} run @{compiled_to_dvm};
      fi
      ;;
    llvm)
      if [ -n \"@{stdout_regex}\" ] || [ -n \"@{stderr_regex}\" ]; then
        @{expect_output} --out-regex \"@{stdout_regex}\" --err-regex \"@{stderr_regex}\" -- @{compiled_to_llvm};
      else
        @{compiled_to_llvm};
      fi
      ;;
    llvm_valgrind)
      valgrind --leak-check=full --error-exitcode=1 @{compiled_to_llvm};
      ;;
    all)
      _llvm=@{compiled_to_llvm};
      _dvm=\"@{dvm_path} run @{compiled_to_dvm}\";
      python3 @{compare_runs_script} --cmd llvm \"$_llvm\" --cmd dvm \"$_dvm\";
      ;;
    nobackend) echo \"Backend undefined\"; exit 1 ;;
    *)         echo \"Unknown backend\";   exit 1 ;;
  esac;"

SubDirs:
  - rolling
  - version_0_1
