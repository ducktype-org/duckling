# Test configuration for while-loops
# Tests while loops with named loops, break, continue, and a long-running loop

Tests:
  while_test:
    Description: Tests for while loops with named loops, break, and continue.
    Cases:
      all:
        Output:
          String: "5\n4\n5\n4\n5\n4\n5\n4\n2\n1\n5\n4\n2\n1\n5\n4\n2\n1\n"
        ExitCode: 0
  loops_performance:
    Description: Runs a while loop for about 3*10^7 iterations. Checks the output only, not the speed.
    Cases:
      all:
        Output:
          String: "20\n100000001\n"
        ExitCode: 0

