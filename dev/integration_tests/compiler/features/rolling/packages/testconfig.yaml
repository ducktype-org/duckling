# Multi-package compilation tests.
#
# Exercises `duckc compile_packages` driven by a JSON manifest:
# multiple packages, mixed strategies (lib/.a, dvm/.dbc, native/.exe),
# linker + archiver options, all in one invocation.
# DVM artifacts are not executed, with one exception: a `dvm_exe` output only
# carries its own package's code, so `app2_dvm_linked.dbc` uses
# `dvm_linking_options` to pull in the dependency `.dbc` and to load the shared
# library holding `c_helper_value` (which `app2` calls over the C ABI, so the
# declaration is load bearing) and is therefore runnable.
#
# `c_helper.c` is built into both a shared object (dlopen-ed by the DVM) and an
# object file (linked into `app2.exe`) in their own directory, so the duckc
# artifact-cache clean (which wipes @{case_build}) cannot delete them.

case_build_c: "$DIT_TMP_DIR/build_c"
c_compiler: "$(command -v clang-19 || command -v clang)"
compile_c_object: "@{c_compiler} -O3 -c -o @{case_build_c}/c_helper.o c_helper.c"
compile_c_shared: "@{c_compiler} -O3 -shared -fPIC -o @{case_build_c}/libc_helper.so c_helper.c"


# The manifest references its artifacts relatively (build/... for duck ones,
# build_c/... for the C ones); rewrite both to the case's tmp dirs in a
# generated copy. The pattern is anchored to a preceding quote or space, so
# that only whole path tokens are rewritten.
case_manifest: "$DIT_TMP_DIR/manifest.json"
make_manifest: 'sed "s|\([\" ]\)build|\1$DIT_TMP_DIR/build|g" duck_modules/@{Name}/manifest.json > @{case_manifest}'

# The manifest's linking options name the libraries by their path in @{case_build}, so the
# check has to build there too - see its `--build-dir`.
compile_deterministically_cmd: "if [ '@{enable_conc_deterministic_tests}' = 'true' ]; then python3 @{compile_determinism_script} --duckc-path @{duckc_path} --manifest @{case_manifest} --duckc-worker-count @{duckc_worker_count} --build-dir @{case_build}; else true; fi"
compile_only_cmd:  "@{duckc_path} compile_packages @{case_manifest} -w @{duckc_worker_count} -a @{case_build}"


PreCase: "mkdir -p @{case_build_c} && @{copy_std_artifacts} && @{compile_c_object} && @{compile_c_shared} && @{make_manifest} && @{compile_deterministically_cmd} && @{compile_only_cmd}"

# Run the LLVM executables, plus the one DVM output that links its dependency.
Run: "@{case_build}/app1.exe && @{case_build}/app2.exe && @{case_build}/app3.exe && @{case_build}/app3_alias.exe && @{dvm_path} run @{case_build}/app2_dvm_linked.dbc"

Tests:
  multi_package:
    Cases:
      all:
        Output:
          String: "10\n42\n20\n17\n73\n42\n42\n73\n20\n17\n"
        ExitCode: 0
