# Tests for static array types
Tests:
  simple_arrays:
    Cases:
      all:
        Output:
          String: "100\n200\n300\n600\n20\n88888888\n42\n11\n13\n4\n"
        ExitCode: 0

  bubble_sort:
    Cases:
      all:
        Input:
          String: "8\n5\n2\n9\n2\n1\n3\n9\n1\n"
        Output:
          String: "1\n1\n2\n2\n3\n5\n9\n9\n"
        ExitCode: 0

  sieve:
    Cases:
      all:
        Input: 
          String: "20\n"
        Output:
          String: "88888888\n2\n3\n5\n7\n11\n13\n17\n19\n"
        ExitCode: 0

  arrays_and_records:
    Cases:
      all:
        Output:
          String: "40\n6\n777\n"
        ExitCode: 0

  arrays_and_meta:
    Cases:
      all:
        Output:
          String: "1\n0\n0\n123\n"
        ExitCode: 0

  empty_arrays:
    Cases:
      all:
        Output:
          String: "111\n222\n333\n"
        ExitCode: 0

  arrays_and_namespaces:
    Cases:
      all:
        Output:
          String: "123\n"
        ExitCode: 0

  arrays_and_globals:
    Cases:
      all:
        Output:
          String: "100\n500\n10\n20\n"
        ExitCode: 0
  large_array:
    Cases:
      all:
        Output:
          String: "0\n"
        ExitCode: 0
  array_out_of_bounds:
    Cases:
      llvm:
        ExitCode: 134
      dvm:
        stderr_regex: "VMThread has panicked: Program panicked"
        Output:
          String: "Program panicked!\n"
  array_negative_index:
    Cases:
      llvm:
        ExitCode: 134
      dvm:
        stderr_regex: "VMThread has panicked: Program panicked"
        Output:
          String: "Program panicked!\n"
