# Tests for statements

Tests:
  # Call arguments are evaluated left to right, so the nested calls print 1 before 2.
  argument_evaluation_order:
    Cases:
      all:
        Output:
          String: "1\n2\n3\n"
        ExitCode: 0

  default_args_advanced:
    Cases:
      all:
        Output:
          String: "101\n105\n109\n"
        ExitCode: 0

  named_arguments_overloading:
    Cases:
      all:
        Output:
          String: "42\n7\n43\n54\n108\n6\n3\n5\n11\n7\n13\n"
        ExitCode: 54

  named_default_args:
    Cases:
      all:
        Output:
          String: "1\n2\n1\n2\n3\n2\n4\n5\n1\n3\n1\n2\n2\n3\n4\n5\n1\n5\n4\n2\n"
        ExitCode: 0

  numeric:
    Cases:
      all:
        Output:
          String: ""
        ExitCode: 0

  overloading_between_modules:
    Cases:
      all:
        Output:
          String: "1000\n200\n500\n30\n60\n4\n7\n"
        ExitCode: 0

  simple:
    Cases: 
      all:
        Output:
          String: "5\n7\n"
        ExitCode: 0

  single_stmt_body:
    Cases:
      all:
        Output:
