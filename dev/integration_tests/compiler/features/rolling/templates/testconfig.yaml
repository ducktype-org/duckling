# Templates instantiate the same bodies from several modules at once, which is
# where duplicated copies put the most pressure on the workers.
determinism_duplicate_sources: "true"


Tests:
  simple_class_templates:
    Cases:
      all:
        backend: all
        Output:
          String: "5\n10\n42\n"
        ExitCode: 0

  simple_function_template:
    Cases:
      all:
        backend: all
        Output:
          String: "2\n2\nabc\n"
        ExitCode: 0


  simple_constants_templates:
    Cases:
      all:
        backend: all
        Output:
          String: "2\n"
        ExitCode: 0


  templates_and_macros:
    Cases:
      all:
        backend: all
        Output:
          String: "42\n42\n"
        ExitCode: 0

  more_templates:
    Cases:
      all:
        backend: all
        Output:
          String: "1\n2\n3\n3\n2\n"
        ExitCode: 0

  # @TODO: #3196 this doesn't work on dvm, due to initialization order fiasco
  use_generated_consts:
    Cases:
      all:
        backend: llvm
        Output:
          String: "1\n2\n1\n1\n2\n1\n5\n4\n6\n5\n5\n4\n1\n2\n1\n"
        ExitCode: 0

  # @TODO: #3112 maybe reenable it (see the other note in tests).
  template_self_use:
    Enabled: "false"
    Cases:
      all:
        backend: all
        Output:
          String: "3\n2\n1\n0\n"
        ExitCode: 0

