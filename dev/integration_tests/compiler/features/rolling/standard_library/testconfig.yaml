Tests:
  # We test if using std works by default.
  default_std:
    module_to_compile: "uses_std"
    Cases:
      all:
        Output:
          String: "10\n42\n"

  # We test if not using std when disabling it in the compiler works.
  no_std:
    module_to_compile: "no_std"
    compile_dvm_options: "--no-std"
    compile_llvm_options: "--no-std"
    Cases:
      all: {}

  # In custom std instead of the default one we have a different implementation
  # of builtin_output that output 20 for the same `no_std` user code.
  custom_std:
    module_to_compile: "uses_std"
    compile_dvm_options: "--custom-std-path custom_std"
    compile_llvm_options: "--custom-std-path custom_std"
    std_artifacts_path_flag: ""
    Cases:
      all:
        Output:
          String: "x\nx\n"

  # We test if disabling the std and using it in the user code causes the expected compile error.
  no_std_fails:
    module_to_compile: "uses_std"
    PreCase: "mkdir -p @{case_build}"
    Cases:
      dvm:
        Run: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -a @{case_build} -n package_@{module_to_compile} -w @{duckc_worker_count} --no-std --dvm-backend"
        ExitCode: 1
      llvm:
        Run: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -a @{case_build} -n package_@{module_to_compile} -w @{duckc_worker_count} --no-std"
        ExitCode: 1

  both_options_fail:
    module_to_compile: "no_std"
    PreCase: "mkdir -p @{case_build}"
    Cases:
      dvm:
        Run: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -a @{case_build} -n package_@{module_to_compile} -w @{duckc_worker_count} --no-std --custom-std-path custom_std --dvm-backend"
        ExitCode: 1
      llvm:
        Run: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -a @{case_build} -n package_@{module_to_compile} -w @{duckc_worker_count} --no-std --custom-std-path custom_std"
        ExitCode: 1
  
  compile_packages_default_std:
    module_to_compile: "uses_std"
    compile_dvm_only_cmd: "@{duckc_path} compile_packages duck_modules/@{module_to_compile}/manifest.json -a @{case_build}"
    compile_llvm_only_cmd: "@{duckc_path} compile_packages duck_modules/@{module_to_compile}/manifest.json -a @{case_build}"
    Cases:
      all:
        Output:
          String: "10\n42\n"

  # `exp.containers`: `Stack`, `Queue` and `Deque`, all built on `List`.
  exp_stack:
    Cases:
      all:
        Output:
          String: "true\n3\n3\n30\n2\n4\n1\ntrue\n888\n100\n3725\n49\n0\n888\nlingduck\n888\n"
        ExitCode: 0
      llvm_valgrind:
        TimeOut: 3 # 1 second is often not enough on runners
        Output:
          String: "true\n3\n3\n30\n2\n4\n1\ntrue\n888\n100\n3725\n49\n0\n888\nlingduck\n888\n"
        ExitCode: 0
  exp_queue:
    Cases:
      all:
        Output:
          String: "true\n3\n1\n3\n1\n4\n2\n3\n4\n20\n3\n4\ntrue\n888\ntrue\n50\n50\n99\n0\n888\nduckling\n888\n"
        ExitCode: 0
      llvm_valgrind:
        TimeOut: 3 # 1 second is often not enough on runners
        Output:
          String: "true\n3\n1\n3\n1\n4\n2\n3\n4\n20\n3\n4\ntrue\n888\ntrue\n50\n50\n99\n0\n888\nduckling\n888\n"
        ExitCode: 0
  exp_deque:
    Cases:
      all:
        Output:
          String: "true\n0\n1\n2\n3\n--\n4\n0\n3\n10\n30\n2\n1\ntrue\n888\n0\n1\n4\n1\n2\n3\n4\n--\n4\n1\n2\n3\ntrue\n4\n3\n2\n1\n0\n--\n0\n1\n4\n3\n2\n--\n888\ntrue\ntrue\n0\n888\nduckling!\n888\n"
        ExitCode: 0
      llvm_valgrind:
        TimeOut: 3 # 1 second is often not enough on runners
        Output:
          String: "true\n0\n1\n2\n3\n--\n4\n0\n3\n10\n30\n2\n1\ntrue\n888\n0\n1\n4\n1\n2\n3\n4\n--\n4\n1\n2\n3\ntrue\n4\n3\n2\n1\n0\n--\n0\n1\n4\n3\n2\n--\n888\ntrue\ntrue\n0\n888\nduckling!\n888\n"
        ExitCode: 0

  # `exp.compare`: the `cmp` ordering convention, and `exp.containers.Map`, a tree built on it.
  exp_compare:
    Cases:
      all:
        Output:
          String: "true\nfalse\nfalse\ntrue\nfalse\ntrue\ntrue\n888\ntrue\nfalse\nfalse\n888\ntrue\nfalse\ntrue\nfalse\ntrue\nfalse\n888\ntrue\nfalse\n888\n"
        ExitCode: 0
      llvm_valgrind:
        TimeOut: 3 # 1 second is often not enough on runners
        Output:
          String: "true\nfalse\nfalse\ntrue\nfalse\ntrue\ntrue\n888\ntrue\nfalse\nfalse\n888\ntrue\nfalse\ntrue\nfalse\ntrue\nfalse\n888\ntrue\nfalse\n888\n"
        ExitCode: 0
  exp_map:
    Cases:
      all:
        Output:
          String: "true\nfalse\nfalse\n3\n30\ntrue\nfalse\n3\n33\n55\n[1,3,5]\n[10,33,55]\ntrue\nfalse\nfalse\n[1,5]\ntrue\n888\n200\ntrue\ntrue\n100\ntrue\nfalse\ntrue\n10000\ntrue\n888\n4\npurr\ntrue\nfalse\ntrue\ncat cow duckling \n888\nabc\ntrue\nfalse\n888\nfifty!\n888\n[one,two]\n[one!,three]\n888\n"
        ExitCode: 0
      llvm_valgrind:
        TimeOut: 10 # 200-node tree under valgrind, 3 seconds is too tight
        Output:
          String: "true\nfalse\nfalse\n3\n30\ntrue\nfalse\n3\n33\n55\n[1,3,5]\n[10,33,55]\ntrue\nfalse\nfalse\n[1,5]\ntrue\n888\n200\ntrue\ntrue\n100\ntrue\nfalse\ntrue\n10000\ntrue\n888\n4\npurr\ntrue\nfalse\ntrue\ncat cow duckling \n888\nabc\ntrue\nfalse\n888\nfifty!\n888\n[one,two]\n[one!,three]\n888\n"
        ExitCode: 0

  # `exp.containers.PriorityQueue`: a binary heap, smallest element first.
  exp_priority_queue:
    Cases:
      all:
        Output:
          String: "true\n5\n1\n1\n1\n3\n2\n2\n4\n5\ntrue\n888\n200\ntrue\ntrue\n888\ncat cow duck duckling \ntrue\n888\nwake up\nwake up;eat;swim;\n888\n2\nab\n888\n"
        ExitCode: 0
      llvm_valgrind:
        TimeOut: 10 # 200-element heap under valgrind, 3 seconds is too tight
        Output:
          String: "true\n5\n1\n1\n1\n3\n2\n2\n4\n5\ntrue\n888\n200\ntrue\ntrue\n888\ncat cow duck duckling \ntrue\n888\nwake up\nwake up;eat;swim;\n888\n2\nab\n888\n"
        ExitCode: 0

  # `exp.io`: short readers for standard input.
  exp_io:
    Cases:
      all:
        Input:
          String: "  -42 17\n3.5\t2.25\nduck  ling\nx rest of the line\nhello world\n\n"
        Output:
          String: "-42\n17\n3.5\n2.25\n[duck]\n[ling]\nx[ rest of the line]\n[hello world]\n[]\n[]\n[]\n"
        ExitCode: 0
      llvm_valgrind:
        TimeOut: 3 # 1 second is often not enough on runners
        Input:
          String: "  -42 17\n3.5\t2.25\nduck  ling\nx rest of the line\nhello world\n\n"
        Output:
          String: "-42\n17\n3.5\n2.25\n[duck]\n[ling]\nx[ rest of the line]\n[hello world]\n[]\n[]\n[]\n"
        ExitCode: 0
