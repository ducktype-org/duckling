Tests:
  # We test if using std works by default.
  default_std:
    module_to_compile: "uses_std"
    Cases:
      uses_std:
        backend: all
        Output:
          String: "10\n42\n"

  # We test if not using std when disabling it in the compiler works.
  no_std:
    module_to_compile: "no_std"
    compile_dvm_options: "--no-std"
    compile_llvm_options: "--no-std"
    Cases:
      all:
        backend: all

  # In custom std instead of the default one we have a different implementation
  # of builtin_output that output 20 for the same `no_std` user code.
  custom_std:
    module_to_compile: "uses_std"
    compile_dvm_options: "--custom-std-path custom_std"
    compile_llvm_options: "--custom-std-path custom_std"
    std_artifacts_path_flag: ""
    Cases:
      all:
        backend: all
        Output:
          String: "x\nx\n"

  # We test if disabling the std and using it in the user code causes the expected compile error.
  no_std_fails:
    module_to_compile: "uses_std"
    PreCase: "mkdir -p @{case_build}"
    Cases:
      dvm:
        Run: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -a @{case_build} -n package_@{module_to_compile} -w @{duckc_worker_count} --no-std --dvm-backend"
        ExitCode: 1
      llvm:
        Run: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -a @{case_build} -n package_@{module_to_compile} -w @{duckc_worker_count} --no-std"
        ExitCode: 1

  both_options_fail:
    module_to_compile: "no_std"
    PreCase: "mkdir -p @{case_build}"
    Cases:
      dvm:
        Run: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -a @{case_build} -n package_@{module_to_compile} -w @{duckc_worker_count} --no-std --custom-std-path custom_std --dvm-backend"
        ExitCode: 1
      llvm:
        Run: "@{duckc_path} compile_package duck_modules/@{module_to_compile} -a @{case_build} -n package_@{module_to_compile} -w @{duckc_worker_count} --no-std --custom-std-path custom_std"
        ExitCode: 1
  
  compile_packages_default_std:
    module_to_compile: "uses_std"
    compile_dvm_only_cmd: "@{duckc_path} compile_packages duck_modules/@{module_to_compile}/manifest.json -a @{case_build}"
    compile_llvm_only_cmd: "@{duckc_path} compile_packages duck_modules/@{module_to_compile}/manifest.json -a @{case_build}"
    # The case builds through its own `compile_packages`, which the check cannot stand in
    # for, so it keeps its plain compile and the check runs on duplicated copies.
    determinism_duplicate_sources: "true"
    Cases:
      all:
        backend: all
        Output:
          String: "10\n42\n"
