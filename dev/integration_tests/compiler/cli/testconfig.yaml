# CLI tests

Run: "@{duckc_path} @{run_args}"

# Deliberately empty, so as not to recompile duckc and dvm for each test.
PreNode: ""

Tests:
  cli-options-base:
    Cases:
      help-message:
        # Tests help flag works
        run_args: "-h"
      something-wrong:
        # Tests whether duckc fails upon passing an invalid flag
        run_args: "-,"
        ExitCode: 1

  cli-options-dev-logs:
    Cases:
      empty-dev-logs-spaces:
        run_args: "--dev-logs  \" \"  dummy"
        
      single-dev-logs:
        run_args: "--dev-logs Query  dummy"
      
      double-dev-logs:
        run_args: "--dev-logs \"Query, Lexer\"  dummy"
      
      bad-dev-logs:
        run_args: "--dev-logs \"\"  dummy "
        ExitCode: 1

  cli-format:
    Cases:
      format-stdout:
        # Default formatting prints normalized source to stdout.
        run_args: "format format_unformatted.duck"
        Output:
          File: format_formatted.duck
      format-check-ok:
        # --check succeeds (exit 0) on an already-formatted file.
        run_args: "format -k format_formatted.duck"
      format-check-fail:
        # --check fails (exit 1) on an unformatted file.
        run_args: "format -k format_unformatted.duck"
        ExitCode: 1
      format-missing-config:
        # A non-existent config path errors cleanly instead of crashing.
        run_args: "format -c does_not_exist.json format_unformatted.duck"
        ExitCode: 1
