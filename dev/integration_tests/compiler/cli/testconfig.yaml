# CLI tests

# Every case gets a private scratch directory for its build artifacts,
# so cases can run concurrently and never dirty the source tree.
Env:
    DIT_TMP_DIR: "@{new_tmp_dir}"

case_build: "$DIT_TMP_DIR/build"

# Private copy of the shared warm std artifacts (see the root testconfig).
# duckc rewrites the artifacts directory on exit, so concurrent cases must not
# point at the shared one - same reason as in compiler/features.
case_std_artifacts: "$DIT_TMP_DIR/std_artifacts"
copy_std_artifacts: "cp -r @{std_artifacts_dir} @{case_std_artifacts} 2>/dev/null || true"

Run: "@{duckc_path} @{run_args}"

# `<tool> <major>.<minor>[.<patch>...][-<prerelease>]`.
version_regex: "[0-9]+(\\.[0-9]+)+(-[a-z]+)?"
# The commit the binaries were built from. Every build regenerates the hash and the root PreNode
# rebuilds duckc, VM and duck_ls first, so it is HEAD. Same command as GenerateCommitInfo.cmake.
commit_hash: "$(git -C @{dev_dir} rev-parse --short=9 HEAD)"
# The whole first line: `<tool> <version> (<commit hash> <commit date>)`.
version_line_regex: "@{version_regex} \\(@{commit_hash} [0-9]+-[0-9]+-[0-9]+\\)\\n"
# The `commit-hash:` row of `--version-verbose`.
commit_hash_row_regex: "\\ncommit-hash: +@{commit_hash}\\n"

# Deliberately empty, so as not to recompile duckc and dvm for each test.
PreNode: ""

Tests:
  cli-options-base:
    Cases:
      help-message:
        # Tests help flag works
        run_args: "-h"
      something-wrong:
        # Tests whether duckc fails upon passing an invalid flag
        run_args: "-,"
        ExitCode: 1

  cli-options-dev-logs:
    Cases:
      empty-dev-logs-spaces:
        run_args: "--dev-logs  \" \"  dummy"
        
      single-dev-logs:
        run_args: "--dev-logs Query  dummy"
      
      double-dev-logs:
        run_args: "--dev-logs \"Query, Lexer\"  dummy"
      
      bad-dev-logs:
        run_args: "--dev-logs \"\"  dummy "
        ExitCode: 1

  compile-modules:
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 3
    Cases:
      two-modules:
        run_args: "compile_modules ./duck_modules/two_modules/a.dk ./duck_modules/two_modules/b.dk -O 0 --no-incremental -a @{case_build} --custom-std-artifacts-path @{case_std_artifacts}"
        ExitCode: 0
      two-modules-no-executable:
        Run: >-
          @{duckc_path} compile_modules ./duck_modules/two_modules/b.dk ./duck_modules/two_modules/a.dk
          --no-executable -O 0 --no-incremental --dump-ir asm -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name '*.a.s' | wc -l)" -eq 1
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name '*.b.s' | wc -l)" -eq 1
          && test "$(find @{case_build} -type f -name '*.o' -size +0c | wc -l)" -ge 2
          && test ! -e @{case_build}/package_llvm.exe
        ExitCode: 0
      two-modules-dvm-no-executable:
        Run: >-
          @{duckc_path} compile_modules ./duck_modules/two_modules/b.dk ./duck_modules/two_modules/a.dk
          --dvm-backend --no-executable -O 0 --no-incremental --dump-ir dbc -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name '*.a.dbc' | wc -l)" -eq 1
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name '*.b.dbc' | wc -l)" -eq 1
          && test "$(find @{case_build} -maxdepth 1 -type f -name '*.dbc' -size +0c | wc -l)" -eq 2
          && test ! -e @{case_build}/package_dvm.dbc
        ExitCode: 0

  compile-module-artifact-location:
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 5
    # --name makes the HIR filenames predictable so they can be checked below.
    # Each case uses @{at_tmp_env} to keep relative ./duck_build output in its own
    # scratch directory.
    Cases:
      explicit-artifact-directory-short:
        Run: >-
          @{at_tmp_env} @{duckc_path} compile_module
          @{ConfigDir}/duck_modules/inferred_name/inferred_name.dk
          --name artifact_name_short -O 0 --no-incremental --dump-ir hir
          -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test -s "@{case_build}/duck_debug_artifacts/artifact_name_short.inferred_name.hir"
          && test -s "$(find @{case_build} -type f -name '*.o' -print -quit)"
          && test ! -e @{case_build}/package_llvm.exe
          && test ! -e "$DIT_TMP_DIR/duck_build"
        ExitCode: 0
      explicit-artifact-directory-long:
        Run: >-
          @{at_tmp_env} @{duckc_path} compile_module
          @{ConfigDir}/duck_modules/inferred_name/inferred_name.dk
          --name artifact_name_long -O 0 --no-incremental --dump-ir hir
          --artifact-location @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test -s "@{case_build}/duck_debug_artifacts/artifact_name_long.inferred_name.hir"
          && test -s "$(find @{case_build} -type f -name '*.o' -print -quit)"
          && test ! -e "$DIT_TMP_DIR/duck_build"
        ExitCode: 0
      # @TODO: #3398 Pre-create ./duck_build because the filesystem code currently panics when it tries
      # to create a new physical folder beneath the temporary directory.
      default-artifact-directory:
        Run: >-
          mkdir -p "$DIT_TMP_DIR/duck_build" &&
          @{at_tmp_env} @{duckc_path} compile_module
          @{ConfigDir}/duck_modules/inferred_name/inferred_name.dk
          --name artifact_name_default -O 0 --no-incremental --dump-ir hir
          --custom-std-artifacts-path @{case_std_artifacts}
          && test -s "$DIT_TMP_DIR/duck_build/duck_debug_artifacts/artifact_name_default.inferred_name.hir"
          && test -s "$(find "$DIT_TMP_DIR/duck_build" -type f -name '*.o' -print -quit)"
        ExitCode: 0

      dvm-object-artifact:
        Run: >-
          @{duckc_path} compile_module ./duck_modules/inferred_name/inferred_name.dk -O 0
          --dvm-backend --no-incremental --dump-ir dbc -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test -s "$(find @{case_build}/duck_debug_artifacts -type f -name '*.dbc' -print -quit)"
          && test -s "$(find @{case_build} -type f -path '*/query/*' -name '*.dbc' -print -quit)"
          && test ! -e @{case_build}/package_dvm.dbc
        ExitCode: 0

  compile-script-dump-ir:
    # Each case checks its dump and the linked output for that backend.
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 10
    Cases:
      assembly:
        Run: >-
          @{duckc_path} compile_script ./duck_scripts/foo.dks
          --dump-ir asm -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.s' | wc -l)" -eq 1
          && test -s "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.s' -print -quit)"
          && test -s "@{case_build}/foo.exe"
        ExitCode: 0
      llvm-ir:
        Run: >-
          @{duckc_path} compile_script ./duck_scripts/foo.dks
          --dump-ir llvm -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.ll' | wc -l)" -eq 1
          && test -s "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.ll' -print -quit)"
          && test -s "@{case_build}/foo.exe"
        ExitCode: 0
      dbc:
        Run: >-
          @{duckc_path} compile_script ./duck_scripts/foo.dks
          --dvm-backend --dump-ir dbc -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.dbc' | wc -l)" -eq 1
          && test -s "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.dbc' -print -quit)"
          && test -s "@{case_build}/foo.dbc"
        ExitCode: 0

  compile-script-lir:
    # The merged script LIR lives in Duckling's debug-artifact collection; use a private build dir.
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 10
    Cases:
      function-and-call:
        Run: >-
          @{duckc_path} compile_script ./duck_scripts/foo.dks
          --dump-ir lir -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.lir' | wc -l)" -eq 1
          && test -s "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.lir' -print -quit)"
          && grep -q 'foo' "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.lir' -print -quit)"
        ExitCode: 0

  compile-script-mir:
    # Checks if MIR is collected in source order in one debug artifact.
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 10
    Cases:
      foo-script:
        Run: >-
          @{duckc_path} compile_script ./duck_scripts/foo.dks
          --dump-ir mir -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name '*.mir' | wc -l)" -eq 1
          && test -s "$(find @{case_build}/duck_debug_artifacts -type f -name '*.mir' -print -quit)"
        ExitCode: 0
      multiple-statements:
        Run: >-
          @{duckc_path} compile_script ./duck_scripts/foo.dks --dump-ir mir -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name '*.mir' | wc -l)" -eq 1
          && mir_dump="$(find @{case_build}/duck_debug_artifacts -type f -name '*.mir' -print -quit)"
          && test "$(grep -c '^MIR for ' "$mir_dump")" -eq 4
          && awk '/4242/ && !first { first = NR } /1234/ && !second { second = NR } /7777/ && !third { third = NR } END { exit !(first && second && third && first < second && second < third) }' "$mir_dump"
        ExitCode: 0

  compile-script-hir:
    # Checks if HIR is collected in source order in one debug artifact.
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 10
    Cases:
      multiple-statements:
        Run: >-
          @{duckc_path} compile_script ./duck_scripts/foo.dks --dump-ir hir -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name '*.hir' | wc -l)" -eq 1
          && hir_dump="$(find @{case_build}/duck_debug_artifacts -type f -name '*.hir' -print -quit)"
          && test "$(grep -c '^HIR for ' "$hir_dump")" -eq 4
          && awk '/4242/ && !first { first = NR } /1234/ && !second { second = NR } /7777/ && !third { third = NR } END { exit !(first && second && third && first < second && second < third) }' "$hir_dump"
        ExitCode: 0

  dump-ir-help:
    Cases:
      artifact-extensions:
        Run: >-
          @{duckc_path} compile_module --help
          | grep -F 'hir (.hir), mir (.mir), lir (.lir), llvm (.ll), asm (.s), and dbc (.dbc)'
        ExitCode: 0

  compile-script-no-executable:
    # Compile the script object/bytecode artifacts but skip the final executable/package link.
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 10
    Cases:
      llvm-object:
        Run: >-
          @{duckc_path} compile_script ./duck_scripts/foo.dks
          --no-executable --dump-ir asm -a @{case_build} --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.s' | wc -l)" -eq 1
          && test -s "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.s' -print -quit)"
          && test "$(find @{case_build} -type f -name '*.o' | wc -l)" -eq 1
          && test ! -e @{case_build}/foo.exe
        ExitCode: 0
      dvm-object:
        Run: >-
          @{duckc_path} compile_script ./duck_scripts/foo.dks
          --dvm-backend --no-executable --dump-ir dbc -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.dbc' | wc -l)" -eq 1
          && test -s "$(find @{case_build}/duck_debug_artifacts -type f -name 'script_module_*.dbc' -print -quit)"
          && test "$(find @{case_build} -type f -name '*.o.dbc' | wc -l)" -eq 1
          && test ! -e @{case_build}/foo.dbc
        ExitCode: 0

  compile-package-inferred-name:
    # Without -n, compile_package names the package after its directory or root module file.
    # The package id is the prefix of the dumped IR file name, so check that file exists.
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 3
    inferred_hir: "@{case_build}/duck_debug_artifacts/inferred_name.inferred_name.hir"
    Run: "@{duckc_path} compile_package @{package_path} -O 0 --no-incremental --dvm-backend
      --dump-ir hir -a @{case_build} --custom-std-artifacts-path @{case_std_artifacts}
      && test -f @{inferred_hir}"
    Cases:
      from-directory:
        package_path: "./duck_modules/inferred_name"
        ExitCode: 0
      from-root-module-file:
        package_path: "./duck_modules/inferred_name/inferred_name.dk"
        ExitCode: 0

  compile-package-no-executable:
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 10
    Cases:
      llvm-objects:
        Run: >-
          @{duckc_path} compile_package ./duck_modules/inferred_name --no-executable -O 0
          --no-incremental -a @{case_build} --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build} -type f -name '*.o' | wc -l)" -gt 0
          && test ! -e @{case_build}/package_llvm.exe
        ExitCode: 0
      dvm-objects:
        Run: >-
          @{duckc_path} compile_package ./duck_modules/inferred_name --dvm-backend
          --no-executable --no-incremental --dump-ir dbc -a @{case_build}
          --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build} -maxdepth 1 -type f -name '*.dbc' -size +0c | wc -l)" -gt 0
          && test ! -e @{case_build}/package_dvm.dbc
        ExitCode: 0

  compile-packages-dump-ir:
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 10
    package_manifest: "$DIT_TMP_DIR/packages.json"
    Cases:
      object-task:
        Run: >-
          printf '%s' '{"packages":[{"id":"inferred_name","name":"inferred_name","path":"duck_modules/inferred_name"}],"tasks":[{"package":"inferred_name","strategy":"obj"}]}' > @{package_manifest}
          && @{duckc_path} compile_packages @{package_manifest} -O 0 --no-incremental --dump-ir hir
          -a @{case_build} --custom-std-artifacts-path @{case_std_artifacts}
          && test -s "@{case_build}/duck_debug_artifacts/inferred_name.inferred_name.hir"
          && test -s "$(find @{case_build} -type f -name '*.o' -print -quit)"
        ExitCode: 0

  compile-packages-no-executable:
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 10
    package_manifest: "$DIT_TMP_DIR/packages.json"
    Cases:
      native-and-dvm-tasks:
        Run: >-
          printf '%s' '{"packages":[{"id":"inferred_name","name":"inferred_name","path":"duck_modules/inferred_name"}],"tasks":[{"package":"inferred_name","strategy":"native","output_file":"native_output"},{"package":"inferred_name","strategy":"dvm_exe","output_file":"dvm_output"}]}' > @{package_manifest}
          && @{duckc_path} compile_packages @{package_manifest} -O 0 --no-incremental --no-executable
          -a @{case_build} --custom-std-artifacts-path @{case_std_artifacts}
          && test "$(find @{case_build} -type f -name '*.o' | wc -l)" -gt 0
          && test "$(find @{case_build} -type f -name '*.dbc' | wc -l)" -gt 0
          && test ! -e @{case_build}/native_output
          && test ! -e @{case_build}/dvm_output
        ExitCode: 0

  comp-time-output:
    # Test compile time output to stderr
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    timeout_default: 5
    Run: "@{expect_output} --err-regex '\\[comp-time\\] 3492'
      -- @{duckc_path} compile_modules ./duck_modules/comp_time_output/comp_time_output.dk
      -O 0 --no-incremental --dvm-backend -a @{case_build}
      --custom-std-artifacts-path @{case_std_artifacts}"
    Cases:
      dvm-backend:
        ExitCode: 0

  cli-version:
    # The shared rows are the Version module's job. What only the real binary can prove is that it
    # names itself correctly, reports the commit it was built from and contributes its own extra rows.
    Cases:
      duckc-version:
        Run: '@{expect_output} --out-regex "^duckc @{version_line_regex}" -- @{duckc_path} --version'

      duckc-version-verbose:
        Run: '@{expect_output} --out-regex "^duckc @{version_line_regex}"
          --out-regex "@{commit_hash_row_regex}"
          --out-regex "LLVM: +[0-9]+\."
          --out-regex "JIT: +(enabled|disabled)"
          -- @{duckc_path} --version-verbose'

      vm-version:
        Run: '@{expect_output} --out-regex "^DVM @{version_line_regex}" -- @{dvm_path} --version'

      vm-version-verbose:
        Run: '@{expect_output} --out-regex "^DVM @{version_line_regex}"
          --out-regex "@{commit_hash_row_regex}"
          --out-regex "dispatch: +[A-Za-z]"
          -- @{dvm_path} --version-verbose'

      duck-ls-version:
        Run: '@{expect_output} --out-regex "^duck_ls @{version_line_regex}"
          -- @{duck_ls_path} --version'

      duck-ls-version-verbose:
        Run: '@{expect_output} --out-regex "^duck_ls @{version_line_regex}"
          --out-regex "@{commit_hash_row_regex}"
          -- @{duck_ls_path} --version-verbose'
