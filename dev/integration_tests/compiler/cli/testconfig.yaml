# CLI tests

# Every case gets a private scratch directory for its build artifacts,
# so cases can run concurrently and never dirty the source tree.
Env:
    DIT_TMP_DIR: "@{new_tmp_dir}"

case_build: "$DIT_TMP_DIR/build"

# Private copy of the shared warm std artifacts (see the root testconfig).
# duckc rewrites the artifacts directory on exit, so concurrent cases must not
# point at the shared one - same reason as in compiler/features.
case_std_artifacts: "$DIT_TMP_DIR/std_artifacts"
copy_std_artifacts: "cp -r @{std_artifacts_dir} @{case_std_artifacts} 2>/dev/null || true"

Run: "@{duckc_path} @{run_args}"

# `<tool> <major>.<minor>[.<patch>...][-<prerelease>]`, followed by the commit group when the
# build came from a git worktree - so the regex must not be anchored at the end of the line.
version_regex: "[0-9]+(\\.[0-9]+)+(-[a-z]+)?"

# Deliberately empty, so as not to recompile duckc and dvm for each test.
PreNode: ""

Tests:
  cli-options-base:
    Cases:
      help-message:
        # Tests help flag works
        run_args: "-h"
      something-wrong:
        # Tests whether duckc fails upon passing an invalid flag
        run_args: "-,"
        ExitCode: 1

  cli-options-dev-logs:
    Cases:
      empty-dev-logs-spaces:
        run_args: "--dev-logs  \" \"  dummy"
        
      single-dev-logs:
        run_args: "--dev-logs Query  dummy"
      
      double-dev-logs:
        run_args: "--dev-logs \"Query, Lexer\"  dummy"
      
      bad-dev-logs:
        run_args: "--dev-logs \"\"  dummy "
        ExitCode: 1

  compile-modules:
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 3
    Cases:
      two-modules:
        run_args: "compile_modules ./duck_modules/two_modules/a.dk ./duck_modules/two_modules/b.dk -O 0 --no-incremental -a @{case_build} --custom-std-artifacts-path @{case_std_artifacts}"
        ExitCode: 0

  query-graph-dump:
    # The experimental subcommand writes the query graph before and after optimization as JSON,
    # and the Graphviz helper script can read both dumps.
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    TimeOut: 3
    graph_dir: "$DIT_TMP_DIR/graph"
    dump_cmd: "@{duckc_path} experimental_compile_package_dump_graph
      ./duck_modules/query_graph_dump/query_graph_dump.dk -n query_graph_dump -O 0
      -a @{case_build} --custom-std-artifacts-path @{case_std_artifacts}"
    to_dot: "python3 @{dev_dir}/scripts/query_graph/query_graph_to_dot.py"
    Cases:
      dump-and-convert:
        Run: "@{dump_cmd} --graph-output @{graph_dir}
          && @{to_dot} @{graph_dir}/query_graph_pre_opt.json
          && @{to_dot} @{graph_dir}/query_graph_post_opt.json --no-inputs
          && grep -q 'CompileModule' @{graph_dir}/query_graph_post_opt.dot"
        ExitCode: 0
      rename-pass:
        # Inputs get readable names and unstable query names are hidden.
        Run: "@{dump_cmd} --graph-output @{graph_dir} --rename-pass
          && grep -q '\"Source Code Input\"' @{graph_dir}/query_graph_pre_opt.json
          && grep -q '\"Module Structure Input\"' @{graph_dir}/query_graph_pre_opt.json
          && grep -q '\"Unstable Node\"' @{graph_dir}/query_graph_pre_opt.json
          && ! grep -q 'PSTAccessSideInput' @{graph_dir}/query_graph_pre_opt.json
          && ! grep -q 'QueryModuleSideInput' @{graph_dir}/query_graph_post_opt.json"
        ExitCode: 0
      simplify-pass:
        # Submodule nodes are gone, source code inputs used by one node are merged, and the
        # rename pass runs too. The helper script still reads the result.
        Run: "@{dump_cmd} --graph-output @{graph_dir} --simplify-pass
          && ! grep -q 'QuerySubmodule' @{graph_dir}/query_graph_pre_opt.json
          && grep -q 'Source Code Input times ' @{graph_dir}/query_graph_post_opt.json
          && grep -q '\"Unstable Node\"' @{graph_dir}/query_graph_pre_opt.json
          && @{to_dot} @{graph_dir}/query_graph_post_opt.json"
        ExitCode: 0
      no-incremental-is-rejected:
        # Without incremental compilation there is no query graph to dump.
        Run: "@{dump_cmd} --graph-output @{graph_dir} --no-incremental"
        ExitCode: 1

  comp-time-output:
    # Test compile time output to stderr
    PreCase: "mkdir -p @{case_build} && @{copy_std_artifacts}"
    timeout_default: 5
    Run: "@{expect_output} --err-regex '\\[comp-time\\] 3492'
      -- @{duckc_path} compile_modules ./duck_modules/comp_time_output/comp_time_output.dk
      -O 0 --no-incremental --dvm-backend -a @{case_build}
      --custom-std-artifacts-path @{case_std_artifacts}"
    Cases:
      dvm-backend:
        ExitCode: 0

  cli-version:
    # The shared rows are the Version module's job and are unit-tested there. What only the real
    # binary can prove is that it names itself correctly and contributes its own extra rows.
    Cases:
      duckc-version:
        Run: '@{expect_output} --out-regex "^duckc @{version_regex}" -- @{duckc_path} --version'

      duckc-version-verbose:
        Run: '@{expect_output} --out-regex "^duckc @{version_regex}"
          --out-regex "LLVM: +[0-9]+\."
          --out-regex "JIT: +(enabled|disabled)"
          -- @{duckc_path} --version-verbose'

      vm-version:
        Run: '@{expect_output} --out-regex "^DVM @{version_regex}" -- @{dvm_path} --version'

      vm-version-verbose:
        Run: '@{expect_output} --out-regex "^DVM @{version_regex}"
          --out-regex "dispatch: +[A-Za-z]"
          -- @{dvm_path} --version-verbose'
