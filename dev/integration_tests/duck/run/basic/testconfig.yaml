profile-name: ""
PostCase: python3 check.py @{profile-name} && @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  # @TODO: #2920 This shouldn't be needed (manually fixup return type).
  echo @{nonzero-return-src} > foo/src/src.dmf
  echo "profiles:
    my-profile:
      opt-level: z
      dvm-bytecode: true
    bench:
      opt-level: 2
    my-profile2:
      inherits: my-profile
      opt-level: s" >> foo/quackconfig.yaml
Tests:
  basic:
    Description: can run a new project, and expands profiles
    Cases:
      dev:
        test-cmd: duck -C foo run
        profile-name: dev
        ExitCode: 42
      release:
        test-cmd: duck -C foo run --release
        profile-name: release
        ExitCode: 42
      release2:
        profile-name: release
        test-cmd: duck -C foo run --profile=release
        ExitCode: 42
      relase3:
        profile-name: release
        test-cmd: duck --color=never -C foo run --profile release
        ExitCode: 42
      custom-profile:
        test-cmd: duck -C foo run --profile my-profile
        profile-name: my-profile
        ExitCode: 42
      overridden-builtin-profile:
        test-cmd: duck -C foo run --profile bench
        profile-name: bench
        ExitCode: 42
      custom-profile-inherited:
        test-cmd: duck -C foo run --profile my-profile2
        profile-name: my-profile2
        ExitCode: 42
      # @TODO: #3023 Reenable verbose itests
      verbose:
        test-cmd: duck -C foo run --verbose
        profile-name: dev
        ExitCode: 42
        Enabled: "false"
      verbose-release:
        test-cmd: duck -C foo run --release --verbose
        profile-name: release
        ExitCode: 42
        Enabled: "false"
      verbose-release2:
        test-cmd: duck -C foo run --profile=release --verbose
        profile-name: release
        ExitCode: 42
        Enabled: "false"
      verbose-release3:
        test-cmd: duck -C foo run --profile release --verbose
        profile-name: release
        ExitCode: 42
        Enabled: "false"
