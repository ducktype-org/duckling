PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
Tests:
  duck/init/reinitialization-renamed:
    Description: cannot reinitialise a project
    Cases:
      init:
        test-cmd: duck init foo --name bar
        ExitCode: 1
        Err:
          Run: |+
            echo "error: cannot reinitialize project \`foo\` at \`$DIT_TMP_DIR/foo\`"
