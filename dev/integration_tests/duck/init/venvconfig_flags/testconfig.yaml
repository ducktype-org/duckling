Tests:
  init:
    Description: can initialise a new project with different venvconfig flags
    Cases:
      expose_freezefile:
        test_cmd: |+
          init --expose-freezefile foo
        Output:
          Run: |+
            echo "info: successfully created a new project \`foo\` at \`$(pwd)/foo\`"
        PostCase: python3 check1.py
      ephemeral:
        test_cmd: |+
          init --ephemeral foo
        Output:
          Run: |+
            echo "info: successfully created a new project \`foo\` at \`$(pwd)/foo\`"
        PostCase: python3 check2.py
      local_storage:
        test_cmd: |+
          init --local-storage foo
        Output:
          Run: |+
            echo "info: successfully created a new project \`foo\` at \`$(pwd)/foo\`"
        PostCase: python3 check3.py