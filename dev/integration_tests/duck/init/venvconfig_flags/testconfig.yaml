PostCase: "python3 check.py; s1=$?; rm -r foo; s2=$?; [ $s1 -eq 0 ] && [ $s2 -eq 0 ]"

Tests:
  init:
    Description: can initialise a new project with different venvconfig flags
    Cases:
      expose_freezefile:
        test_cmd: |+
          init --expose-freezefile foo &&
          cd foo &&
          git rev-parse --show-toplevel &&
          cat venvconfig.yaml
        Output:
          Run: |+
            echo "info: successfully created a new project \`foo\` at \`$(pwd)/foo\`
            $(pwd)/foo
            expose_freezefile: true"
      ephemeral:
        test_cmd: |+
          init --ephemeral foo &&
          cd foo &&
          git rev-parse --show-toplevel &&
          cat venvconfig.yaml
        Output:
          Run: |+
            echo "info: successfully created a new project \`foo\` at \`$(pwd)/foo\`
            $(pwd)/foo
            ephemeral: true"
      local_storage:
        test_cmd: |+
          init --local-storage foo &&
          cd foo &&
          git rev-parse --show-toplevel &&
          cat venvconfig.yaml
        Output:
          Run: |+
            echo "info: successfully created a new project \`foo\` at \`$(pwd)/foo\`
            $(pwd)/foo
            local_storage: storage"