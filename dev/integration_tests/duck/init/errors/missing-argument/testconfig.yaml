Tests:
  duck/init/errors/missing-argument:
    Description: name/path is required
    Cases:
      init:
        test-cmd: duck init
        ExitCode: 1
        Err:
          String: |+
            error: the following required arguments were not provided:
              <path>
            
            Usage: duck init <path>
            
            For more information, try '--help'.
