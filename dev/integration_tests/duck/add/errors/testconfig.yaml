PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init a
  @{duck-exe} -C foo add --local ../a a
  mkdir not_package

Tests:
  errors:
    Cases:
      nonexistent-local:
        test-cmd: duck -C foo add --local ../not_package not_package
        ExitCode: 1
        Err:
          Run: |+
            echo "error: the directory \`$DIT_TMP_DIR/not_package\` has no manifest"
      duplicated-effective-names:
        test-cmd: duck -C foo add --local ../a a
        ExitCode: 1
        Err:
          Run: |+
            echo "error: there already is a dependency \`a\` in the project \`foo\` at \`$DIT_TMP_DIR/foo\`

            hint: use aliases to have multiple dependencies with the same name"
      duplicated-sources:
        test-cmd: duck -C foo add --local ../a --alias b a
        ExitCode: 1
        Err:
          Run: |+
            echo "error: failed to add the dependency \`b\` to the project \`foo\` at \`$DIT_TMP_DIR/foo\`
            
              Caused by:
                the modified manifest would fail to parse
            
              Caused by:
                dependency \`b\` has the same source as dependency \`a\`"

SubDirs:
  - cannot-add-itself
