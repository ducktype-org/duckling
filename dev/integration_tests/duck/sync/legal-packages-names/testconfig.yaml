package-name: 'foo'
add-dep: 'false'
test-cmd: duck sync
PreCase: |+
  @{cd-tmp-dir}
  echo "metadata:
    name: '@{package-name}'
    version: 1.0.0" > quackconfig.yaml

  if [ '@{add-dep}' == 'true' ]; then
    echo "dependencies:
      foo-bar:
        source:
          path: foo-bar" >> quackconfig.yaml
    @{duck-exe} init foo-bar
  fi
Tests:
  package-names:
    Description: Validates package's and dependencies' names
    Cases:
      package-name-can-contain-a-dash:
        package-name: foo-bar
        Output:
          String: 'info: successfully synchronized venv \`@{package-name}\`\n'
      dependency-can-contain-a-dash:
        add-dep: 'true'
        Output:
          String: 'info: successfully synchronized venv \`@{package-name}\`\n'
