PostCase: python3 check.py && @{cleanup_tmp_env} && rm /tmp/qp_iis_expl.txt
PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init bar
  echo "dependencies:
    bar:
      source:
        path: ../bar
      features: [nonexistent]" >> foo/quackconfig.yaml

Tests:
  basic:
    Description: can explain why no solution is possible
    Cases:
      sync:
        test-cmd: duck -C foo sync --external-errors
        ExitCode: 1
        Err:
          Run: |+
            echo "error: no solution to the dependency problem found; SCIP run's status is Infeasible

            note: the explaination why there is no solution was written to \`/tmp/qp_iis_expl.txt\`"