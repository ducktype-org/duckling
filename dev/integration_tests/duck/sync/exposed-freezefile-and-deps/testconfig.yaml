PostCase: python3 check.py @{check-arg} && @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo --expose-freezefile
  @{duck-exe} init bar
  @{duck-exe} -C foo add --features b --local ../bar @{alias-bar} bar
  echo "features:
    f: []" >> foo/quackconfig.yaml

  echo "features:
    b: []" >> bar/quackconfig.yaml

Tests:
  exposed-freezefile-and-deps:
    Description: can sync a project with deps which exposes a freezefile
    Cases:
      basic:
        test-cmd: duck -C foo sync
        alias-bar: ""
        check-arg: no_alias
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: running gathering
            info: starting the solver engine
            info: starting loading 2 packages
            info: loaded source codes of 2 packages, 0 were downloaded, 2 were already present
            info: successfully synchronized venv \`foo\`"
      alias:
        test-cmd: duck -C foo sync
        alias-bar: --alias alias
        check-arg: alias
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: running gathering
            info: starting the solver engine
            info: starting loading 2 packages
            info: loaded source codes of 2 packages, 0 were downloaded, 2 were already present
            info: successfully synchronized venv \`foo\`"
        
