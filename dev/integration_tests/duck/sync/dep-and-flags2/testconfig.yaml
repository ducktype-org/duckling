PostCase: python3 check.py && @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init bar
  echo "dependencies:
    bar:
      source:
        path: ../bar
      features: [b]

  features:
    f: []" >> foo/quackconfig.yaml

  echo "features:
    b: []" >> bar/quackconfig.yaml

Tests:
  dep-and-flags2:
    Description: can sync a project with dependency, conditions and flags
    Cases:
      sync:
        test-cmd: duck -C foo sync
        Output:
          Run: |+
            echo "info: starting a synchronization of a package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: running gathering
            info: starting the solver engine
            info: starting fetching 2 packages
            info: successfully synchronized venv \`foo\`"
        
