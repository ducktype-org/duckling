PostCase: python3 check.py && @{cleanup_tmp_env}
PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo

Tests:
  basic:
    Description: can sync a new project
    Cases:
      sync:
        test-cmd: duck -C foo sync
        Output:
          String: |+
            info: loaded source code of 1 package, 0 were downloaded, 1 was already present
            info: successfully synchronized venv \`foo\`
