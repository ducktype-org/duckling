PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  echo "lints:
    duck:
      unknowN_lints: allow" >> foo/quackconfig.yaml

Tests:
  unknown_lints:
    Description: checks "unknown_lints" lint
    Cases:
      sync:
        test-cmd: duck -C foo sync
        Err:
          String: |+
            warning: there is no such lint as \`unknowN_lints\`
                     hint: did you mean \`unknown_lints\` [unknown_lints]
        Output:
          String: |+
            info: loaded source code of 1 package, 0 were downloaded, 1 was already present
            info: successfully synchronized venv \`foo\`
