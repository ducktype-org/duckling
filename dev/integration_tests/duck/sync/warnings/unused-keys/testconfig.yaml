PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  echo "  unused-under-metadata: unused
  unused-top-level:
    inner: 1" >> foo/quackconfig.yaml

Tests:
  unused-keys:
    Description: emits warnings about unused keys
    Cases:
      sync:
        test-cmd: duck -C foo sync
        Err:
          String: |+
            warning: the key \`metadata.unused-under-metadata\` is unused
            warning: the key \`unused-top-level\` is unused
        Output:
          String: |+
            info: loaded source code of 1 package, 0 were downloaded, 1 was already present
            info: successfully synchronized venv \`foo\`
