PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  echo "features:
    xd: [xd]" >> foo/quackconfig.yaml

Tests:
  feature_pulls_itself:
    Description: checks "self_implying_features" lint
    Cases:
      sync:
        test-cmd: duck -C foo sync
        Err:
          String: |+
            warning: feature \`xd\` implies itself [self_implying_features]
        Output:
          String: |+
            info: loaded source code of 1 package, 0 were downloaded, 1 was already present
            info: successfully synchronized venv \`foo\`
