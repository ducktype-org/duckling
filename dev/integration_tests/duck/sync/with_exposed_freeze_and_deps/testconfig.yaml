# The exposed freezefile is written into the project, so sync a copy
# staged inside the tmp env instead of the committed one.
tmp_env_files: "foo bar"
before_cmd: "@{make_tmp_env} && cd \"$DIT_TMP_DIR\""

PostCase: python3 check.py && @{cleanup_tmp_env}

Tests:
  sync:
    Description: can sync a project with deps which exposes a freezefile
    Cases:
      sync:
        test_cmd: duck -C foo sync
        Output:
          String: 'info: successfully synchronized venv \`foo\`\n'
        
