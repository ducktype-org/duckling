Tests:
  messages-on-stderr:
    Description: duck prints every message to stderr and keeps stdout free for the programs it runs
    Cases:
      help:
        test-cmd: duck --help
        ExitCode: 0
        Output:
          String: ""

      init-and-sync:
        test-cmd: duck init foo && duck -C foo sync
        ExitCode: 0
        Output:
          String: ""
        Err:
          Run: |+
            echo "info: successfully created a new project \`foo\` at \`$DIT_TMP_DIR/foo\`" &&
            echo "info: loaded source code of 1 package, 0 were downloaded, 1 was already present" &&
            echo "info: successfully synchronized venv \`foo\`"

      error:
        test-cmd: duck not-a-subcmd
        ExitCode: 1
        Output:
          String: ""
        Err:
          String: 'error: no such command as \`not-a-subcmd\`\n'
