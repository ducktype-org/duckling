before_cmd: export DUCK_HOME="$(pwd)"

Tests:
  test-basic-flow:
    Description: Checks a lot of basic flows, such as happy, builtin alias, auto fix...
    Cases:
      runs-builtin-command:
        test_cmd: build
        ExitCode: 1
        Err:
          Run: 'echo "error: no manifest has been found from the \`$(pwd)\` to the \`/\`"'
      runs-builtin-alias:
        test_cmd: b
        ExitCode: 1
        Err:
          Run: 'echo "error: no manifest has been found from the \`$(pwd)\` to the \`/\`"'
      runs-user-alias:
        test_cmd: my-custom-build-alias
        ExitCode: 1
        Err:
          Run: 'echo "error: no manifest has been found from the \`$(pwd)\` to the \`/\`"'
      autofix-success:
        test_cmd: buil
        ExitCode: 1
        Err:
          Run: 'echo "error: no manifest has been found from the \`$(pwd)\` to the \`/\`"'

