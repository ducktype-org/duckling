Tests:
  test-basic-errors:
    Description: Checks a lot of basic errors
    Cases:
      autofix-fail:
        test_cmd: x
        ExitCode: 1
        Err: |
          Error: No such command as `x`. Did you mean:
            - `b`
            - `r`?

      invalid-subcmd:
        test_cmd: not-a-subcmd
        ExitCode: 1
        Err: 'Error: No such command: `not-a-subcmd`'
      
      invalid-config:
        prepare: export QP_CONFIG=./
        test_cmd: "not-a-command 2>&1 | head -n4 " # Get first for lines, but we lose exit code and stderr
        ExitCode: 0
        Output: |
          Error: when trying to check maximum typos fixing distance

            Caused by:
              when getting key `security.typos.max_distance` expected integer, not a string
