Tests:
  test-basic-errors:
    Description: Checks a lot of basic errors
    Cases:
      autofix-fail:
        test_cmd: duck x
        ExitCode: 1
        Err:
          String: |
            error: No such command as \`x\`. Did you mean:
                   - \`b\`
                   - \`r\`?

      invalid-subcmd:
        test_cmd: duck not-a-subcmd
        ExitCode: 1
        Err:
          String: 'error: No such command: \`not-a-subcmd\`\n'

      invalid-config:
        before_cmd: export DUCK_HOME=.
        test_cmd: duck not-a-command
        ExitCode: 1
        Err:
          Run: |+
            echo "error: when trying to check the maximum typos fixing distance
            
              Caused by:
                the key \`security.typos.max_distance\` expects a positive integer, not a string
            
              Caused by:
                when parsing the configuration at \`$(pwd)/config.yaml\`"
