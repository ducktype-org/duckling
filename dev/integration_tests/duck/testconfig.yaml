load-cargo: . ${CARGO_HOME:-$HOME/.cargo}/env
cd-duck-root: cd @{dev_dir}/src/duck/
# NOTE: Changes made here should also be reflected in `workflows/tests.yml`
# Changes means changes to compiling duck itself.
build-duck: |
  timeout 3m cargo --locked build
  exit_code=$?
  # 124 is `timeout`'s standard exit code for command timeout.
  if [ "$exit_code" -eq 124 ]; then
    echo "compiling duck would take more than three minutes!" >&2
    echo "this can be our bug, rust's bug, or someone else's bug (GitHub can also be a culprit, particularly \`cargo build\` downloads SCiP artifacts from GitHub)" >&2
  fi
  if [ "$exit_code" -ne 0 ]; then
    exit "$exit_code"
  fi
duck-exe-dir: '@{dev_dir}/src/duck/target/debug/'
duck-exe: '@{duck-exe-dir}/duck'
before-cmd: "true"

# Every case gets a private DUCK_HOME under its tmp dir, so cases can
# run concurrently and never write caches into the source tree.
Env:
    DIT_TMP_DIR: "@{new_tmp_dir}"
    DUCK_HOME: "echo $DIT_TMP_DIR/duck_home"

PostCase: "@{cleanup_tmp_env}"

cd-tmp-dir: cd ${DIT_TMP_DIR}

# Sometimes we hit a test timeout in itests, but only in CI.
# It's because when we create a fetcher cache (an SQLite database), we execute a statement to create a basic table.
# This causes SQLite to create a file and some other stuff. It also calls fsync on a parent directory.
# This can be slow in CI/CD running under Docker, so increase artificially the timeout.
# 5 seconds seems to be enough.
timeout_default: 5

PreNode: |
  @{load-cargo}
  @{cd-duck-root}
  @{build-duck}
  cd -

Run: 'export PATH="@{duck-exe-dir}:$PATH" && @{cd-tmp-dir} && @{before-cmd} && @{test-cmd}'

SubDirs:
  - cli
  - sync
  - init
  - build

# @TODO: #2920 This shouldn't need ` -> i64`.
default-src: "import core.builtins.*;\nfun main() -> i64 = {\n    return 0;\n}"
