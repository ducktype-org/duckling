load_cargo: . $HOME/.cargo/env
cwd_duck_root: cd ../../src/duck/duck
build_duck: cargo build
duck_exe_path: ../../src/duck/duck/target/debug/duck
color: never
prepare: "true"

PreTest: "@{load_cargo} && @{cwd_duck_root} && @{build_duck} && @{prepare}"
Run: bash -c "@{duck_exe_path} --color=@{color} @{test_cmd}"

SubDirs:
  - cli