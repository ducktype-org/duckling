load_cargo: . ${CARGO_HOME:-$HOME/.cargo}/env
cwd_duck_root: cd `git rev-parse --show-toplevel`/dev/src/duck/
build_duck: cargo --locked build
duck_exe_path: '`git rev-parse --show-toplevel`/dev/src/duck/target/debug/duck'
color: never
prepare: ""
before_cmd: "true"

PreNode: |
  @{load_cargo}
  @{cwd_duck_root}
  @{build_duck}
  cd -

PreTest: |
  @{prepare}

Run: bash -c "@{before_cmd} && @{duck_exe_path} --color=@{color} @{test_cmd}"

SubDirs:
  - cli
  - sync
  - init
  - build
