profile-name: ""
PostCase: |+
  python3 check.py @{profile-name}
  @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  echo "profiles:
    my-profile:
      opt-level: z
      dvm-bytecode: true
    bench:
      opt-level: 2
    my-profile2:
      inherits: my-profile
      opt-level: s" >> foo/quackconfig.yaml

Tests:
  duck/build/mock-duckc/basic:
    Description: can build a new project, and expands profiles
    Cases:
      dev:
        test-cmd: duck -C foo build
        profile-name: dev
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      release:
        test-cmd: duck -C foo build --release
        profile-name: release
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      release2:
        profile-name: release
        test-cmd: duck -C foo build --profile=release
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      release3:
        profile-name: release
        test-cmd: duck --color=never -C foo build --profile release
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      custom-profile:
        test-cmd: duck -C foo build --profile my-profile
        profile-name: my-profile
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      overridden-builtin-profile:
        test-cmd: duck -C foo build --profile bench
        profile-name: bench
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      custom-profile-inherited:
        test-cmd: duck -C foo build --profile my-profile2
        profile-name: my-profile2
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      # NOTE: verbose tests are disabled, since compilation order is not deterministic
      verbose:
        test-cmd: duck -C foo build --verbose
        profile-name: dev
        Enabled: "false"
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 1\`"
      verbose-release:
        test-cmd: duck -C foo build --release --verbose
        profile-name: release
        Enabled: "false"
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 3 --no-incremental\`"
      verbose-release2:
        test-cmd: duck -C foo build --profile=release --verbose
        profile-name: release
        Enabled: "false"
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 3 --no-incremental\`"
      verbose-release3:
        test-cmd: duck -C foo build --profile release --verbose
        profile-name: release
        Enabled: "false"
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 3 --no-incremental\`"
