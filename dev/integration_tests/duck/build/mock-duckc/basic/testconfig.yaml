profile-name: ""
foo: "foo-1.0.0-[HASH]"
PostCase: |+
  python3 check.py @{profile-name}
  @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  echo "profiles:
    my-profile:
      opt-level: z
      dvm-bytecode: true
    bench:
      opt-level: 2
    my-profile2:
      inherits: my-profile
      opt-level: s" >> foo/quackconfig.yaml

Tests:
  basic:
    Description: can build a new project, and expands profiles
    Cases:
      dev:
        test-cmd: duck -C foo build
        profile-name: dev
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: no need to run the gathering or the solver engine
            info: starting fetching 1 package
            info: fetched source codes of 1 package, 0 downloaded, 1 was alredy present
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`..."
      release:
        test-cmd: duck -C foo build --release
        profile-name: release
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: no need to run the gathering or the solver engine
            info: starting fetching 1 package
            info: fetched source codes of 1 package, 0 downloaded, 1 was alredy present
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`..."
      release2:
        profile-name: release
        test-cmd: duck -C foo build --profile=release
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: no need to run the gathering or the solver engine
            info: starting fetching 1 package
            info: fetched source code of 1 package, 0 were downloaded, 1 was alredy present
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`..."
      release3:
        profile-name: release
        test-cmd: duck --color=never -C foo build --profile release
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: no need to run the gathering or the solver engine
            info: starting fetching 1 package
            info: fetched source code of 1 package, 0 were downloaded, 1 was alredy present
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`..."
      custom-profile:
        test-cmd: duck -C foo build --profile my-profile
        profile-name: my-profile
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: no need to run the gathering or the solver engine
            info: starting fetching 1 package
            info: fetched source code of 1 package, 0 were downloaded, 1 was alredy present
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`..."
      overridden-builtin-profile:
        test-cmd: duck -C foo build --profile bench
        profile-name: bench
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: no need to run the gathering or the solver engine
            info: starting fetching 1 package
            info: fetched source code of 1 package, 0 were downloaded, 1 was alredy present
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`..."
      custom-profile-inherited:
        test-cmd: duck -C foo build --profile my-profile2
        profile-name: my-profile2
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: no need to run the gathering or the solver engine
            info: starting fetching 1 package
            info: fetched source code of 1 package, 0 were downloaded, 1 was alredy present
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`..."
      # @TODO: #3023 Reenable verbose itests
      verbose:
        test-cmd: duck -C foo build --verbose
        profile-name: dev
        Enabled: "false"
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 1\`"
      verbose-release:
        test-cmd: duck -C foo build --release --verbose
        profile-name: release
        Enabled: "false"
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 3 --no-incremental\`"
      verbose-release2:
        test-cmd: duck -C foo build --profile=release --verbose
        profile-name: release
        Enabled: "false"
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 3 --no-incremental\`"
      verbose-release3:
        test-cmd: duck -C foo build --profile release --verbose
        profile-name: release
        Enabled: "false"
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
            info: Running \`duckc compile_packages $(pwd)/foo/.duck_build/@{profile-name}/@{foo}/deps.json -a $(pwd)/foo/.duck_build/@{profile-name}/@{foo}/artifacts -O 3 --no-incremental\`"
