# Use `mock/duckc` instead of the shared `../duckc`: it writes the output files,
# which incremental builds need to find to reuse a unit.
before-cmd: export PATH="@{ConfigDir}/mock:$PATH"

# Builds `foo` which depends on `bar`.
# All tests build `foo` again, with different scenarios.
PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init bar
  @{duck-exe} -C foo add --local ../bar bar
  @{before-cmd}
  @{duck-exe} -C foo build

Tests:
  basic:
    Description: can decide to not recompile packages if not needed
    Cases:
      nothing-changes:
        test-cmd: duck -C foo build
        Output:
          String: |+
            info: loaded source codes of 2 packages, 0 were downloaded, 2 were already present
            info: successfully synchronized venv \`foo\`
            info: reusing previous build artifacts for \`bar\`
            info: reusing previous build artifacts for \`foo\`
      foo-changed:
        test-cmd: echo "\n" >> foo/src/src.dk && duck -C foo build
        Output:
          String: |+
            info: loaded source codes of 2 packages, 0 were downloaded, 2 were already present
            info: successfully synchronized venv \`foo\`
            info: reusing previous build artifacts for \`bar\`
            info: compiling \`foo\`...
      bar-changed:
        test-cmd: echo "\n" >> bar/src/src.dk && duck -C foo build
        Output:
          String: |+
            info: loaded source codes of 2 packages, 0 were downloaded, 2 were already present
            info: successfully synchronized venv \`foo\`
            info: compiling \`bar\`...
            info: compiling \`foo\`...
      layout-changed:
        test-cmd: duck -C foo build --shared-artifacts
        Output:
          String: |+
            info: loaded source codes of 2 packages, 0 were downloaded, 2 were already present
            info: successfully synchronized venv \`foo\`
            info: compiling \`bar\`...
            info: compiling \`foo\`...
      renames:
        test-cmd: |+
          mv foo/src/src.dk foo/src/rename.dk &&
          mv foo/src/rename.dk foo/src/src.dk &&
          duck -C foo build
        Output:
          String: |+
            info: loaded source codes of 2 packages, 0 were downloaded, 2 were already present
            info: successfully synchronized venv \`foo\`
            info: reusing previous build artifacts for \`bar\`
            info: compiling \`foo\`...
      duckc-version-changed:
        # Set mock duckc version to `2.0.0` (in Precase it is `1.0.0`).
        test-cmd: MOCK_DUCKC_VERSION=2.0.0 duck -C foo build
        Output:
          String: |+
            info: loaded source codes of 2 packages, 0 were downloaded, 2 were already present
            info: successfully synchronized venv \`foo\`
            info: compiling \`bar\`...
            info: compiling \`foo\`...
