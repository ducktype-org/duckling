PostCase: python3 check.py && @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init bar
  @{duck-exe} -C foo add --local ../bar bar
  echo "profiles:
    dvm:
      dvm-bytecode: true" >> foo/quackconfig.yaml
Tests:
  dvm-deps:
    Description: can build a project with dependencies
    Cases:
      build:
        test-cmd: duck -C foo build --profile=dvm
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: running gathering
            info: starting the solver engine
            info: starting loading 2 packages
            info: loaded source codes of 2 packages, 0 were downloaded, 2 were already present
            info: successfully synchronized venv \`foo\`
            info: compiling \`bar\`...
            info: compiling \`foo\`..."
