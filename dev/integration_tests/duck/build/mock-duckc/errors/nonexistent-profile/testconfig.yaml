PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
Tests:
  nonexistent-profile:
    Description: errors with a nonexistent profile
    Cases:
      nonexistent-profile:
        test-cmd: duck -C foo build --profile=nonexistent
        ExitCode: 1
        Err:
          String: |+
            error: unknown profile \`nonexistent\`

            hint: in order to use a profile you have to define it in the manifest first
