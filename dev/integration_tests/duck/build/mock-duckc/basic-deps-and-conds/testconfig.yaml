features: ""
PostCase: python3 check.py @{features} && @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init bar
  echo "dependencies:
    bar:
      source:
        path: ../bar
      conditions:
        package-features: [use-bar]

  features:
    use-bar: []" >> foo/quackconfig.yaml

Tests:
  basic-deps-and-conds:
    Description: can build a project with conditional dependencies
    Cases:
      without-bar:
        test-cmd: duck -C foo build
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: running gathering
            info: starting the solver engine
            info: starting fetching 2 packages
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`..."
      with-bar:
        test-cmd: duck -C foo build --features use-bar
        features: use-bar
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: running gathering
            info: starting the solver engine
            info: starting fetching 2 packages
            info: successfully synchronized venv \`foo\`
            info: compiling \`bar\`...
            info: compiling \`foo\`..."
