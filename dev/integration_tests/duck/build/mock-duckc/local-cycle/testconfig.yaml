PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init bar
  @{duck-exe} init baz
  echo "dependencies:
    bar:
      source:
        path: ../bar" >> foo/quackconfig.yaml
  echo "dependencies:
    baz:
      source:
        path: ../baz" >> bar/quackconfig.yaml

  echo "dependencies:
    foo:
      source:
        path: ../foo" >> baz/quackconfig.yaml
Tests:
  local-cycle:
    Description: can build a project with dependencies
    Cases:
      build:
        test-cmd: duck -C foo build
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`baz\`...
            info: compiling \`bar\`...
            info: compiling \`foo\`...
