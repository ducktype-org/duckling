PostCase: python3 check.py && @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init bar
  echo "dependencies:
    bar:
      source:
        path: ../bar

  profiles:
    dvm:
      dvm-bytecode: true" >> foo/quackconfig.yaml
Tests:
  duck/build/mock-duckc/deps-with-dvm:
    Description: can build a project with dependencies
    Cases:
      build:
        test-cmd: duck -C foo build --profile=dvm
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
