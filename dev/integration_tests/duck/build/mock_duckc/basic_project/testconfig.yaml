PostCase: python3 check.py

Tests:
  build:
    Description: can build a new project, and expands profiles
    Cases:
      build:
        test_cmd: -C foo build
        Output:
          String: 'info: successfully synchronized venv \`foo\`\n'
      build_release:
        test_cmd: -C foo build --release
        Output:
          String: 'info: successfully synchronized venv \`foo\`\n'
      build_release_profile:
        test_cmd: -C foo build --profile=release
        Output:
          String: 'info: successfully synchronized venv \`foo\`\n'
      build_release_profile2:
        test_cmd: -C foo build --profile release
        Output:
          String: 'info: successfully synchronized venv \`foo\`\n'
      build_verbose:
        test_cmd: -C foo build --verbose
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 1\`"
      build_release_verbose:
        test_cmd: -C foo build --release --verbose
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 3 --no-incremental\`"
      build_release_profile_verbose:
        test_cmd: -C foo build --profile=release --verbose
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 3 --no-incremental\`"
      build_release_profile2_verbose:
        test_cmd: -C foo build --profile release --verbose
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 3 --no-incremental\`"
      build_nonexistent_profile:
        test_cmd: -C foo build --profile=nonexistent
        ExitCode: 1
        Err:
          Run: |+
            echo "error: Unknown profile \`nonexistent\`

            hint: In order to use a profile you have to define it in the manifest first"
      build_custom_profile:
        test_cmd: -C foo build --profile my-profile --verbose
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O z --dvm-backend\`"
      build_overridden_builtin_profile:
        test_cmd: -C foo build --profile bench --verbose
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 2 --no-incremental\`"
      build_custom_profile_inherited:
        test_cmd: -C foo build --profile my-profile2 --verbose
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O s --dvm-backend\`"
