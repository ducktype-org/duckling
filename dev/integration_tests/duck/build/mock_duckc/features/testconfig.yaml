Tests:
  build:
    Description: can build a project with features
    Cases:
      build_with_feature:
        test_cmd: duck -C foo build --features foo
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      build_with_pulling_feature:
        test_cmd: duck -C foo build --features bar
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      build_with_nonexisting_feature:
        test_cmd: duck -C foo build --features aaa
        ExitCode: 1
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
        Err:
          String: |+
            error: while expanding features of the root package \`foo\`

              Caused by:
                there is no such feature as \`aaa\`
