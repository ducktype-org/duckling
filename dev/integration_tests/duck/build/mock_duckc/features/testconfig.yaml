Tests:
  build:
    Description: can build a project with features
    Cases:
      build_with_feature:
        test_cmd: -C foo build --verbose --features foo
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 1\`"
      build_with_pulling_feature:
        test_cmd: -C foo build --verbose --features bar
        Output:
          Run: |+
            echo "info: successfully synchronized venv \`foo\`
            info: Running \`duckc compile_package -n foo $(pwd)/foo/src -a $(pwd)/foo/.duck_build -O 1\`"
      build_with_nonexisting_feature:
        test_cmd: -C foo build --verbose --features aaa
        ExitCode: 1
        Output:
          String: 'info: successfully synchronized venv \`foo\`\n'
        Err:
          String: |+
            error: while expanding features of the root package \`foo\`

              Caused by:
                there is no such feature as \`aaa\`
