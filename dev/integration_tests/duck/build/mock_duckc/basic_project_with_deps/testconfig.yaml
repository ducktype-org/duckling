PostCase: python3 check.py && @{cleanup_tmp_env}

PreCase: |+
  cd $DIT_TMP_DIR
  @{duck_exe} init foo
  @{duck_exe} init bar
  echo "dependencies:
    bar:
      source:
        path: ../bar" >> foo/quackconfig.yaml
Tests:
  duck/build/mock-duckc/basic-project-with-deps:
    Description: can build a project with dependencies
    Cases:
      build:
        test_cmd: duck -C foo build
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`bar\`...
            info: compiling \`foo\`...
