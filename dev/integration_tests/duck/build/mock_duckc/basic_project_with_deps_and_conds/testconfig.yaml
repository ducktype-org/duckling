features: ""
PostCase: python3 check.py @{features} && @{cleanup_tmp_env}

PreCase: |+
  cd $DIT_TMP_DIR
  @{duck-exe} init foo
  @{duck-exe} init bar
  echo "dependencies:
    bar:
      source:
        path: ../bar
      conditions:
        package-features: [use-bar]

  features:
    use-bar: []" >> foo/quackconfig.yaml

Tests:
  duck/build/mock-duckc/basic-project-with-deps-and-conds:
    Description: can build a project with conditional dependencies
    Cases:
      without-bar:
        test-cmd: duck -C foo build
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      with-bar:
        test-cmd: duck -C foo build --features use-bar
        features: use-bar
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`bar\`...
            info: compiling \`foo\`...
