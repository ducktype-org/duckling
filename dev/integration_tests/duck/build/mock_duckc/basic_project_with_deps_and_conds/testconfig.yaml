features: ""
PostCase: python3 check.py @{features}

Tests:
  build:
    Description: can build a project with conditional dependencies
    Cases:
      build_without_bar:
        test_cmd: duck -C foo build
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
      build_with_bar:
        test_cmd: duck -C foo build --features use-bar
        features: use-bar
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
            info: compiling \`foo\`...
