PreCase: |+
  cd $DIT_TMP_DIR
  @{duck_exe} init foo
  @{duck_exe} init bar
  @{duck_exe} init baz
  echo "dependencies:
    bar:
      source:
        path: ../bar" >> foo/quackconfig.yaml
  echo "dependencies:
    baz:
      source:
        path: ../baz" >> bar/quackconfig.yaml

  echo "dependencies:
    foo:
      source:
        path: ../foo" >> baz/quackconfig.yaml
Tests:
  duck/build/mock-duckc/with-a-local-cycle:
    Description: can build a project with dependencies
    Cases:
      build:
        test_cmd: duck -C foo build
