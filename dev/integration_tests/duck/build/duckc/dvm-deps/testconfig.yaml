PostCase: python3 check.py && @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init bar
  @{duck-exe} -C foo add --local ../bar bar
  cp @{ConfigDir}/bar.dk bar/src/src.dk
  cp @{ConfigDir}/foo.dk foo/src/src.dk
  echo "profiles:
    dvm:
      dvm-bytecode: true" >> foo/quackconfig.yaml
Tests:
  dvm-deps:
    Description: can build and run a project with dependencies
    Cases:
      build:
        test-cmd: duck -C foo build --profile=dvm
      # A function and a constant from a dependency resolve at DVM load time
      run:
        test-cmd: duck -C foo run --profile=dvm
