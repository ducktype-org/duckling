PostCase: python3 check.py && @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init bar
  @{duck-exe} -C foo add --local ../bar bar

Tests:
  basic-deps:
    Description: can build a project with dependencies
    Cases:
      build:
        test-cmd: duck -C foo build
