features: ""
PostCase: python3 check.py @{features} && @{cleanup_tmp_env}

PreCase: |+
  cd $DIT_TMP_DIR
  @{duck_exe} init foo
  @{duck_exe} init bar
  echo "dependencies:
    bar:
      source:
        path: ../bar
      conditions:
        package-features: [use-bar]

  features:
    use-bar: []" >> foo/quackconfig.yaml

Tests:
  build:
    Description: can build a project with conditional dependencies
    Cases:
      build_without_bar:
        test_cmd: duck -C foo build
      build_with_bar:
        test_cmd: duck -C foo build --features use-bar
        features: use-bar
