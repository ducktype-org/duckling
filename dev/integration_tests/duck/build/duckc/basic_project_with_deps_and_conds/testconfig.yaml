tmp_env_files: "foo bar"
features: ""
PostCase: python3 check.py @{features} && @{cleanup_tmp_env}

Tests:
  build:
    Description: can build a project with conditional dependencies
    Cases:
      build_without_bar:
        test_cmd: duck -C foo build
      build_with_bar:
        test_cmd: duck -C foo build --features use-bar
        features: use-bar
