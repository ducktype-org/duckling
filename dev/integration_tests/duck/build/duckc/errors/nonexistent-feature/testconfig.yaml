PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
Tests:
  nonexistent-feature:
    Description: errors with a nonexistent feature
    Cases:
      nonexisting-feature:
        test-cmd: duck -C foo build --features aaa
        ExitCode: 1
        Output:
          Run: |+
            echo "info: starting synchronization of the package at \`$DIT_TMP_DIR/foo\`
            info: starting solving the dependency graph
            info: starting gathering the dependency graph
            info: no need to run the gathering or the solver engine
            info: starting fetching 1 package
            info: fetched source codes of 1 package, 0 were downloaded, 1 was already present
            info: successfully synchronized venv \`foo\`"
        Err:
          String: |+
            error: while expanding features of the root package \`foo\`

              Caused by:
                there is no such feature as \`aaa\`
