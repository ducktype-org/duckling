PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  echo "  links: sqlite" >> foo/quackconfig.yaml
  echo "profiles:
    dvm:
      dvm-bytecode: true" >> foo/quackconfig.yaml
Tests:
  external-libs-dvm:
    Description: errors when a package has an external library specified on the DVM
    Cases:
      external-libs-dvm:
        test-cmd: duck -C foo build --profile dvm
        ExitCode: 1
        Output:
          String: |+
            info: loaded source code of 1 package, 0 were downloaded, 1 was already present
            info: successfully synchronized venv \`foo\`
        Err:
          String: |+
            error: package foo version 1.0.0 links against \`sqlite\`, which is not supported on the DVM
