profile_name: ""
run_post_case: "true"
PostCase: |+
  if [ @{run_post_case} == "true" ]; then
    python3 check.py @{profile_name}
  fi
  @{cleanup_tmp_env}

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  echo "profiles:
    my-profile:
      opt-level: z
      dvm-bytecode: true
    bench:
      opt-level: 2
    my-profile2:
      inherits: my-profile
      opt-level: s" >> foo/quackconfig.yaml

Tests:
  duck/build/duckc/basic-project:
    Description: can build a new project, and expands profiles
    Cases:
      dev:
        test-cmd: duck -C foo build
        profile_name: dev
      release:
        test-cmd: duck -C foo build --release
        profile_name: release
      release2:
        profile_name: release
        test-cmd: duck -C foo build --profile=release
      relase3:
        profile_name: release
        test-cmd: duck --color=never -C foo build --profile release
      nonexistent-profile:
        test-cmd: duck -C foo build --profile=nonexistent
        run_post_case: "false"
        ExitCode: 1
        Err:
          String: |+
            error: Unknown profile \`nonexistent\`

            hint: In order to use a profile you have to define it in the manifest first
      custom-profile:
        test-cmd: duck -C foo build --profile my-profile
        profile_name: my-profile
      overridden-builtin-profile:
        test-cmd: duck -C foo build --profile bench
        profile_name: bench
      custom-profile-inherited:
        test-cmd: duck -C foo build --profile my-profile2
        profile_name: my-profile2
      # NOTE: verbose tests are disabled, since compilation order is not deterministic
      verbose:
        test-cmd: duck -C foo build --verbose
        profile_name: dev
        Enabled: "false"
      verbose-release:
        test-cmd: duck -C foo build --release --verbose
        profile_name: release
        Enabled: "false"
      verbose-release2:
        test-cmd: duck -C foo build --profile=release --verbose
        profile_name: release
        Enabled: "false"
      verbose-release3:
        test-cmd: duck -C foo build --profile release --verbose
        profile_name: release
        Enabled: "false"
