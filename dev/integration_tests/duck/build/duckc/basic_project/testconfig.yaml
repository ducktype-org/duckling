tmp_env_files: "foo"
profile_name: ""
run_post_case: "true"
PostCase: |+
  if [ @{run_post_case} == "true" ]; then
    python3 check.py @{profile_name}
  fi
  @{cleanup_tmp_env}

Tests:
  build:
    Description: can build a new project, and expands profiles
    Cases:
      build:
        test_cmd: duck -C foo build
        profile_name: dev
      build_release:
        test_cmd: duck -C foo build --release
        profile_name: release
      build_release_profile:
        profile_name: release
        test_cmd: duck -C foo build --profile=release
      build_release_profile2:
        profile_name: release
        test_cmd: duck --color=never -C foo build --profile release
      build_nonexistent_profile:
        test_cmd: duck -C foo build --profile=nonexistent
        run_post_case: "false"
        ExitCode: 1
        Err:
          String: |+
            error: Unknown profile \`nonexistent\`

            hint: In order to use a profile you have to define it in the manifest first
      build_custom_profile:
        test_cmd: duck -C foo build --profile my-profile
        profile_name: my-profile
      build_overridden_builtin_profile:
        test_cmd: duck -C foo build --profile bench
        profile_name: bench
      build_custom_profile_inherited:
        test_cmd: duck -C foo build --profile my-profile2
        profile_name: my-profile2
      # NOTE: verbose tests are disabled, since compilation order is not deterministic
      build_verbose:
        test_cmd: duck -C foo build --verbose
        profile_name: dev
        Enabled: "false"
      build_release_verbose:
        test_cmd: duck -C foo build --release --verbose
        profile_name: release
        Enabled: "false"
      build_release_profile_verbose:
        test_cmd: duck -C foo build --profile=release --verbose
        profile_name: release
        Enabled: "false"
      build_release_profile2_verbose:
        test_cmd: duck -C foo build --profile release --verbose
        profile_name: release
        Enabled: "false"
