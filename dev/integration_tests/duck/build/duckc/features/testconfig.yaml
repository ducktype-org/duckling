features: ""
run_post_case: "true"
PostCase: |+
  if [ @{run_post_case} == "true" ]; then
    python3 check.py @{features}
  fi
  @{cleanup_tmp_env}
PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  echo "features:
    foo: []
    bar: [foo]" >> foo/quackconfig.yaml
Tests:
  duck/build/duckc/features:
    Description: can build a project with features
    Cases:
      basic:
        test-cmd: duck -C foo build --features foo
        features: "foo"
      pulling-feature:
        test-cmd: duck -C foo build --features bar
        features: bar foo
      nonexisting-feature:
        test-cmd: duck -C foo build --features aaa
        run_post_case: "false"
        ExitCode: 1
        Output:
          String: |+
            info: successfully synchronized venv \`foo\`
        Err:
          String: |+
            error: while expanding features of the root package \`foo\`

              Caused by:
                there is no such feature as \`aaa\`
