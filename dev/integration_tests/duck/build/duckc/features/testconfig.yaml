features: ""
PostCase: python3 check.py @{features} && @{cleanup_tmp_env}
PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  echo "features:
    foo: []
    bar: [foo]" >> foo/quackconfig.yaml
Tests:
  features:
    Description: can build a project with features
    Cases:
      basic:
        test-cmd: duck -C foo build --features foo
        Err:
          String: ""
        Output:
          String: ""
        features: "foo"
      pulling-feature:
        test-cmd: duck -C foo build --features bar
        Err:
          String: ""
        Output:
          String: ""
        features: bar foo
