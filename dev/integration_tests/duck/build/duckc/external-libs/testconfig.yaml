# `answer` is not installed anywhere: duck only finds it through `external-lib-paths`. Both kinds
# are there, with different answers, so the exit code shows which one was linked.
PostCase: "@{cleanup_tmp_env}"

PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  mkdir -p foo/libs
  echo 'int duck_answer(void) { return 42; }' > static.c
  cc -c static.c -o static.o && ar rcs foo/libs/libanswer.a static.o
  echo 'int duck_answer(void) { return 43; }' > shared.c
  if [ "$(uname)" = Darwin ]; then
    cc -shared -fPIC shared.c -o foo/libs/libanswer.dylib -Wl,-install_name,@rpath/libanswer.dylib
  else
    cc -shared -fPIC shared.c -o foo/libs/libanswer.so -Wl,-soname,libanswer.so
  fi
  cat <<'DK' > foo/src/src.dk
  import core.builtins.*;

  extern("C") {
      fundecl duck_answer() -> i32;
  }

  fun main() = {
      return duck_answer();
  }
  DK
  echo "  external-lib-paths: [libs]" >> foo/quackconfig.yaml

add-libs: 'echo "  external-libs: [@{libs}]" >> foo/quackconfig.yaml'

Tests:
  external-libs:
    Description: links an external library found in `external-lib-paths`, as the kind the package asks for
    Cases:
      dynamic-by-default:
        libs: answer
        test-cmd: '@{add-libs} && duck -C foo run'
        ExitCode: 43
      explicit-dynamic:
        libs: '{ name: answer, kind: dynamic }'
        test-cmd: '@{add-libs} && duck -C foo run'
        ExitCode: 43
      static:
        libs: '{ name: answer, kind: static }'
        test-cmd: '@{add-libs} && duck -C foo run'
        ExitCode: 42
