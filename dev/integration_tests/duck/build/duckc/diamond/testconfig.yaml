#    root
#   /   \
#  foo bar
#   \ /
#   baz
PreCase: |+
  cd $DIT_TMP_DIR
  mkdir -p root/src foo/src bar/src baz/src
  echo @{default-src} | tee root/src/src.dk | tee foo/src/src.dk | tee bar/src/src.dk | tee baz/src/src.dk

  echo "metadata:
    name: root
    version: 1.0.0

  dependencies:
    foo:
      source:
        path: ../foo
    bar:
      source:
        path: ../bar" > root/quackconfig.yaml

  echo "metadata:
    name: foo
    version: 1.0.0

  dependencies:
    baz:
      source:
        path: ../baz" > foo/quackconfig.yaml

  echo "metadata:
    name: bar
    version: 1.0.0

  dependencies:
    baz:
      source:
        path: ../baz" > bar/quackconfig.yaml

  echo "metadata:
    name: baz
    version: 1.0.0" > baz/quackconfig.yaml
PostCase: python3 check.py && @{cleanup_tmp_env}
Tests:
  diamond:
    Description: can build a project with dependencies
    Cases:
      build:
        test-cmd: duck -C root build
