# `duck translate-c`: a package generated from C headers builds and runs on both backends, is
# regenerated byte for byte from its recipe, and bad input is reported.
#
# The fixture header (`src/tools/c_import/tests/headers/sdl_like.h`) mimics the shapes of SDL3 a
# binding has to get right: a union event, anonymous members, bitfields, a packed record, opaque
# handles and numeric macros. Its C implementation is built per case, outside the packages.

# `duck_c_import` is only built when libclang was found at configure time.
Enabled: '[ -x "@{duckc_dir}/duck_c_import" ]'

TimeOut: 90
timeout_default: 90

fixture-dir: "@{dev_dir}/src/tools/c_import/tests/headers"
c-compiler: "$(command -v clang-19 || command -v clang || command -v cc)"
tool-path: 'export PATH="@{duckc_dir}:$PATH"'
before-cmd: "@{tool-path}"

PreCase: |+
  @{cd-tmp-dir}
  mkdir -p build_c
  @{c-compiler} -O2 -c -o build_c/sl.o @{fixture-dir}/sdl_like.c
  @{c-compiler} -O2 -shared -fPIC -o build_c/libsl.so @{fixture-dir}/sdl_like.c

translate: >-
  duck translate-c new sl --header @{fixture-dir}/sdl_like.h --include 'SL_*'
  --library build_c/sl.o --library build_c/libsl.so
make-app: >-
  duck init app > /dev/null
  && duck -C app add --local ../sl sl > /dev/null
  && printf 'profiles:\n  dvm:\n    dvm-bytecode: true\n' >> app/quackconfig.yaml
  && cp @{ConfigDir}/app.dk app/src/src.dk

Tests:
  fixture:
    Description: the generated fixture package works on both backends
    Cases:
      # Generation builds the package and checks every layout on both backends
      verify:
        test-cmd: "@{translate}"
      native:
        before-cmd: "@{tool-path} && @{translate} --no-verify && @{make-app}"
        test-cmd: duck -C app run
      dvm:
        before-cmd: "@{tool-path} && @{translate} --no-verify && @{make-app}"
        test-cmd: duck -C app run --profile=dvm

  output:
    Description: the generated bindings are exactly the expected ones
    Cases:
      # Covers reading (layouts, anonymous members, bitfields, macros, enums, scoping), lowering
      # and emitting at once; review a diff here like any other generated-code change.
      fixture-bindings:
        test-cmd: >-
          @{translate} --no-verify
          && diff @{ConfigDir}/expected_bindings.txt sl/src/generated/sl.dk

  system-library:
    Description: a system header and library, found by bare names, work on both backends
    # glibc declares most of math.h in bits/, and libm.so is a linker script naming libm.so.6.
    Enabled: '[ -x "@{duckc_dir}/duck_c_import" ] && [ "$(uname)" = Linux ]'
    Cases:
      libm:
        before-cmd: >-
          @{tool-path}
          && duck translate-c new m --header math.h --include sqrt --include cbrt --library -lm
          && grep -q '^  - libm.so.6$' m/quackconfig.yaml
          && duck init app > /dev/null
          && duck -C app add --local ../m m > /dev/null
          && printf 'profiles:\n  dvm:\n    dvm-bytecode: true\n' >> app/quackconfig.yaml
          && cp @{ConfigDir}/libm.dk app/src/src.dk
        test-cmd: duck -C app run && duck -C app run --profile=dvm

  zlib:
    Description: zlib, a bare-name header with a pkg-config package, compresses and decompresses on both backends
    Enabled: '[ -x "@{duckc_dir}/duck_c_import" ] && pkg-config --exists zlib'
    Cases:
      round-trip:
        before-cmd: >-
          @{tool-path}
          && duck translate-c new zlib --pkg-config zlib --header zlib.h
          && duck init app > /dev/null
          && duck -C app add --local ../zlib zlib > /dev/null
          && printf 'profiles:\n  dvm:\n    dvm-bytecode: true\n' >> app/quackconfig.yaml
          && cp @{ConfigDir}/zlib.dk app/src/src.dk
        test-cmd: duck -C app run && duck -C app run --profile=dvm

  regen:
    Description: a package is regenerated from its recipe alone
    Cases:
      # Regenerating produces byte-identical files
      deterministic:
        before-cmd: "@{tool-path} && @{translate} --no-verify && cp -r sl sl_before"
        test-cmd: duck translate-c regen sl --no-verify && diff -r sl_before sl
      # Regenerating leaves the user-owned `src.dk` alone
      keeps-root-module:
        before-cmd: "@{tool-path} && @{translate} --no-verify && echo '# my helpers' >> sl/src/src.dk"
        test-cmd: duck translate-c regen sl --no-verify && grep -q '# my helpers' sl/src/src.dk
      # The recipe holds absolute paths, so regen works from anywhere
      from-another-directory:
        before-cmd: "@{tool-path} && @{translate} --no-verify && mkdir elsewhere"
        test-cmd: cd elsewhere && duck translate-c regen ../sl --no-verify

  errors:
    Description: bad input is reported and writes nothing
    Cases:
      headers-do-not-compile:
        test-cmd: >-
          ! duck translate-c new bad --header @{ConfigDir}/broken.h 2> err
          && grep -q 'the headers do not compile' err && [ ! -e bad/src ]
      already-exists:
        before-cmd: "@{tool-path} && @{translate} --no-verify"
        test-cmd: "! @{translate} 2> err && grep -q 'already exists' err"
      name-is-not-an-identifier:
        test-cmd: >-
          ! duck translate-c new sl --name my-lib --header @{fixture-dir}/sdl_like.h 2> err
          && grep -q 'valid Duckling identifier' err
      regen-without-recipe:
        before-cmd: "@{tool-path} && duck init plain > /dev/null"
        test-cmd: "! duck translate-c regen plain 2> err && grep -q 'c-bindings' err"

  sdl3:
    Description: SDL3 bindings drive a window, an event loop and drawing on both backends
    Enabled: '[ -x "@{duckc_dir}/duck_c_import" ] && pkg-config --exists sdl3'
    TimeOut: 300
    NeededThreads: 2
    Cases:
      # The example script's headless check passes on the native backend and the DVM
      headless-demo:
        test-cmd: >-
          DUCK="$(command -v duck)" SDL_VIDEODRIVER=offscreen
          @{dev_dir}/src/tools/c_import/examples/sdl3_demo.sh @{duckc_dir} --work "$DIT_TMP_DIR/sdl3"
