PostCase: python3 check.py && @{cleanup_tmp_env}
PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} -C foo sync
  sleep 2
  @{duck-exe} -C foo info
  sleep 2

Tests:
  verify-timestamps:
    Description: last_access and last_modification are set properly
    Cases:
      verify-timestamps:
        # @TODO: #3189 Reenable this test
        Enabled: "false"
        test-cmd: "duck -C foo info > duck-info-output.txt"
