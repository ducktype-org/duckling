PreCase: |+
  @{cd-tmp-dir}
  @{duck-exe} init foo
  @{duck-exe} init a
  @{duck-exe} init b
  @{duck-exe} -C foo add --local ../a a
  @{duck-exe} -C foo add --dev --local ../b b

PostCase: python3 check.py @{expected-manifest} && @{cleanup_tmp_env}

Tests:
  basic:
    Description: properly removes dependencies from manifest
    Cases:
      dependency:
        expected-manifest: only-b
        test-cmd: duck -C foo remove a
        Err:
          Run: |+
            echo "info: written new manifest to \`$DIT_TMP_DIR/foo/quackconfig.yaml\`
            info: successfully removed dependency \`a\` from the project \`foo\` at \`$DIT_TMP_DIR/foo\`"
      dev-dependency-no-flag-error:
        expected-manifest: all
        test-cmd: duck -C foo remove b
        ExitCode: 1
        Err:
          Run: |+
            echo "error: there is no dependency \`b\` in the project \`foo\` at \`$DIT_TMP_DIR/foo\`

            hint: if you want to remove a dev dependency use flag \`--dev\`"
      dev-dependency-flag:
        expected-manifest: only-a
        test-cmd: duck -C foo remove b --dev
        Err:
          Run: |+
            echo "info: written new manifest to \`$DIT_TMP_DIR/foo/quackconfig.yaml\`
            info: successfully removed dev dependency \`b\` from the project \`foo\` at \`$DIT_TMP_DIR/foo\`"
      no-dependency-error:
        expected-manifest: all
        test-cmd: duck -C foo remove c
        ExitCode: 1
        Err:
          Run: |+
            echo "error: there is no dependency \`c\` in the project \`foo\` at \`$DIT_TMP_DIR/foo\`"
