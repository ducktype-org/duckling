# Aliases tests for Duckling REPL

# @TODO: #2569 Enable the tests after making usage of aliases in REPL possible.

Tests:
  basic_declarations:
    Cases:
      basic_declarations:
        Input:
          File: "basic_declarations/basic_declarations.rtf"
        Output:
          String: "@{beginning}\n@{instruction_prompt}=> 42\n@{end}"
    
  possible_conflicts:
    Enabled: "false"
    Cases:
      variable_conflict:
        Input:
          File: "possible_conflicts/variable_conflict.rtf"
        Output:
          String: "@{beginning}\n42\n@{end}"
      function_conflict:
        Input:
          File: "possible_conflicts/function_conflict.rtf"
        Output:
          String: "@{beginning}\n=> 42\n=> 100\n@{end}"