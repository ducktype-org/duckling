Run: "@{build_dir}/bin//duckc repl"

prompt: "duckling> "
beginning: |
  Duckling REPL
  Type /help for available commands, /exit to quit.
  Press Enter for new line, Alt+Enter to submit.

end: "\nGoodbye!\n"
instruction_prompt: "Instruction executed.\n"

SubDirs:
  - fundamentals
  - intermediate_statements
  - declarations
  - variable_assignment
