# Simplest tests for scripts in Duckling.

Tests:
  simple_addition:
    folder: "simple_addition"
    Cases:
      direct:
        mode: direct
        Output: 
          String: "42\n"
      vm:
        mode: vm
        Output: 
          String: "42\n"
      exe:
        mode: exe
        Output: 
          String: "42\n"
      exe_o1:
        mode: exe
        opt_level: 1
        Output:
          String: "42\n"
      exe_oz:
        mode: exe
        opt_level: z
        Output:
          String: "42\n"

  function_declaration:
    folder: "function_declaration"
    Cases:
      direct:
        mode: direct
        Output: 
          String: "42\n"
      vm:
        mode: vm
        Output: 
          String: "42\n"
      exe:
        mode: exe
        Output: 
          String: "42\n"

  simple_loop:
    folder: "simple_loop"
    Cases:
      direct:
        mode: direct
        Output:
          String: "6\n5\n4\n3\n2\n1\n"
      vm:
        mode: vm
        Output:
          String: "6\n5\n4\n3\n2\n1\n"
      exe:
        mode: exe
        Output:
          String: "6\n5\n4\n3\n2\n1\n"

  init_exec_order:
    folder: "init_exec_order"
    Cases:
      direct:
        mode: direct
        Output:
          String: "2\n1\n3\n"
      vm:
        mode: vm
        Output:
          String: "2\n1\n3\n"
      exe:
        mode: exe
        Output:
          String: "2\n1\n3\n"

  const_if:
    folder: "const_if"
    Cases:
      direct:
        mode: direct
        Output:
          String: "1\n2\n"
      vm:
        mode: vm
        Output:
          String: "1\n2\n"
      exe:
        mode: exe
        Output:
          String: "1\n2\n"

  # `duckc run` names the functions of a panic's stack trace as in the Duck source, both the
  # script's own (`readPastEnd`, `forward`) and the standard library's (`panic`), instead of
  # their mangled names. `(?s)` lets `.` cross the line breaks.
  panic_stack_trace:
    folder: "panic_stack_trace"
    Cases:
      direct:
        mode: direct
        Run: "@{expect_output} --expect-exit 1 --err-regex \"(?s)VMThread has panicked: Program panicked.*DVM stack trace [(]most recent call first[)]:.*#1 panic at .*#2 readPastEnd\n.*#3 forward\n\" -- @{duckc_path} run @{folder}/@{Name}.dks --custom-std-artifacts-path @{case_std_artifacts}"
        Output:
          String: "Program panicked!\n"
