# Simplest tests for scripts in Duckling.

Tests:
  simple_addition:
    folder: "simple_addition"
    Cases:
      direct:
        mode: direct
        Output: 
          String: "42\n"
      vm:
        mode: vm
        Output: 
          String: "42\n"
      exe:
        mode: exe
        Output: 
          String: "42\n"
      exe_o1:
        mode: exe
        opt_level: 1
        Output:
          String: "42\n"
      exe_oz:
        mode: exe
        opt_level: z
        Output:
          String: "42\n"

  function_declaration:
    folder: "function_declaration"
    Cases:
      direct:
        mode: direct
        Output: 
          String: "42\n"
      vm:
        mode: vm
        Output: 
          String: "42\n"
      exe:
        mode: exe
        Output: 
          String: "42\n"

  simple_loop:
    folder: "simple_loop"
    Cases:
      direct:
        mode: direct
        Output:
          String: "6\n5\n4\n3\n2\n1\n"
      vm:
        mode: vm
        Output:
          String: "6\n5\n4\n3\n2\n1\n"
      exe:
        mode: exe
        Output:
          String: "6\n5\n4\n3\n2\n1\n"

  # Issue #2924: top-level `var` initializers run in source order, not eagerly before
  # the surrounding statements. `second()` (prints 2) precedes `var b = first()` (prints 1).
  init_exec_order:
    folder: "init_exec_order"
    Cases:
      direct:
        mode: direct
        Output:
          String: "2\n1\n"
      vm:
        mode: vm
        Output:
          String: "2\n1\n"
      exe:
        mode: exe
        Output:
          String: "2\n1\n"
