# The toolchain is built by the root PreNode; do not inherit it here.
PreNode: ""

# Integration tests for scripts in Duckling.

# As described in PR #2352, scripts can be run in three ways: directly with duckc, compiled to DVM bytecode and executed on the DVM (vm mode) or compiled
# to native executable and run directly (exe mode). The tests in this folder are meant to be run in all those modes. Bytecode files are stored in dedicated 
# duck_build folders, created separately for each test. The tests are run in direct mode by default, but one can switch to VM or exe mode by setting
# the "mode" variable to "vm" or "exe". Variable "folder" make executing tests in different folders simply more convenient.
mode: "direct"
opt_level: "0"
folder: "."

# Compiled modes place their artifacts in a per-case tmp directory,
# so cases can run concurrently; direct mode compiles in memory.
Env:
    DIT_TMP_DIR: "@{new_tmp_dir}"

case_duck_build: "$DIT_TMP_DIR/duck_build"
# Private copy of the shared warm std artifacts (see the root testconfig).
# duckc rewrites the artifacts directory on exit (#3169), so concurrent cases
# must not point at the shared one.
case_std_artifacts: "$DIT_TMP_DIR/std_artifacts"

PreCase: "
  cp -r @{std_artifacts_dir} @{case_std_artifacts} 2>/dev/null || true;
  if [ '@{mode}' = 'vm' ]; then
    cd @{folder} && @{duckc_path} compile_script @{Name}.dks --dvm-backend -a @{case_duck_build} --custom-std-artifacts-path @{case_std_artifacts};
  elif [ '@{mode}' = 'exe' ]; then
    cd @{folder} && @{duckc_path} compile_script @{Name}.dks -O @{opt_level} -a @{case_duck_build} --custom-std-artifacts-path @{case_std_artifacts};
  fi"

Run: "
  if [ '@{mode}' = 'vm' ]; then
    @{dvm_path} run @{case_duck_build}/@{Name}.dbc;
  elif [ '@{mode}' = 'exe' ]; then
    @{case_duck_build}/@{Name}.exe;
  else
    @{duckc_path} run @{folder}/@{Name}.dks --custom-std-artifacts-path @{case_std_artifacts};
  fi"

PostCase: "@{cleanup_tmp_env}"

SubDirs:
  - basic_tests
  - declarations
  - standard_library
  - lists_and_arrays
