# `duckbind`: a package generated from C headers builds and runs with duck, can be published, is
# regenerated byte for byte from its recipe, and bad input is reported.
#
# The fixture header (`sdl_like.h`, implemented in `sdl_like.c`) mimics the shapes of SDL3 a
# binding has to get right: a union event, anonymous members, bitfields, a packed record, opaque
# handles, numeric macros and doc comments. Each case vendors it, with its C implementation built
# into `libs/libsl.a`, inside the package, the way a published package would.
#
# @TODO: #4144 run the packages on the DVM too, once it loads `external-libs`.

TimeOut: 90
timeout_default: 90

load-cargo: . ${CARGO_HOME:-$HOME/.cargo}/env
duck-exe-dir: "@{dev_dir}/src/duck/target/debug"
PreNode: |
  cmake --build @{build_dir} -j -- duckbind
  @{load-cargo}
  cd @{dev_dir}/src/duck && cargo --locked build && cd -

# Every case gets a private DUCK_HOME under its tmp dir, so cases can run concurrently.
Env:
  DIT_TMP_DIR: "@{new_tmp_dir}"
  DUCK_HOME: "echo $DIT_TMP_DIR/duck_home"
PostCase: "@{cleanup_tmp_env}"

c-compiler: "$(command -v clang-19 || command -v clang || command -v cc)"
tool-path: 'export PATH="@{duckc_dir}:@{duck-exe-dir}:$PATH"'
before-cmd: "true"
Run: '@{tool-path} && cd ${DIT_TMP_DIR} && @{before-cmd} && @{test-cmd}'

PreCase: |+
  cd ${DIT_TMP_DIR}
  mkdir -p sl/include sl/libs
  cp @{ConfigDir}/sdl_like.h sl/include/
  @{c-compiler} -O2 -c -o sdl_like.o @{ConfigDir}/sdl_like.c
  ar rcs sl/libs/libsl.a sdl_like.o

generate: >-
  duckbind new sl --header sl/include/sdl_like.h --include 'SL_*,match' --library sl/libs/libsl.a
make-app: >-
  duck init app > /dev/null
  && duck -C app add --local ../sl sl > /dev/null
  && cp @{ConfigDir}/app.dk app/src/src.dk

Tests:
  fixture:
    Description: the generated fixture package builds, links and works
    Cases:
      # Generation builds the package and checks every layout against clang's
      verify:
        test-cmd: "@{generate}"
      native:
        before-cmd: "@{generate} --no-verify && @{make-app}"
        test-cmd: duck -C app run

  output:
    Description: the generated bindings are exactly the expected ones
    Cases:
      # Covers reading (layouts, anonymous members, bitfields, macros, enums, scoping, doc
      # comments), lowering and emitting at once; review a diff here like any other
      # generated-code change.
      fixture-bindings:
        test-cmd: >-
          @{generate} --no-verify
          && sed '/^# Target: /d' sl/src/generated/sl.dk | diff @{ConfigDir}/expected_bindings.txt -
      # Only the binding modules, as a build script would ask for them
      bindings-only:
        before-cmd: "@{generate} --no-verify"
        test-cmd: >-
          duckbind bindings sl/duckbind.yaml --out out
          && diff out/sl.dk sl/src/generated/sl.dk
          && diff out/generated.dk sl/src/generated/generated.dk
          && [ "$(ls out | wc -l)" -eq 2 ]

  portable:
    Description: a generated package holds nothing specific to the machine it was made on
    Cases:
      # The recipe and the manifest use paths relative to the package and bare library names
      relative-paths:
        before-cmd: "@{generate} --no-verify"
        test-cmd: >-
          grep -qF '"include/sdl_like.h"' sl/duckbind.yaml
          && grep -qF '"libs/libsl.a"' sl/duckbind.yaml
          && grep -qx '  external-libs: \[sl\]' sl/quackconfig.yaml
          && grep -qx '  external-lib-paths: \[libs\]' sl/quackconfig.yaml
          && ! grep -rqF "$DIT_TMP_DIR" sl
          && [ ! -e sl/src/generated/layout_check.dk ]
      # Published through git and used from another directory
      through-git:
        before-cmd: >-
          @{generate} --no-verify
          && git -C sl init -q && git -C sl add -A
          && git -C sl -c user.name=duck -c user.email=duck@example.com commit -qm bindings
          && mkdir consumer && cd consumer
          && duck init app > /dev/null
          && duck -C app add --git "file://$DIT_TMP_DIR/sl" sl > /dev/null
          && cp @{ConfigDir}/app.dk app/src/src.dk
        test-cmd: duck -C app run

  system-library:
    Description: a system header and library, found by bare names, work
    # glibc declares most of math.h in bits/
    Enabled: '[ "$(uname)" = Linux ]'
    Cases:
      # @TODO: #4140 duck links `libm.a` before `libm.so`, and glibc's static libm does not link
      # into a dynamic binary (`undefined reference to __frexp`).
      libm:
        Enabled: "false"
        before-cmd: >-
          duckbind new m --header math.h --include sqrt,cbrt --library=-lm
          && grep -qx '  external-libs: \[m\]' m/quackconfig.yaml
          && duck init app > /dev/null
          && duck -C app add --local ../m m > /dev/null
          && cp @{ConfigDir}/libm.dk app/src/src.dk
        test-cmd: duck -C app run

  zlib:
    Description: zlib, a bare-name header with a pkg-config package, compresses and decompresses
    Enabled: pkg-config --exists zlib
    Cases:
      round-trip:
        before-cmd: >-
          duckbind new zlib --pkg-config zlib --header zlib.h
          && duck init app > /dev/null
          && duck -C app add --local ../zlib zlib > /dev/null
          && cp @{dev_dir}/src/tools/c_import/examples/sweep/smoke/zlib.dk app/src/src.dk
        test-cmd: duck -C app run

  regen:
    Description: a package is regenerated from its recipe alone
    Cases:
      # Regenerating produces byte-identical files
      deterministic:
        before-cmd: "@{generate} --no-verify && cp -r sl sl_before"
        test-cmd: duckbind regen sl --no-verify && diff -r sl_before sl
      # Regenerating leaves the user-owned `src.dk` alone
      keeps-root-module:
        before-cmd: "@{generate} --no-verify && echo '# my helpers' >> sl/src/src.dk"
        test-cmd: duckbind regen sl --no-verify && grep -q '# my helpers' sl/src/src.dk
      # Regenerating only rewrites the library keys of the manifest
      keeps-manifest-edits:
        before-cmd: >-
          @{generate} --no-verify
          && sed -i 's/^metadata:$/# my comment\nmetadata:\n  description: my bindings/' sl/quackconfig.yaml
        test-cmd: >-
          duckbind regen sl --no-verify
          && grep -qx '# my comment' sl/quackconfig.yaml
          && grep -qx '  description: my bindings' sl/quackconfig.yaml
          && grep -qx '  external-libs: \[sl\]' sl/quackconfig.yaml
      # The recipe is relative to the package, so regen works from anywhere
      from-another-directory:
        before-cmd: "@{generate} --no-verify && mkdir elsewhere"
        test-cmd: cd elsewhere && duckbind regen ../sl --no-verify

  check:
    Description: a package is compared with what its recipe generates
    Cases:
      up-to-date:
        before-cmd: "@{generate} --no-verify"
        test-cmd: duckbind check sl
      edited-bindings:
        before-cmd: "@{generate} --no-verify && echo '# edited' >> sl/src/generated/sl.dk"
        test-cmd: "! duckbind check sl 2> err && grep -q '`sl.dk` differs' err"
      changed-recipe:
        before-cmd: "@{generate} --no-verify && printf 'exclude:\\n  - match\\n' >> sl/duckbind.yaml"
        test-cmd: "! duckbind check sl 2> err && grep -q 'out of date' err"

  errors:
    Description: bad input is reported and writes nothing
    Cases:
      headers-do-not-compile:
        test-cmd: >-
          ! duckbind new bad --header @{ConfigDir}/broken.h 2> err
          && grep -q 'the headers do not compile' err && [ ! -e bad ]
      already-exists:
        before-cmd: "@{generate} --no-verify"
        test-cmd: "! @{generate} 2> err && grep -q 'already exists' err"
      name-is-not-an-identifier:
        test-cmd: >-
          ! duckbind new sl --name my-lib --header sl/include/sdl_like.h 2> err
          && grep -q 'valid Duckling identifier' err
      object-file:
        test-cmd: >-
          ! duckbind new obj --header sl/include/sdl_like.h --library sdl_like.o 2> err
          && grep -q 'is not a library' err && [ ! -e obj ]
      regen-without-recipe:
        before-cmd: "duck init plain > /dev/null"
        test-cmd: "! duckbind regen plain 2> err && grep -q 'duckbind.yaml' err"

  sdl3:
    Description: SDL3 bindings drive a window, an event loop and drawing
    Enabled: pkg-config --exists sdl3
    TimeOut: 300
    NeededThreads: 2
    Cases:
      # The example script's headless check passes
      headless-demo:
        test-cmd: >-
          SDL_VIDEODRIVER=offscreen
          @{dev_dir}/src/tools/c_import/examples/sdl3_demo.sh @{duckc_dir} --work "$DIT_TMP_DIR/sdl3"
