# Formatter (duckfmt) CLI tests

compile_duckfmt: "cmake --build @{build_dir} -j -- duckfmt"
PreNode: "@{compile_duckfmt}"

Run: "@{duckfmt_path} @{run_args}"

Tests:
  format-cli:
    Cases:
      format-stdout:
        # Default formatting prints normalized source (comments included) to stdout.
        run_args: "format_unformatted.dk"
        Output:
          File: format_formatted.dk
      format-check-ok:
        # --check succeeds (exit 0) on an already-formatted file.
        run_args: "-k format_formatted.dk"
      format-check-fail:
        # --check fails (exit 1) on an unformatted file.
        run_args: "-k format_unformatted.dk"
        ExitCode: 1
      format-check-stdout-quiet:
        # --check reports on stderr, so stdout stays empty for pipelines.
        run_args: "-k format_unformatted.dk"
        ExitCode: 1
        Output:
          String: ""
      format-missing-config:
        # A non-existent config path errors cleanly instead of crashing.
        run_args: "-c does_not_exist.json format_unformatted.dk"
        ExitCode: 2
      format-bad-indent-style:
        # A misspelled indentStyle is rejected instead of silently meaning tabs.
        run_args: "-c bad_indent_style.json format_unformatted.dk"
        ExitCode: 2
      format-check-lexer-error:
        # A file that does not tokenize is an error (exit 2), not "not formatted" (exit 1).
        run_args: "-k format_lexer_error.dk"
        ExitCode: 2
  format-many-files:
    Cases:
      many-stdout:
        # Several files: each output starts with a `==> <file> <==` header. Paths are absolute,
        # so the directory is stripped before comparing.
        Run: "@{duckfmt_path} format_unformatted.dk format_formatted.dk | sed 's#^==> .*/#==> #'"
        Output:
          File: format_many_files.out
      many-check-fail:
        # --check fails when only a later file is unformatted.
        run_args: "-k format_formatted.dk format_unformatted.dk"
        ExitCode: 1
  format-config-lookup:
    Cases:
      found-config-used:
        # Without --config, the nearest duckfmt_config.json from the current directory up is
        # used: config_lookup/ holds one asking for 2-space indentation.
        Run: "cd config_lookup/nested && @{duckfmt_path} ../../format_unformatted.dk"
        Output:
          File: config_lookup/nested/format_with_found_config.out
      explicit-config-wins:
        # --config replaces the lookup: the bad explicit file is an error, the found one is
        # not even read.
        Run: "cd config_lookup/nested && @{duckfmt_path} -c ../../bad_indent_style.json ../../format_unformatted.dk"
        ExitCode: 2
