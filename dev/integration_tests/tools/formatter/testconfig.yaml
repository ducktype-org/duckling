# Formatter (duckfmt) CLI tests

compile_duckfmt: "cmake --build @{build_dir} -j -- duckfmt"
PreNode: "@{compile_duckfmt}"

Run: "@{duckfmt_path} @{run_args}"

Tests:
  format-cli:
    Cases:
      format-stdout:
        # Default formatting prints normalized source (comments included) to stdout.
        run_args: "format_unformatted.duck"
        Output:
          File: format_formatted.duck
      format-check-ok:
        # --check succeeds (exit 0) on an already-formatted file.
        run_args: "-k format_formatted.duck"
      format-check-fail:
        # --check fails (exit 1) on an unformatted file.
        run_args: "-k format_unformatted.duck"
        ExitCode: 1
      format-check-stdout-quiet:
        # --check reports on stderr, so stdout stays empty for pipelines.
        run_args: "-k format_unformatted.duck"
        ExitCode: 1
        Output:
          String: ""
      format-missing-config:
        # A non-existent config path errors cleanly instead of crashing.
        run_args: "-c does_not_exist.json format_unformatted.duck"
        ExitCode: 1
      format-bad-indent-style:
        # A misspelled indentStyle is rejected instead of silently meaning tabs.
        run_args: "-c bad_indent_style.json format_unformatted.duck"
        ExitCode: 1
  format-many-files:
    # Several files in one call. Paths in the output are absolute, so the cases strip the
    # directory before comparing.
    Env:
      DIT_TMP_DIR: "@{new_tmp_dir}"
    PostCase: "@{cleanup_tmp_env}"
    Cases:
      many-stdout:
        # Each output starts with a `==> <file> <==` header, with a blank line between files.
        Run: "@{duckfmt_path} format_unformatted.duck format_formatted.duck | sed 's#^==> .*/#==> #'"
        Output:
          File: format_many_files.out
      many-check-ok:
        # --check succeeds only when every file is formatted.
        run_args: "-k format_formatted.duck format_formatted.duck"
      many-check-fail-reports-all:
        # --check goes on after the first unformatted file and reports each of them.
        Run: "set -o pipefail; @{duckfmt_path} -k format_unformatted.duck format_formatted.duck
          format_unformatted.duck 2>&1 >/dev/null | sed 's#^.*/##'"
        ExitCode: 1
        Output:
          String: "format_unformatted.duck: not formatted\nformat_unformatted.duck: not formatted\n"
      many-in-place:
        # --in-place rewrites every file.
        Run: "cp format_unformatted.duck $DIT_TMP_DIR/a.duck && cp format_unformatted.duck $DIT_TMP_DIR/b.duck
          && @{duckfmt_path} -i $DIT_TMP_DIR/a.duck $DIT_TMP_DIR/b.duck
          && diff format_formatted.duck $DIT_TMP_DIR/a.duck && diff format_formatted.duck $DIT_TMP_DIR/b.duck"
        Output:
          String: ""
