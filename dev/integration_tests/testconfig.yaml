duckc_path: "@{build_dir}/bin/duckc"
dvm_path: "@{build_dir}/bin/VM"

is_jit_enabled: "cmake -L -N @{build_dir} | grep JIT_ENABLED | cut -d \"=\" -f 2"
# If JIT is enabled then set timeout to 7s
TimeOut: "$([ $(@{is_jit_enabled}) == \"ON\" ] && echo 7 || echo 1)"

SubDirs:
    - compiler
    - duck
    - repl
    - debug_adapter
    - scripts
