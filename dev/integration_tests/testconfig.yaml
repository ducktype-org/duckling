duckc_dir: "@{build_dir}/bin"
dvm_dir: "@{duckc_dir}"
duckc_path: "@{duckc_dir}/duckc"
dvm_path: "@{dvm_dir}/VM"

compile_duckc: "cmake --build @{build_dir} -j -- duckc"
compile_dvm: "cmake --build @{build_dir} -j -- VM"

# The toolchain is built once, before any subtree runs. Subtree PreNodes
# must not invoke cmake themselves: with -j > 1 subtrees run concurrently
# and concurrent builds of the same build dir race. NOTE: PreNode is
# INHERITED - every direct subtree must define its own (possibly empty)
# PreNode, otherwise this one reruns concurrently for each of its nodes.
PreNode: "@{tmp_env_tool} sweep && @{compile_duckc} && @{compile_dvm} && @{warmup_std_artifacts}"

expect_output: "python3 @{dev_dir}/integration_tests/helpers/expect_output.py"

is_jit_enabled: "cmake -L -N @{build_dir} | grep JIT_ENABLED | cut -d \"=\" -f 2"

# Platform predicates, evaluated in the shell that runs each command, so they can be interpolated
# anywhere a value ends up in a command (Run, Enabled, Env, ...), e.g. `[ "@{is_macos}" = true ]`.
is_macos: "$([ \"$(uname)\" = Darwin ] && echo true || echo false)"
is_linux: "$([ \"$(uname)\" = Linux ] && echo true || echo false)"

# Root of every scratch directory the suite creates. helpers/tmp_env.py owns
# it, so we just ask the script: it is `/tmp/dit-<user>` by default, or
# $DIT_TMP_ROOT when that is set, and this file does not repeat that rule.
# The root carries the user name because /tmp is shared: with one fixed root
# the first account to run the suite owns it at 0755 and every other account
# then fails to create anything in it.
tmp_root: "$(@{tmp_env_tool} root)"

# Per-case temporary environment (opt-in). A subtree that needs a scratch
# directory defines `Env: { DIT_TMP_DIR: "@{new_tmp_dir}" }` and then uses
# the helpers below; tests set `tmp_env_files` to the files they need copied.
# `new` creates the directory under the root and prints it, symlinks already
# followed - duck resolves paths, and on macOS /tmp is a symlink.
new_tmp_dir: "@{tmp_env_tool} new"
tmp_env_tool: "python3 @{dev_dir}/integration_tests/helpers/tmp_env.py"
tmp_env_files: ""
make_tmp_env: "@{tmp_env_tool} make @{tmp_env_files}"
at_tmp_env: "@{tmp_env_tool} exec --"
cleanup_tmp_env: "@{tmp_env_tool} clean"

std_artifacts_dir: "@{tmp_root}/std_artifacts"

# Populates @{std_artifacts_dir} once, before any case runs, by compiling a
# trivial script; concurrent cases then only read the shared std artifacts.
# The old directory is removed first: duckc was just rebuilt, so leftover
# artifacts may not match the new compiler. The script must live outside the
# `-a` directory, which duckc may clear on a build-id mismatch.
warmup_std_artifacts: "rm -rf @{std_artifacts_dir} @{tmp_root}/std_warmup
  && mkdir -p @{tmp_root} && printf 'fun main() -> i64 = { return 0; }' > @{tmp_root}/std_warmup.dks
  && @{duckc_path} compile_script @{tmp_root}/std_warmup.dks -a @{tmp_root}/std_warmup
  --custom-std-artifacts-path @{std_artifacts_dir}"

# If JIT is enabled then set timeout to 10s
timeout_jit: 10
# If you want to override timeout is it preferred that you set this variable
# instead of changing the value of TimeOut directly (lazy evaluation).
timeout_default: 2
TimeOut: "$([ \"$(@{is_jit_enabled})\" = \"ON\" ] && echo @{timeout_jit} || echo @{timeout_default})"

SubDirs:
    - duck
