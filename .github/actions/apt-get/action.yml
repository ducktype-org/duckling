name: apt-get
description: >
  Runs apt-get update, or apt-get install when packages are given, with time limits so a hung or
  orphaned apt cannot block later jobs on a self-hosted runner. See apt-get.sh.

inputs:
  packages:
    description: Space-separated packages to install. Empty runs apt-get update.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: bash "$GITHUB_ACTION_PATH/apt-get.sh" $PACKAGES
