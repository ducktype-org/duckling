name: Setup Rust
description: >
  Everything the Rust half of the repo (dev/src/duck) needs, on either platform: the native
  libraries it links against, the sccache wrapper, and the cache directory sccache writes to.

inputs:
  platform:
    description: '"macos" selects the no-sudo path; anything else is treated as Linux.'
    required: true
  linux-sccache-dir:
    description: >
      Where sccache caches on Linux. Inside the workspace, because there the cache is carried
      between runs by actions/cache.
    required: false
    default: ""
  macos-shared-dir:
    description: >
      Machine-local directory holding what outlives a job on the mac. sccache gets a subdirectory
      of it PER ACCOUNT: unlike ccache it is not a passive directory - each account runs its own
      server, and a server owns the LRU index of its cache directory, so two of them over one
      directory corrupt each other's accounting.
    required: false
    default: /Users/Shared/duckling-ci
  sccache-size:
    description: Disk budget for the sccache cache.
    required: false
    default: 1G

runs:
  using: composite
  steps:
    - name: Update apt
      if: ${{ inputs.platform != 'macos' }}
      shell: bash
      run: sudo apt update

    # Pkg-config is required for finding OpenSSL on Linux.
    - name: Download pkg-config
      if: ${{ inputs.platform != 'macos' }}
      shell: bash
      run: sudo apt -y install pkg-config

    # We don't (yet) bundle SQLite with duck.
    - name: Download libsqlite3-dev
      if: ${{ inputs.platform != 'macos' }}
      shell: bash
      run: sudo apt -y install libsqlite3-dev

    # Russcip needs this
    - name: Download libgfortran5
      if: ${{ inputs.platform != 'macos' }}
      shell: bash
      run: sudo apt -y install libgfortran5

    - name: Download sccache
      if: ${{ inputs.platform != 'macos' }}
      shell: bash
      run: sudo apt -y install sccache

    # Nothing is installed on the mac; the equivalents of every apt package above are already
    # there
    - name: Check the per-account rustup (macOS)
      if: ${{ inputs.platform == 'macos' }}
      shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        if [ ! -f "$HOME/.cargo/env" ] || [ ! -d "$HOME/.rustup/toolchains" ]; then
          echo "::error::$(id -un) has no per-account rustup ($HOME/.cargo/env + $HOME/.rustup)."
          exit 1
        fi
        # $GITHUB_PATH only applies to LATER steps, hence the explicit paths here.
        "$HOME/.cargo/bin/cargo" --version
        # A missing wrapper fails cargo with no useful message, so check it before it is set.
        "$HOME/.cargo/bin/sccache" --version

    - name: Setup sccache environment
      shell: bash
      run: |
        if [ '${{ inputs.platform }}' = 'macos' ]; then
          # Outside the workspace so it survives the wipe at the start of every
          # job. Nothing uploads it: on the mac the cache simply stays on the machine.
          dir='${{ inputs.macos-shared-dir }}/sccache-'"$(id -un)"
        else
          dir='${{ inputs.linux-sccache-dir }}'
          if [ -z "$dir" ]; then
            echo "::error::linux-sccache-dir is required when platform is not macos."
            exit 1
          fi
        fi
        mkdir -p "$dir"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_DIR=$dir" >> "$GITHUB_ENV"
        echo "SCCACHE_CACHE_SIZE=${{ inputs.sccache-size }}" >> "$GITHUB_ENV"
