name: Setup macOS build environment
description: >
  Points the build at what the mac mini already has.
  Nothing to install.

inputs:
  dev-dir:
    description: Absolute path of the repository's dev/ directory.
    required: true
  ccache-dir:
    description: >
      Where the workflow expects the ccache directory. Replaced with a symlink to the machine's
      shared cache, because ConfigureCCache.cmake hardcodes this path into the compiler launcher.
    required: true
  shared-dir:
    description: Directory on the machine holding the caches that outlive a job.
    required: false
    default: /Users/Shared/duckling-ci

runs:
  using: composite
  steps:
    # The choices follow dev/docs/developer-guides/building-the-repo.md, "MacOS (clang)"
    # Homebrew goes on the FRONT of PATH deliberately this ensures that python resolves
    # to the correct version.
    - name: Setup toolchain
      shell: bash
      run: |
        # add brew to path (HOMEBREW_PREFIX)
        eval "$(/opt/homebrew/bin/brew shellenv)"
        echo "CMAKE_PREFIX_PATH=$HOMEBREW_PREFIX/opt/llvm@19" >> "$GITHUB_ENV"
        # The ICU bundled with the macOS SDK is a C-only subset, so CMake must be pointed at
        # the Homebrew one.
        echo "ICU_ROOT=$HOMEBREW_PREFIX/opt/icu4c" >> "$GITHUB_ENV"
        # Apple's `ar` stamps a timestamp into every archive member unless this is set, so
        # without it the same sources produce byte-different archives on every build.
        echo "ZERO_AR_DATE=1" >> "$GITHUB_ENV"
        echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"

    # On mac the caches are kept on the machine, not in the workspace. This is a symlink to the machine's
    # shared cache, because ConfigureCCache.cmake hardcodes the path into the compiler launcher.
    - name: Point caches at local storage
      shell: bash
      run: |
        shared='${{ inputs.shared-dir }}'
        mkdir -p "$shared/ccache"
        # make sure every runner can write to the shared cache
        chmod 0777 "$shared" "$shared/ccache" 2>/dev/null || true
        # replace the workspace's ccache dir with a link to the shared one
        ln -sfn "$shared/ccache" '${{ inputs.ccache-dir }}'
        # cache entries stay world-writable, so a job running as another user can still update them
        echo "CCACHE_UMASK=000" >> "$GITHUB_ENV"
        # paths under the workspace are hashed relative to it, so a different checkout path still hits
        echo "CCACHE_BASEDIR=${{ github.workspace }}" >> "$GITHUB_ENV"
        # keep the compiler's absolute CWD out of the hash (it is hashed for -g builds), so a
        # workspace checked out at a different path still hits
        echo "CCACHE_NOHASHDIR=1" >> "$GITHUB_ENV"

    # install the python venv, so that the build can run the python scripts it needs
    - name: Bootstrap python venv
      shell: bash
      working-directory: ${{ inputs.dev-dir }}
      run: |
        venv="$HOME/duckling-ci/venv"
        stamp="$HOME/duckling-ci/venv.requirements.sha256"
        want=$(shasum -a 256 requirements.txt | cut -d' ' -f1)

        if [ ! -x "$venv/bin/python3" ] || [ "$(cat "$stamp" 2>/dev/null)" != "$want" ]; then
          echo "building the venv: missing, or requirements.txt changed"
          rm -rf "$venv"
          mkdir -p "$(dirname "$venv")"
          base_python=$(command -v python3.14 || command -v python3.13 || command -v python3.12)
          "$base_python" -m venv "$venv"
          "$venv/bin/python3" -m pip install --quiet --upgrade pip
          "$venv/bin/python3" -m pip install --quiet -r requirements.txt
          # Written only after the install succeeds, so a failed run rebuilds next time instead
          # of being remembered as good.
          printf '%s' "$want" > "$stamp"
        else
          echo "reusing the venv at $venv"
        fi

        ln -sfn "$venv" .venv
        echo "$venv/bin" >> "$GITHUB_PATH"
