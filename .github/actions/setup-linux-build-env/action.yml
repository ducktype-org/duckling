name: Setup Linux build environment
description: >
  Installs what the C++ build needs on Ubuntu runners, where the account has sudo.

inputs:
  cc:
    description: C compiler from the build matrix; also the apt package name for gcc.
    required: true
  cxx:
    description: C++ compiler from the build matrix; also the apt package name for gcc.
    required: true
  compiler-name:
    description: "Compiler family. Only gcc needs its packages installed; clang comes from llvm-19."
    required: true
  linker:
    description: Linker from the build matrix.
    required: true
  apt-llvm-version:
    description: >
      A clang major version to install from apt.llvm.org next to the default LLVM 19, together
      with its llvm tools and profile runtime.
    required: false
    default: ""
  coverage-enabled:
    description: '"true" to install the coverage tooling (lcov + fastcov).'
    required: false
    default: "false"
  build-deployables:
    description: '"true" to install graphviz, which only the deployables need.'
    required: false
    default: "false"
  dev-dir:
    description: Absolute path of the repository's dev/ directory.
    required: true

runs:
  using: composite
  steps:
    - name: Update apt
      uses: ./.github/actions/apt-get/

    - name: Install lcov
      if: ${{ inputs.coverage-enabled == 'true' }}
      uses: ./.github/actions/apt-get/
      with:
        packages: lcov

    - name: Add apt.llvm.org repository for clang ${{ inputs.apt-llvm-version }}
      if: ${{ inputs.apt-llvm-version != '' }}
      shell: bash
      env:
        VERSION: ${{ inputs.apt-llvm-version }}
      run: |
        codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
        python3 -c 'import sys, urllib.request; sys.stdout.buffer.write(urllib.request.urlopen(sys.argv[1]).read())' \
          https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        echo "deb https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${VERSION} main" \
          | sudo tee "/etc/apt/sources.list.d/llvm-${VERSION}.list"

    - name: Update apt for apt.llvm.org
      if: ${{ inputs.apt-llvm-version != '' }}
      uses: ./.github/actions/apt-get/

    # llvm-N brings llvm-profdata-N and llvm-cov-N; libclang-rt-N-dev the profile runtime.
    - name: Install clang ${{ inputs.apt-llvm-version }}
      if: ${{ inputs.apt-llvm-version != '' }}
      uses: ./.github/actions/apt-get/
      with:
        packages: clang-${{ inputs.apt-llvm-version }} llvm-${{ inputs.apt-llvm-version }} libclang-rt-${{ inputs.apt-llvm-version }}-dev

    - name: Install fastcov
      if: ${{ inputs.coverage-enabled == 'true' }}
      shell: bash
      run: sudo pip install fastcov --break-system-packages --no-input

    - name: Install graphviz
      if: ${{ inputs.build-deployables == 'true' }}
      uses: ./.github/actions/apt-get/
      with:
        packages: libgraphviz-dev

    - name: Install LLVM
      uses: ./.github/actions/apt-get/
      with:
        packages: llvm-19 llvm-19-dev

    - name: Install clang
      # Note that it is also necessary to compile Duckling builtins to LLVM bitcode
      # Must be the same version as llvm
      uses: ./.github/actions/apt-get/
      with:
        packages: clang-19 clang-tools-19

    - name: Install xxd
      # Necessary to embed LLVM bitcode into duckc source files.
      uses: ./.github/actions/apt-get/
      with:
        packages: xxd

    - name: Install mold
      if: ${{ inputs.linker == 'mold' }}
      uses: ./.github/actions/apt-get/
      with:
        packages: mold

    - name: Install GCC 14 and gcov-14
      if: ${{ inputs.compiler-name == 'gcc' }}
      # gcov is included in gcc package
      uses: ./.github/actions/apt-get/
      with:
        packages: ${{ inputs.cc }} ${{ inputs.cxx }}

    - name: Install Ninja
      uses: ./.github/actions/apt-get/
      with:
        packages: ninja-build

    - name: Install Valgrind
      uses: ./.github/actions/apt-get/
      with:
        packages: valgrind

    - name: Install pkg-config + libffi
      uses: ./.github/actions/apt-get/
      with:
        packages: pkg-config libffi-dev

    - name: Install ccache
      shell: bash
      working-directory: ${{ inputs.dev-dir }}
      run: ./toolbox.py download-binaries -s ccache
