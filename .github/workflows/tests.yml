name: tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

env:
  # @note: boolean variables evaluate to true/false string, but github expressions treat
  # all non-empty strings as true, so one must use `evn.abc == 'true'` to actually use
  # them im conditional statements.
  # (this apply to all variables, not just the ones form here)
  WORKSPACE: ${{ github.workspace }}/dev
  BUILD_DIR: ${{ github.workspace }}/dev/build
  CCACHE_DIR: ${{ github.workspace }}/dev/.ccache
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  IF_MAIN_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'}}
  BUILD_SYSTEM: Ninja
  # How much the line coverage may drop compared to main before the check fails.
  COVERAGE_TOLERANCE: "0.01"

jobs:
  # Determines the build matrix based on the event type.
  # On regular PRs only Dev/gcc runs; on push, workflow_dispatch or approved reviews the full matrix runs.
  setup:
    if: >-
      (github.event_name == 'push' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'
      ||
      (
        github.event.pull_request.draft == false &&
        github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'Override Coverage Check' || github.event.label.name == 'Run All Workflows')
      )

    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:

      - uses: actions/checkout@v6

      - name: Determine build matrix
        id: set-matrix
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          MATRIX=$(python3 .github/workflows/setup-build-matrix.py \
            --event-name "${{ github.event_name }}" \
            --branch "${{ env.BRANCH_NAME }}" \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number || 0 }}" \
            --github-token "${{ secrets.QUACKER_PAT }}")
          echo "Determined build matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: [setup]
    name: ${{ matrix.build-type }} / ${{ matrix.compiler.name }}
    # This if condition is quite complex, so let's break it down:
    # 1. Run on push (if not a draft PR) or workflow_dispatch events (these are not related to PRs).
    # 2. Run on pull_request events only if the PR is not a draft, and either
    #    it is not a labeling event or it is a labeling event but the label is
    #    "Override Coverage Check"/"Run All Workflows". This allows to re-run the workflow on PRs
    #    that were just labeled with the above labels, which is useful for
    #    re-running the workflow.
    if: >-
      (github.event_name == 'push' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'
      ||
      (
        github.event.pull_request.draft == false &&
        github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'Override Coverage Check' || github.event.label.name == 'Run All Workflows')
      )

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    outputs:
      # @note: with matrix runs, each run works with the same output,
      # and they will overwrite each other
      # see: https://github.com/orgs/community/discussions/26639
      #
      # According to: https://github.com/orgs/community/discussions/38088
      # it should not override if the step if skipped.
      coverage-value: ${{ steps.test-coverage.outputs.coverage-percent }}
      itest-coverage-value: ${{ steps.test-coverage-itests.outputs.coverage-percent }}
      todo-count: ${{ steps.todo-counter.outputs.todo-count }}

    timeout-minutes: 60 # (Per matrix run)
    runs-on:
      group: SelfHostedRunners
      labels: ${{ matrix.compiler.platform == 'macos' && 'macOS' || (matrix.build-type == 'Dev' && 'debug' || 'release') }}

    env:
      BUILD_DEPLOYABLES: ${{ matrix.build-type == 'DevOpt' }}
      COVERAGE_ENABLED: ${{ matrix.build-type == 'Dev' && matrix.compiler.name == 'gcc' }}
      PLATFORM: ${{ matrix.compiler.platform }}

    steps:
      - name: Set self-hosted placeholder
        id: set-self-hosted
        run: echo "is-self-hosted=true" >> $GITHUB_OUTPUT

      - name: Set number of threads
        id: set-jobs
        run: |
          if [ -r /sys/fs/cgroup/cpu.max ]; then
            read -r quota period < /sys/fs/cgroup/cpu.max
            cpus=$((quota / period + 1))
          else
            # This branch will be taken on macOS
            cpus=10
          fi
          echo "jobs=$cpus" >> $GITHUB_OUTPUT

      - name: Clean workspace
        if: ${{ steps.set-self-hosted.outputs.is-self-hosted == 'true' }}
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env/
        with:
          platform: ${{ env.PLATFORM }}
          cc: ${{ matrix.compiler.cc }}
          cxx: ${{ matrix.compiler.cxx }}
          compiler-name: ${{ matrix.compiler.name }}
          linker: ${{ matrix.compiler.linker }}
          coverage-enabled: ${{ env.COVERAGE_ENABLED }}
          build-deployables: ${{ env.BUILD_DEPLOYABLES }}
          dev-dir: ${{ env.WORKSPACE }}
          ccache-dir: ${{ env.CCACHE_DIR }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust/
        with:
          platform: ${{ env.PLATFORM }}
          sccache-dir: ${{ github.workspace }}/.cache/sccache

      - name: Check installations
        run: |
          ${{ matrix.compiler.cxx }} --version
          ${{ matrix.compiler.cc }} --version
          ${{ matrix.compiler.name == 'gcc' && format('{0} --version', matrix.compiler.gcov) || 'echo "No gcov for clang"' }}

      # Generate a timestamp and save it to a variable.
      # Timestamp is appended to the key in caching, so each cache has a unique key.
      # This step is arbitrary, and has nothing to the order of choosing the most
      # recent hash.
      - name: Prepare cache timestamp
        id: cache-timestamp
        # Only the actions/cache keys consume this, and those steps are Linux-only.
        if: ${{ env.PLATFORM != 'macos' }}
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H::%M::%S" UTC)
          file(APPEND "$ENV{GITHUB_OUTPUT}" "timestamp=${current_date}")

      # Cache local branch and on miss fallback to main branch's cache. In case
      # main branch misses, fallback to any branch's cache.
      - name: Restore build cache
        id: restore-build-cache
        # macOS keeps its ccache on the machine - see "Point caches at local storage".
        if: ${{ env.PLATFORM != 'macos' }}
        uses: actions/cache/restore@v5
        with:
          # main builds from an empty cache on purpose: the entry it saves is what every branch
          # falls back to, so it holds one fresh build rather than every object ever compiled
          # on main. Not downloading is what keeps it that way.
          lookup-only: ${{ env.BRANCH_NAME == 'main' }}
          path: |
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.compiler.cache-prefix }}-${{ matrix.build-type }}-${{ env.BRANCH_NAME }}-${{ steps.cache-timestamp.outputs.timestamp }}
          # If there is no match with the key, then it tries to partially
          # match with any of restore-keys (top to bottom).
          # Most recent entry is used when multiple match to the same key.
          # See readme for details.
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler.cache-prefix }}-${{ matrix.build-type }}-${{ env.BRANCH_NAME }}
            ${{ runner.os }}-${{ matrix.compiler.cache-prefix }}-${{ matrix.build-type }}-main
            ${{ runner.os }}-${{ matrix.compiler.cache-prefix }}-${{ matrix.build-type }}

      # macOS keeps its sccache on the machine as well - see "Point caches at local storage".
      - name: Restore sccache cache
        id: restore-sccache-cache
        if: ${{ env.PLATFORM != 'macos' }}
        uses: actions/cache/restore@v5
        with:
          lookup-only: ${{ env.BRANCH_NAME == 'main' }}
          path: |
            ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ env.BRANCH_NAME }}-${{ steps.cache-timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ env.BRANCH_NAME }}-
            ${{ runner.os }}-sccache-main-
            ${{ runner.os }}-sccache-

      - name: Initialize project
        working-directory: ${{ env.WORKSPACE }}
        run: |
          ./toolbox.py init


      # Enables coverage only in case of Debug build.
      - name: Additional setup-build flags
        id: setup-build-flags
        # Env here is used for readability only
        env:
          flags: ${{ env.COVERAGE_ENABLED == 'true' && format('--coverage --gcov-version {0}', matrix.compiler.gcov) || '--no-coverage' }}
        run: echo flags=${{ env.flags }} >> $GITHUB_OUTPUT

        # JIT should be enabled if build type is DevOpt and compiler is clang, otherwise it should be disabled.
      - name: Check should enable JIT
        id: check-jit
        run: |
            echo jit-flag=$( [ "${{ matrix.build-type }}" = "DevOpt" ] && \
                                [ "${{ matrix.compiler.name }}" = "clang" ] && \
                                echo "--jit llvm-only" || echo "--jit no" ) >> $GITHUB_OUTPUT

      # Configure CMake. Using toolbox instead of direct command, because it
      # also enables CMake File API, which is necessary for integration tests.
      # It also allows us to omit specifying all LLVM tools for JIT.
      - name: Configure CMake
        working-directory: ${{ env.WORKSPACE }}
        run: |
          ./toolbox.py setup-build \
            -b ${{ env.BUILD_DIR }} \
            -s ${{ env.BUILD_SYSTEM }} \
            -c ${{ matrix.compiler.cc }} \
            -x ${{ matrix.compiler.cxx }} \
            -t ${{ matrix.build-type }} \
            ${{ steps.check-jit.outputs.jit-flag }} \
            ${{ steps.setup-build-flags.outputs.flags }} \
            --linker ${{ matrix.compiler.linker }} \
            --ccache \
            --strip-symbol-information
        env:  # Hot fix for GH issues:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://quacker-bot:${{ secrets.QUACKER_PAT }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_CONFIG_KEY_1: http.version
          GIT_CONFIG_VALUE_1: HTTP/1.1

      # Build all tests.
      # We additionally build coverage targets in case of coverage enabled,
      # so they are nicely parallelized and cached.
      #
      # duckc and VM are built here too, although no test links them: we build them just so their
      # objects land in the ccache entry saved below.
      - name: Build tests
        working-directory: ${{ env.WORKSPACE }}
        run: |
          cmake                                 \
          --build ${{ env.BUILD_DIR }}          \
          -j ${{ steps.set-jobs.outputs.jobs }} \
          --                                    \
          build_all_tests                       \
          duckc                                 \
          VM                                    \
          ${{ env.COVERAGE_ENABLED == 'true' && 'build_all_coverage_targets' || '' }}

      # Check against regressions in target applications.
      # This step is run now so that the results are cached.
      # However, it does not fail the job at this stage because we still want the tests to be run.
      # It will fail the job at the end in the "Fail if deployables failed to build" step.
      - name: Build deployables
        id: build-deployables
        if: ${{ env.BUILD_DEPLOYABLES == 'true' }}
        working-directory: ${{ env.WORKSPACE }}
        run: cmake --build ${{ env.BUILD_DIR }} -j ${{ steps.set-jobs.outputs.jobs }} -- all build_all_playgrounds
        continue-on-error: true

      - name: Show disk usage
        working-directory: ${{ env.WORKSPACE }}
        run: |
          echo "build:"
          du -hs ${{ env.BUILD_DIR }}

          echo "build/lib:"
          du -hs ${{ env.BUILD_DIR }}/lib

          echo "build/bin:"
          du -hs ${{ env.BUILD_DIR }}/bin

          echo "ccache:"
          du -hs ${{ env.CCACHE_DIR }}

          echo "sccache:"
          [ -n "${SCCACHE_DIR:-}" ] && du -hs "$SCCACHE_DIR" || echo 0

      - name: Show ccache statistics
        run: |
          ccache_bin=$(command -v ccache || echo '${{ env.WORKSPACE }}/scripts/downloads/ccache')
          "$ccache_bin" --show-stats --verbose | head -30

      # Uploaded in the BACKGROUND (GitHub shipped this 2026-06-25): the tests below start
      # immediately instead of waiting out the upload.
      - name: Save build cache
        id: save-build-cache
        if: ${{ env.PLATFORM != 'macos' }}
        background: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-build-cache.outputs.cache-primary-key }}

      - name: Test
        working-directory: ${{ env.WORKSPACE }}
        run: ./toolbox.py test -b ${{ env.BUILD_DIR }} -j ${{ steps.set-jobs.outputs.jobs }} --output-on-failure --timeout 60

      - name: Test Coverage
        id: test-coverage
        if: ${{ env.COVERAGE_ENABLED == 'true' }}
        working-directory: ${{ env.WORKSPACE }}
        run: |
          cmake --build ${{ env.BUILD_DIR }} -- coverage
          echo coverage-percent=$(python3 ${{ env.WORKSPACE }}/scripts/cmake/coverage_info_parser.py ${{ env.BUILD_DIR }}/coverage/index.html) > $GITHUB_OUTPUT

      - name: Delete coverage data files
        if: ${{ env.COVERAGE_ENABLED == 'true' }}
        working-directory: ${{ env.WORKSPACE }}
        run: |
          # Remove only .gcda files, so that .gcno files are still present for integration tests
          find ${{ env.BUILD_DIR }} -name '*.gcda' -type f -delete

      - name: Integration Tests
        id: integration-tests
        working-directory: ${{ env.WORKSPACE }}
        # Coverage-instrumented binaries are much slower, and concurrent duckc
        # processes serialize on .gcda profile writes.
        run: |
          # One log directory per account.
          log_dir="/tmp/dit-log-$(id -un)"
          mkdir -p "$log_dir"
          ITEST_LOG="$log_dir/dit.log"
          rm -f "$ITEST_LOG"
          echo "ITEST_LOG=$ITEST_LOG" >> "$GITHUB_ENV"
          ./toolbox.py itest -b ${{ env.BUILD_DIR }} -j ${{ steps.set-jobs.outputs.jobs }} --log-file "$ITEST_LOG" --deterministic-output ${{ env.COVERAGE_ENABLED == 'true' && '--timeout-scale 5' || '' }}

      # NOTE: This has to be done **after** integration tests: ONLY when testing duck, we actually build duck in CI,
      # so we have to save sccache after that, otherwise we'd have nothing to save.
      # Backgrounded for the same reason as the build cache above; the coverage and TODO steps
      # that follow do not touch $SCCACHE_DIR.
      - name: Save sccache cache
        id: save-sccache-cache
        if: ${{ env.PLATFORM != 'macos' }}
        background: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.SCCACHE_DIR }}
          key: ${{ steps.restore-sccache-cache.outputs.cache-primary-key }}


      # failure() makes this step run even when a previous step has failed (which would otherwise
      # cause all subsequent steps to be skipped). The additional conditions ensure this step only
      # runs when at least one of the integration test steps actually failed.
      - name: Cat itests log file on failure
        if: ${{ failure() && (steps.integration-tests.outcome == 'failure') }}
        run: cat "${{ env.ITEST_LOG }}"

      - name: Test Coverage After Integration Tests
        id: test-coverage-itests
        if: ${{ env.COVERAGE_ENABLED == 'true' }}
        working-directory: ${{ env.WORKSPACE }}
        run: |
          cmake --build ${{ env.BUILD_DIR }} -- coverage
          echo coverage-percent=$(python3 ${{ env.WORKSPACE }}/scripts/cmake/coverage_info_parser.py ${{ env.BUILD_DIR }}/coverage/index.html) > $GITHUB_OUTPUT

      - name: Test TODO Count
        id: todo-counter
        working-directory: ${{ env.WORKSPACE }}
        run: |
          echo todo-count=$(python3 toolbox.py todo-counter -c -p TODO) > $GITHUB_OUTPUT

      - name: Fail if deployables failed to build
        if: ${{ env.BUILD_DEPLOYABLES == 'true' && steps.build-deployables.outcome != 'success' }}
        run: exit 1

  # Every run saves a new timestamped entry, so without pruning the branch's caches grow without
  # bound.
  #
  # This groups the entries by the key they share and keeps the newest of each. It also collects entries
  # left behind by runs that were cancelled mid-flight.
  prune-caches:
    needs: [build]
    # Pruning is worth doing whether or not the build passed; `needs` already skips this when
    # `build` never ran.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}

    runs-on: ubuntu-24.04 # github runner
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Delete superseded cache entries for this branch
        env:
          CACHE_DELETE_TOKEN: ${{ secrets.CACHE_DEL_PAT }}
        run: |
          python3 .github/workflows/prune-caches.py \
            --repo "${{ github.repository }}" \
            --branch "${{ env.BRANCH_NAME }}"

  code-statistics:
    needs: [build]

    runs-on: ubuntu-24.04

    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch origin/main
        run: git fetch origin main

      - name: Get newly added TODOs
        id: get-new-todos
        working-directory: dev
        run: |
          TODOS=$(python3 toolbox.py todo-validate --print-todos --branch origin/main --no-merge-base)
          echo "new-todos=$TODOS" >> $GITHUB_OUTPUT
          if [[ "$TODOS" == *"No new"* ]]; then
            echo "has-new-todos=false" >> $GITHUB_OUTPUT
          else
            echo "has-new-todos=true" >> $GITHUB_OUTPUT
          fi

      - name: Save main coverage percentage
        uses: action-pack/set-variable@v1
        if: ${{ env.BRANCH_NAME == 'main' }}
        with:
          name: "MAIN_COVERAGE_VALUE"
          value: ${{ needs.build.outputs.coverage-value }}
          token: ${{ secrets.QUACKER_PAT }}

      - name: Save main integration test coverage percentage
        uses: action-pack/set-variable@v1
        if: ${{ env.BRANCH_NAME == 'main' }}
        with:
          name: "MAIN_ITEST_COVERAGE_VALUE"
          value: ${{ needs.build.outputs.itest-coverage-value }}
          token: ${{ secrets.QUACKER_PAT }}

      - name: Save main TODO count
        uses: action-pack/set-variable@v1
        if: ${{ env.BRANCH_NAME == 'main' }}
        with:
          name: "MAIN_TODO_COUNT"
          value: ${{ needs.build.outputs.todo-count }}
          token: ${{ secrets.QUACKER_PAT }}

      - name: Read main coverage percentage
        id: read-main-coverage
        run: echo value=${{ vars.MAIN_COVERAGE_VALUE }} > $GITHUB_OUTPUT

      - name: Read main integration test coverage percentage
        id: read-main-itest-coverage
        run: echo value=${{ vars.MAIN_ITEST_COVERAGE_VALUE }} > $GITHUB_OUTPUT

      - name: Read main TODO count
        id: read-main-todo-count
        run: echo value=${{ vars.MAIN_TODO_COUNT }} > $GITHUB_OUTPUT

      - name: Calculate TODO difference
        id: calc-todo-diff
        run: "echo value=$((${{ needs.build.outputs.todo-count }} - ${{ steps.read-main-todo-count.outputs.value }})) > $GITHUB_OUTPUT"

      - name: Calculate TODO negated
        id: calc-todo-diff-neg
        run: "echo value=$((-${{ steps.calc-todo-diff.outputs.value }})) > $GITHUB_OUTPUT"

      - name: Check coverage status
        id: check-coverage-status
        # Github expressions cannot do arithmetic, so the tolerance is applied by awk.
        env:
          CURRENT_COVERAGE: ${{ needs.build.outputs.coverage-value }}
          MAIN_COVERAGE: ${{ steps.read-main-coverage.outputs.value }}
        run: |
          awk -v cur="$CURRENT_COVERAGE" -v base="$MAIN_COVERAGE" -v tol="$COVERAGE_TOLERANCE" \
              'BEGIN { print "success=" ((cur + tol >= base) ? "true" : "false") }' > $GITHUB_OUTPUT

      - name: Hide previous bot comments
        if: ${{ env.IF_MAIN_PR == 'true' }}
        uses: int128/hide-comment-action@v1
        with:
          token: ${{ secrets.QUACKER_PAT }}
          authors: quacker-bot

      - name: Post code statistics as github comment
        uses: actions/github-script@v9
        if: ${{ env.IF_MAIN_PR == 'true' }}
        env:
          COV_FAIL_MSG: '❌❌❌ - **You have to write some more tests! The coverage may not drop by more than ${{ env.COVERAGE_TOLERANCE }}% below the main branch.** \n\n 🆘 Run coverage tests: `./toolbox.py coverage` to get more information.'
          COV_SUCC_MSG: "✅✅✅ - **Great job writing tests!**"
          TODO_FAIL_MSG: "🙈🙈🙈 - You have **added ${{ steps.calc-todo-diff.outputs.value }}** TODO(s) to the repo! 🥴❌🥴"
          TODO_SINGLE_GOOD_MSG: "👍👍👍 - You have **solved ${{ steps.calc-todo-diff-neg.outputs.value }}** TODO!"
          TODO_MULTIPLE_AMAZED_MSG: "😍🤯🤯🤯😍 - You have **solved ${{ steps.calc-todo-diff-neg.outputs.value }}** TODOs!!! You are a hero! 🤩🥳🥳🥳🤩"

        with:
          github-token: ${{ secrets.QUACKER_PAT }}
          # Lines start, not end with `\n` because otherwise there are many spaces inserted
          # and the created markdown does not parse well.
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Coverage \
                    \n🎉 Tests and coverage ran successfully! 🎉 \
                    \n⭐ Lines covered on the **current** branch: **${{ needs.build.outputs.coverage-value }}%** \
                    \n⭐ Lines covered on the main branch: ${{ steps.read-main-coverage.outputs.value }}% \
                    \n${{ steps.check-coverage-status.outputs.success == 'true' && env.COV_SUCC_MSG || env.COV_FAIL_MSG }} \
                    \n## Coverage of Integration Tests \
                    \n⭐ Lines covered by integration tests on the **current** branch: **${{ needs.build.outputs.itest-coverage-value }}%** \
                    \n⭐ Lines covered by integration tests on the main branch: ${{ steps.read-main-itest-coverage.outputs.value }}% \
                    \n## TODOs \
                    \n⭐ Current TODO count: **${{ needs.build.outputs.todo-count }}** \
                    \n${{ steps.calc-todo-diff.outputs.value > 0 && env.TODO_FAIL_MSG || '' }}${{ steps.calc-todo-diff.outputs.value == -1 && env.TODO_SINGLE_GOOD_MSG || '' }}${{ steps.calc-todo-diff.outputs.value < -1 && env.TODO_MULTIPLE_AMAZED_MSG || '' }} \
                    \n${{ steps.get-new-todos.outputs.has-new-todos == 'true' && '## Newly Added TODOs' || '' }} \
                    \n${{ steps.get-new-todos.outputs.has-new-todos == 'true' && steps.get-new-todos.outputs.new-todos || '' }} \
                    '
            })

      - name: Fail if insufficient coverage
        if: ${{ steps.check-coverage-status.outputs.success != 'true' && env.IF_MAIN_PR == 'true' && (! contains(github.event.pull_request.labels.*.name, 'Override Coverage Check'))}}
        run: exit 1
