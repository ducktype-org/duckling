name: tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

env:
  # @note: boolean variables evaluate to true/false string, but github expressions treat
  # all non-empty strings as true, so one must use `evn.abc == 'true'` to actually use
  # them im conditional statements.
  # (this apply to all variables, not just the ones form here)
  WORKSPACE: ${{ github.workspace }}/dev
  BUILD_DIR: ${{ github.workspace }}/dev/build
  CCACHE_DIR: ${{ github.workspace }}/dev/.ccache
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  IF_MAIN_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'}}
  BUILD_SYSTEM: Ninja

jobs:
  # Determines the build matrix based on the event type.
  # On regular PRs only Dev/gcc runs; on push, workflow_dispatch or approved reviews the full matrix runs.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Determine build matrix
        id: set-matrix
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          MATRIX=$(python3 .github/workflows/setup-build-matrix.py \
            --event-name "${{ github.event_name }}" \
            --branch "${{ env.BRANCH_NAME }}" \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number || 0 }}" \
            --github-token "${{ secrets.QUACKER_PAT }}")
          echo "Determined build matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: [setup]
    name: ${{ matrix.build-type }} / ${{ matrix.compiler.name }}
    # This if condition is quite complex, so let's break it down:
    # 1. Run on push (if not a draft PR) or workflow_dispatch events (these are not related to PRs).
    # 2. Run on pull_request events only if the PR is not a draft, and either
    #    it is not a labeling event or it is a labeling event but the label is
    #    "Override Coverage Check"/"Run All Workflows". This allows to re-run the workflow on PRs
    #    that were just labeled with the above labels, which is useful for
    #    re-running the workflow.
    if: >-
      (github.event_name == 'push' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'
      ||
      (
        github.event.pull_request.draft == false &&
        github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'Override Coverage Check' || github.event.label.name == 'Run All Workflows')
      )

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    timeout-minutes: 40 # (Per matrix run)
    runs-on:
      group: SelfHostedRunners
      labels: ${{ matrix.build-type == 'Dev' && 'debug' || 'release' }}

    env:
      BUILD_DEPLOYABLES: ${{ matrix.build-type == 'DevOpt' }}
      COVERAGE_ENABLED: ${{ matrix.build-type == 'Dev' && matrix.compiler.name == 'gcc' }}

    steps:
      - name: Set self-hosted placeholder
        id: set-self-hosted
        run: echo "is-self-hosted=true" >> $GITHUB_OUTPUT

      - name: Set number of threads
        id: set-jobs
        run: |
          if [[ "${{ matrix.build-type }}" == "Dev" && "${{ steps.set-self-hosted.outputs.is-self-hosted }}" == "true" ]]; then
            echo "jobs=6" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.build-type }}" == "DevOpt" && "${{ steps.set-self-hosted.outputs.is-self-hosted }}" == "true" ]]; then
            echo "jobs=3" >> $GITHUB_OUTPUT
          else
            echo "jobs=2" >> $GITHUB_OUTPUT
          fi

      - name: Clean workspace
        if: ${{ steps.set-self-hosted.outputs.is-self-hosted == 'true' }}
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update apt
        run: sudo apt update


      - name: Install clang
        # Note that it is also necessary to compile Duckling builtins to LLVM bitcode
        # Must be the same version as llvm
        run: sudo apt -y install clang-19 clang-tools-19

      - name: Install GCC 14 and gcov-14
        if: ${{ matrix.compiler.name == 'gcc' }}
        run: sudo apt install -y ${{ matrix.compiler.cc }} ${{ matrix.compiler.cxx }} # gcov is included in gcc package

      - name: Setup duck dependencies
        uses: ./.github/actions/setup-duck-dependencies/

      - name: Check installations
        run: |
          ${{ matrix.compiler.cxx }} --version
          ${{ matrix.compiler.cc }} --version
          ${{ matrix.compiler.name == 'gcc' && format('{0} --version', matrix.compiler.gcov) || 'echo "No gcov for clang"' }}

      - name: Install ccache
        working-directory: ${{ env.WORKSPACE }}
        run: ./toolbox.py download-binaries -s ccache

      # Generate a timestamp and save it to a variable.
      # Timestamp is appended to the key in caching, so each cache has a unique key.
      # This step is arbitrary, and has nothing to the order of choosing the most
      # recent hash.

      - name: Initialize project
        working-directory: ${{ env.WORKSPACE }}
        run: ./toolbox.py init

      # Enables coverage only in case of Debug build.
      - name: Additional setup-build flags
        id: setup-build-flags
        # Env here is used for readability only
        env:
          flags: ${{ env.COVERAGE_ENABLED == 'true' && format('--coverage --gcov-version {0}', matrix.compiler.gcov) || '--no-coverage' }}
        run: echo flags=${{ env.flags }} >> $GITHUB_OUTPUT

        # JIT should be enabled if build type is DevOpt and compiler is clang, otherwise it should be disabled.
      - name: Check should enable JIT
        id: check-jit
        run: |
          echo jit-flag=$( [ "${{ matrix.build-type }}" = "DevOpt" ] &&
                              [ "${{ matrix.compiler.name }}" = "clang" ] &&
                               echo "--enable-jit" || echo "--no-enable-jit" ) >> $GITHUB_OUTPUT


      - name: Integration Tests
        id: integration-tests
        working-directory: ${{ env.WORKSPACE }}
        run: ./toolbox.py itest -b ""

      # failure() makes this step run even when a previous step has failed (which would otherwise
      # cause all subsequent steps to be skipped). The additional conditions ensure this step only
      # runs when at least one of the integration test steps actually failed.
      - name: Cat itests log file on failure
        if: ${{ failure() && (steps.integration-tests.outcome == 'failure') }}
        run: cat /tmp/dit.log


