name: tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  WORKSPACE: ${{ github.workspace }}/dev/
  BUILD_DIR: ${{ github.workspace }}/dev/build
  CCACHE_DIR: ${{ github.workspace }}/dev/.ccache
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  TEST_BUILD_TYPE: Debug
  COVERAGE_BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        build-type: [Debug, Release]
      fail-fast: false
    timeout-minutes: 8
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lcov
        if: ${{ matrix.build-type == 'Debug' }}
        run: sudo apt-get -y install lcov

      - name: Install ccache
        working-directory: ${{ env.WORKSPACE }}
        run: ./toolbox.py download-binaries -s ccache

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      # Idea - cache local branch and fallback to main ccache.
      - name: Cache build folder
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-build-${{ matrix.build-type }}-${{ env.BRANCH_NAME }}-${{ steps.get-date.outputs.date }}
          # This is interesting. If no match happens to the key, then it tries to partially
          # match with any of restore-keys, and if matches, then the most recent cache is used.
          restore-keys : |
            ${{ runner.os }}-build-${{ matrix.build-type }}-${{ env.BRANCH_NAME }}
            ${{ runner.os }}-build-${{ matrix.build-type }}-main
            ${{ runner.os }}-build-${{ matrix.build-type }}

      - name: Additional CMake flags
        id: cmake-flags
        env:
          flags: ${{ matrix.build-type == 'Debug' && '-D ENABLE_COVERAGE=ON' || '' }}
        run: echo flags=${{ env.flags }} >> $GITHUB_OUTPUT

      - name: Configure CMake
        working-directory: ${{ env.WORKSPACE }}
        run: cmake -B ${{ env.BUILD_DIR }} -D CMAKE_CXX_COMPILER=g++-11 -D BUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -D DOWNLOAD_UBUNTU_ICU_BUILD=ON -D USE_CCACHE=ON ${{ steps.cmake-flags.outputs.flags }}

      - name: Build
        working-directory: ${{ env.WORKSPACE }}
        run: cmake --build ${{ env.BUILD_DIR }} -j 5 -- build_all_tests

      - name: Test
        working-directory: ${{ env.BUILD_DIR }}
        run: cmake --build ${{ env.BUILD_DIR }} -- test

      - name: Test Coverage
        if: ${{ matrix.build-type == 'Debug' }}
        working-directory: ${{ env.WORKSPACE }}
        run: |
          cmake --build ${{ env.BUILD_DIR }} -- coverage
          cat ${{ env.BUILD_DIR }}/compile_commands.json
