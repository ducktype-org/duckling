name: tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  WORKSPACE: ${{github.workspace}}/dev/
  BUILD_DIR: ${{env.WORKSPACE}}/build

jobs:
  build:
    timeout-minutes: 8
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

        # Install a coverage tool
      - name: Install dependencies
        run: sudo apt-get -y install lcov

    # @FIXME: Caching does not work, cmake rebuilds everything anyway
    # Perhaps use https://cristianadam.eu/20200113/speeding-up-c-plus-plus-github-actions-using-ccache/
    # - name: CacheBuild
    #   id: cache-build
    #   uses: actions/cache@v3
    #   with:
    #     path: |
    #       ${{env.WORKSPACE}}/lib/*
    #       ${{env.WORKSPACE}}/bin/*
    #       ${{env.WORKSPACE}}/CMakeFiles/*
    #       ${{env.WORKSPACE}}/CMakeLists.txt
    #       ${{env.WORKSPACE}}/Makefile
    #       ${{env.WORKSPACE}}/CMakeCache.txt
    #       ${{env.WORKSPACE}}/cmake_install.cmake
    #       ${{env.WORKSPACE}}/CTestTestfile.cmake
    #     key: ${{ runner.os }}-cache-build


      - name: Save state
        run: echo "{name321}={value321}" >> $GITHUB_STATE

      - name: Set output
        run: echo "name123=value123" >> $GITHUB_OUTPUT

      - name: Configure CMake
        working-directory: ${{env.WORKSPACE}}
        run: cmake -B ${{env.BUILD_DIR}} -D CMAKE_CXX_COMPILER=g++-11 -D BUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -D DOWNLOAD_UBUNTU_ICU_BUILD=ON -D ENABLE_COVERAGE=true


      - name: Build
        working-directory: ${{env.WORKSPACE}}
        run: cmake --build ${{env.BUILD_DIR}} -j 2 --target build_all_tests --config ${{env.BUILD_TYPE}}

  test:
    runs-on: ubuntu-22.04
    needs: build
    steps:
    - uses: actions/checkout@v4
      working-directory: ${{env.BUILD_DIR}}
      run: ctest -C ${{env.BUILD_TYPE}}

  test-coverage:
    runs-on: ubunt-22.04
    needs: build
    steps:
    - uses: actions/checkout@v4
      working-directory: ${{env.WORKSPACE}}
      run: cmake --build ${{env.BUILD_DIR}} -- coverage
