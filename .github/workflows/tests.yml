name: tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  WORKSPACE: ${{ github.workspace }}/dev/
  BUILD_FOLDER: ${{ github.workspace }}/dev/build
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    timeout-minutes: 8
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

        # Install a coverage tool
      - name: Install dependencies
        run: sudo apt-get -y install lcov

      # Idea - cache local branch and fallback to cache main.
      - name: Cache build folder
        id: cache-build
        uses: actions/cache@v4
        with:
          path: ${{env.BUILD_FOLDER}}
          key: ${{ runner.os }}-build-${{ env.BRANCH_NAME }}-${{ hashFiles('**/*.*pp', '**/CMakeLists.txt') }}
          # This is interesting. If no match happens to the key, then it tries to partially
          # match with any of restore-keys, and if matches, then the most recent cache is used.
          restore-keys : |
            ${{ runner.os }}-build-main-

      - name: Configure CMake
        working-directory: ${{env.WORKSPACE}}
        run: cmake -B ${{env.BUILD_FOLDER}} -D CMAKE_CXX_COMPILER=g++-11 -D BUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -D DOWNLOAD_UBUNTU_ICU_BUILD=ON -D ENABLE_COVERAGE=true

      - name: Build
        working-directory: ${{env.WORKSPACE}}
        run: cmake --build ${{env.BUILD_FOLDER}} -j 2 --target build_all_tests --config ${{env.BUILD_TYPE}}

  test:
      runs-on: ubuntu-22.04
      needs: build
      steps:
        - uses: actions/checkout@v4

        - name: Cache build folder
          id: cache-build
          uses: actions/cache@v4
          with:
            path: ${{env.BUILD_FOLDER}}
            key: ${{ runner.os }}-build-${{ env.BRANCH_NAME }}-${{ hashFiles('**/*.*pp', '**/CMakeLists.txt') }}

        - name: Test
          working-directory: ${{env.BUILD_FOLDER}}
          run: ctest -C ${{env.BUILD_TYPE}}

        - name: Test Coverage
          working-directory: ${{env.WORKSPACE}}
          run: cmake --build ${{env.BUILD_FOLDER}} -- coverage
