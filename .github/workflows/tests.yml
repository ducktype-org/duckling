name: tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  # @note: boolean variables evaluate to true/false string, but github expressions treat
  # all non-empty strings as true, so one must use `evn.abc == 'true'` to actually use
  # them im conditional statements.
  # (this apply to all variables, not just the ones form here)
  WORKSPACE: ${{ github.workspace }}/dev
  BUILD_DIR: ${{ github.workspace }}/dev/build
  CCACHE_DIR: ${{ github.workspace }}/dev/.ccache
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  IF_MAIN_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'}}
  CXX_COMPILER: g++-14
  CC_COMPILER: gcc-14
  GCOV_VERSION: gcov-14

jobs:
  determine-runners:
    runs-on: ubuntu-latest
    outputs:
      runner1: ${{ steps.set-runner.outputs.runner1 }}
      runner2: ${{ steps.set-runner.outputs.runner2 }}
    steps:
      - name: Determine which runner to use
        id: set-runner
        env:
          GH_TOKEN: ${{ secrets.WORKLOW_SCHED_TOKEN }}
        run: |
          # Sprawdź dostępność self-hosted runners
          echo "Sprawdzanie dostępności self-hosted runners..."

          runners=$(gh api -H "Accept: application/vnd.github+json" /orgs/ducktype-org/actions/runners 2>/dev/null || echo '{"runners":[]}')

          # Pobierz dwa dostępne runnery
          available_runners=$(echo "$runners" | jq -r '.runners[]? | select(.status == "online" and .busy == false and (.labels[]?.name == "build")) | .name' | head -2)

          runner1=$(echo "$available_runners" | sed -n '1p')
          runner2=$(echo "$available_runners" | sed -n '2p')

          if [ -n "$runner1" ] && [ "$runner1" != "null" ]; then
            echo "✅ Self-hosted runner dostępny: $runner1"
            echo "runner1={\"group\": \"SelfHostedRunners\", \"labels\": \"build\"}" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Brak dostępnych self-hosted runners, używam GitHub-hosted dla runner1"
            echo "runner1=\"ubuntu-latest\"" >> $GITHUB_OUTPUT
          fi

          if [ -n "$runner2" ] && [ "$runner2" != "null" ]; then
            echo "✅ Self-hosted runner dostępny: $runner2"
            echo "runner2={\"group\": \"SelfHostedRunners\", \"labels\": \"build\"}" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Brak dostępnych self-hosted runners, używam GitHub-hosted dla runner2"
            echo "runner2=\"ubuntu-latest\"" >> $GITHUB_OUTPUT
          fi


  build:
    if: github.event.pull_request.draft == false
    needs: determine-runners

    strategy:
      matrix:
        build-type: [Debug, Release]  # (Release, Debug, RelWithDebInfo, etc.)
      fail-fast: false

    outputs:
      # @note: with matrix runs, each run works with the same output,
      # and they will overwrite each other
      # see: https://github.com/orgs/community/discussions/26639
      #
      # According to: https://github.com/orgs/community/discussions/38088
      # it should not override if the step if skipped.
      coverage-value: ${{ steps.test-coverage.outputs.coverage-percent }}

    timeout-minutes: 20  # (Per matrix run)
    runs-on: ${{ matrix.build-type == 'Debug' && fromJson(needs.determine-runners.outputs.runner1) || fromJson(needs.determine-runners.outputs.runner2) }}

    env:
      BUILD_DEPLOYABLES: ${{ matrix.build-type == 'Release' }}
      COVERAGE_ENABLED: ${{ matrix.build-type == 'Debug' }}

    steps:
      - name: Set self-hosted flag
        id: set-self-hosted
        run: |
          if [[ "${{ matrix.build-type }}" == "Debug" && "${{ needs.determine-runners.outputs.runner1 }}" == *"SelfHostedRunners"* ]]; then
            echo "is-self-hosted=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.build-type }}" == "Release" && "${{ needs.determine-runners.outputs.runner2 }}" == *"SelfHostedRunners"* ]]; then
            echo "is-self-hosted=true" >> $GITHUB_OUTPUT
          else
            echo "is-self-hosted=false" >> $GITHUB_OUTPUT
          fi

      - name: Set number of threads
        id: set-jobs
        run: |
          if [[ "${{ steps.set-self-hosted.outputs.is-self-hosted }}" == "true" ]]; then
            echo "jobs=4" >> $GITHUB_OUTPUT
          else
            echo "jobs=2" >> $GITHUB_OUTPUT
          fi

      - name: Clean workspace (self-hosted only)
        if: ${{ steps.set-self-hosted.outputs.is-self-hosted == 'true' }}
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lcov
        if: ${{ env.COVERAGE_ENABLED == 'true' }}
        run: sudo apt -y install lcov

      - name: Install fastcov
        if: ${{ env.COVERAGE_ENABLED == 'true' }}
        run: sudo pip install fastcov --break-system-packages

      - name: Install graphviz
        if: ${{ env.BUILD_DEPLOYABLES == 'true' }}
        run: sudo apt -y install libgraphviz-dev

      - name: Install LLVM
        run: sudo apt -y install llvm-19 llvm-19-dev

      - name: Install GCC 14 and gcov-14
        run: |
          sudo apt update
          sudo apt install -y ${{ env.CC_COMPILER }} ${{ env.CXX_COMPILER }} # gcov is included in gcc package

      - name: Check installations
        run: |
          ${{ env.CXX_COMPILER }} --version
          ${{ env.CC_COMPILER }} --version
          ${{ env.GCOV_VERSION }} --version

      - name: Install ccache
        working-directory: ${{ env.WORKSPACE }}
        run: ./toolbox.py download-binaries -s ccache

      # Generate a timestamp and save it to a variable.
      # Timestamp is appended to the key in caching, so each cache has a unique key.
      # This step is arbitrary, and has nothing to the order of choosing the most
      # recent hash.
      - name: Prepare cache timestamp
        id: cache-timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H::%M::%S" UTC)
          file(APPEND "$ENV{GITHUB_OUTPUT}" "timestamp=${current_date}")

      # Cache local branch and on miss fallback to main branch's cache. In case
      # main branch misses, fallback to any branch's cache.
      - name: Restore build cache
        id: restore-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-build-${{ matrix.build-type }}-${{ env.BRANCH_NAME }}-${{ steps.cache-timestamp.outputs.timestamp }}
          # If there is no match with the key, then it tries to partially
          # match with any of restore-keys (top to bottom).
          # Most recent entry is used when multiple match to the same key.
          # See readme for details.
          restore-keys : |
            ${{ runner.os }}-build-${{ matrix.build-type }}-${{ env.BRANCH_NAME }}
            ${{ runner.os }}-build-${{ matrix.build-type }}-main
            ${{ runner.os }}-build-${{ matrix.build-type }}

      # Remove ccache folder to prevent cache snowball growth
      - name: Remove ccache on main
        if: ${{ env.BRANCH_NAME == 'main' }}
        id: ccache-main-rm
        run: rm -rf ${CCACHE_DIR}

      # Enables coverage only in case of Debug build.
      - name: Additional CMake flags
        id: cmake-flags
        # Env here is used for readability only
        env:
          flags:
            ${{ env.COVERAGE_ENABLED == 'true' && format('-D ENABLE_COVERAGE=ON -D GCOV_VERSION={0}', env.GCOV_VERSION) || '' }}
        run: echo flags=${{ env.flags }} >> $GITHUB_OUTPUT

      - name: Configure CMake
        working-directory: ${{ env.WORKSPACE }}
        run: |
          cmake \
              -B ${{ env.BUILD_DIR }} \
              -D CMAKE_CXX_COMPILER=${{ env.CXX_COMPILER }} \
              -D CMAKE_C_COMPILER=${{ env.CC_COMPILER }} \
              -D BUILD_DOCS=OFF \
              -D CMAKE_BUILD_TYPE=${{ matrix.build-type }} \
              -D DOWNLOAD_UBUNTU_ICU_BUILD=ON \
              -D USE_CCACHE=ON \
              ${{ steps.cmake-flags.outputs.flags }}

      - name: Build tests
        working-directory: ${{ env.WORKSPACE }}
        run: cmake --build ${{ env.BUILD_DIR }} -j ${{ steps.set-jobs.outputs.jobs }} -- build_all_tests

      # Check against regressions in target applications.
      # This step is run now so that the results are cached.
      # However, it does not fail the job at this stage because we still want the tests to be run.
      # It will fail the job at the end in the "Fail if deployables failed to build" step.
      - name: Build deployables
        id: build-deployables
        if: ${{ env.BUILD_DEPLOYABLES == 'true' }}
        working-directory: ${{ env.WORKSPACE }}
        run: cmake --build ${{ env.BUILD_DIR }} -j ${{ steps.set-jobs.outputs.jobs }} -- all build_all_playgrounds
        continue-on-error: true

      # Source:  https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows#force-deleting-cache-entries
      # This step deletes all the cache entries that are related to this branch,
      # and it is done in this moment in the script, right after building, because
      # upload of the current build happens after everything
      # else has finished, so there will be a cache entry ready for pulling.
      - name: Cleanup previous Cache entries for this branch
        run: |
          gh extension install actions/gh-actions-cache

          echo "Fetching list of cache key"
          cacheKeysForPR=$(gh actions-cache list -R $REPO -L 100 | cut -f 1 )

          ## Setting this to not fail the workflow while deleting cache keys.
          set +e
          echo "Deleting caches..."
          for cacheKey in $cacheKeysForPR
          do
            if [[ $cacheKey == ${{ runner.os }}-build-${{ matrix.build-type }}-${{ env.BRANCH_NAME }}* ]]; then
              gh actions-cache delete $cacheKey -R $REPO --confirm
            fi
          done
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.CACHE_DEL_PAT }}  # This env variable is used by the GH tool.
          REPO: ${{ github.repository }}

      # Manually cache the build before testing, but **after** cleaning.
      - name: Save build cache
        id: save-build-cache
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-build-cache.outputs.cache-primary-key }}

      - name: Test
        working-directory: ${{ env.BUILD_DIR }}
        run: cmake --build ${{ env.BUILD_DIR }} -- test

      - name: Test Coverage
        id: test-coverage
        if: ${{ env.COVERAGE_ENABLED == 'true' }}
        working-directory: ${{ env.WORKSPACE }}
        run: |
          cmake --build ${{ env.BUILD_DIR }} -- coverage
          echo coverage-percent=$(python3 ${{ env.WORKSPACE }}/scripts/cmake/coverage_info_parser.py ${{ env.BUILD_DIR }}/coverage/index.html) > $GITHUB_OUTPUT

      - name: Fail if deployables failed to build
        if: ${{ env.BUILD_DEPLOYABLES == 'true' && steps.build-deployables.outcome != 'success' }}
        run: exit 1

  coverage:
    needs: [build]

    runs-on: ubuntu-24.04

    timeout-minutes: 2

    steps:
      - name: Save main coverage percentage
        uses: action-pack/set-variable@v1
        if: ${{ env.BRANCH_NAME == 'main' }}
        with:
          name: 'MAIN_COVERAGE_VALUE'
          value: ${{ needs.build.outputs.coverage-value }}
          token: ${{ secrets.QUACKER_PAT }}

      - name: Read main coverage percentage
        id: read-main-coverage
        run: echo value=${{ vars.MAIN_COVERAGE_VALUE }} > $GITHUB_OUTPUT

      - name: Check coverage status
        id: check-coverage-status
        run: echo success=${{ needs.build.outputs.coverage-value >= steps.read-main-coverage.outputs.value }} > $GITHUB_OUTPUT

      - name: Hide previous bot comments
        if: ${{ env.IF_MAIN_PR == 'true' }}
        uses: int128/hide-comment-action@v1
        with:
          token: ${{ secrets.QUACKER_PAT }}
          authors: quacker-bot

      - name: Post coverage status as github comment
        uses: actions/github-script@v7
        if: ${{ env.IF_MAIN_PR == 'true' }}
        env:
          FAIL_MSG: '❌❌❌ - **You have to write some more tests, so the coverage is at least as high as on the main branch!** \n\n 🆘 Run coverage tests: `./toolbox.py coverage` to get more information.'
          SUCC_MSG: '✅✅✅ - **Great job writing tests!**'
        with:
          github-token: ${{ secrets.QUACKER_PAT }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎉 Tests and coverage ran successfully! 🎉\n \
                     ⭐ Lines covered on the **current** branch: **${{ needs.build.outputs.coverage-value }}%** \n \
                     ⭐ Lines covered on the main branch: ${{ steps.read-main-coverage.outputs.value }}% \n \
                     ${{ steps.check-coverage-status.outputs.success == 'true' && env.SUCC_MSG || env.FAIL_MSG }}'
            })

      - name: Fail if insufficient coverage
        if: ${{ steps.check-coverage-status.outputs.success != 'true' && env.IF_MAIN_PR == 'true' && (! contains(github.event.pull_request.labels.*.name, 'Override Coverage Check'))}}
        run: exit 1
