name: tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  WORKSPACE: ${{ github.workspace }}/dev
  BUILD_DIR: ${{ github.workspace }}/dev/build
  CCACHE_DIR: ${{ github.workspace }}/dev/.ccache
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        build-type: [Debug, Release]  # (Release, Debug, RelWithDebInfo, etc.)
      fail-fast: false

    timeout-minutes: 8  # (Per matrix run)

    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if should build with coverage
        id: coverage-enabled
        if: ${{ matrix.build-type == 'Debug' }}
        # This might be a little misleading.
        # When we don't want to build coverage if statement will 
        # stop this step, and `value` will be empty.
        run: echo value=1 > $GITHUB_OUTPUT

      - name: Install lcov
        if: ${{ steps.coverage-enabled.outputs.value }}
        run: sudo apt-get -y install lcov

      - name: Install ccache
        working-directory: ${{ env.WORKSPACE }}
        run: ./toolbox.py download-binaries -s ccache

      # Generate a timestamp and save it to a variable.
      # Timestamp is appended to the key in caching, so each cache has a unique key.
      # This step is arbitrary, and has nothing to the order of choosing the most
      # recent hash.
      - name: Prepare cache timestamp
        id: cache_timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H::%M::%S" UTC)
          file(APPEND "$ENV{GITHUB_OUTPUT}" "timestamp=${current_date}")

      # Cache local branch and on miss fallback to main branch's cache. In case
      # main branch misses, fallback to any branch's cache.
      - name: Cache build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-build-${{ matrix.build-type }}-${{ env.BRANCH_NAME }}-${{ steps.cache_timestamp.outputs.timestamp }}
          # This is interesting. If no match happens to the key, then it tries to partially
          # match with any of restore-keys, and if matches, then the most recent cache is used.
          restore-keys : |
            ${{ runner.os }}-build-${{ matrix.build-type }}-${{ env.BRANCH_NAME }}
            ${{ runner.os }}-build-${{ matrix.build-type }}-main
            ${{ runner.os }}-build-${{ matrix.build-type }}

      - name: Configure CMake
        working-directory: ${{ env.WORKSPACE }}
        run: |
          coverage_flags=${{ steps.coverage-enabled.outputs.value && '-D ENABLE_COVERAGE=ON' || '' }}
          cmake \
              -B ${{ env.BUILD_DIR }} \
              -D CMAKE_CXX_COMPILER=g++-11 \
              -D BUILD_DOCS=OFF \
              -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
              -D DOWNLOAD_UBUNTU_ICU_BUILD=ON \
              -D USE_CCACHE=ON \
              ${{coverage_flags}}

      - name: Build tests
        working-directory: ${{ env.WORKSPACE }}
        run: cmake --build ${{ env.BUILD_DIR }} -j 5 -- build_all_tests

      - name: Test
        working-directory: ${{ env.BUILD_DIR }}
        run: cmake --build ${{ env.BUILD_DIR }} -- test

      - name: Test Coverage
        id: test-coverage
        if: ${{ steps.coverage-enabled.outputs.value }}
        working-directory: ${{ env.WORKSPACE }}
        run: |
          cmake --build ${{ env.BUILD_DIR }} -- coverage
          echo coverage-percent=$(python3 ${{ env.WORKSPACE }}/scripts/cmake/coverage_info_parser.py ${{ env.BUILD_DIR }}/coverage/index.html) > $GITHUB_OUTPUT

      - name: Save main coverage percentage
        uses: action-pack/set-variable@v1
        if: ${{ steps.coverage-enabled.outputs.value && env.BRANCH_NAME == 'main' }}
        with:
          name: 'MAIN_COVERAGE_VALUE'
          value: ${{ steps.test-coverage.outputs.coverage-percent }}
          token: ${{ secrets.QUACKER_PAT }}

      - name: Read main coverage percentage
        if: ${{ steps.coverage-enabled.outputs.value }}
        id: read-main-coverage
        run: echo value=${{ vars.MAIN_COVERAGE_VALUE }} > $GITHUB_OUTPUT

      - name: Check coverage status
        id: check-coverage-status
        if: ${{ steps.coverage-enabled.outputs.value }}
        run: echo success=${{ steps.test-coverage.outputs.coverage-percent >= steps.read-main-coverage.outputs.value }} > $GITHUB_OUTPUT

      - name: Post coverage status as github comment
        uses: actions/github-script@v7
        # Possibly, we'll need to a check env.BRANCH_NAME != 'main'
        if: ${{ steps.coverage-enabled.outputs.value }}
        env:
          FAIL_MSG: '❌❌❌ - **You have to write some more tests, so the coverage is at least as high as on the main branch!** \n\n 🆘 Run coverage tests: `./toolbox.py coverage` to get more information.'
          SUCC_MSG: '✅✅✅ - **Great job writing tests!**'
        with:
          github-token: ${{ secrets.QUACKER_PAT }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎉 Tests and coverage ran successfully! 🎉\n \
                     ⭐ Lines covered on the **current** branch: **${{ steps.test-coverage.outputs.coverage-percent }}%** \n \
                     ⭐ Lines covered on the main branch: ${{ steps.read-main-coverage.outputs.value }}% \n \
                     ${{ steps.check-coverage-status.outputs.success == 'true' && env.SUCC_MSG || env.FAIL_MSG }}'
            })

      - name: Fail if insufficient coverage
        if: ${{ steps.coverage-enabled.outputs.value && steps.check-coverage-status.outputs.success != 'true' }}
        run: exit 1
