name: tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  WORKSPACE: ${{github.workspace}}/dev/

jobs:
  build:
      timeout-minutes: 8
      runs-on: ubuntu-22.04
      steps:
        - uses: actions/checkout@v4

        # Install a coverage tool
        - run: sudo apt-get -y install lcov

        - name: Save state
          run: echo "{name321}={value321}" >> $GITHUB_STATE

        - name: Set output
          run: echo "name123=value123" >> $GITHUB_OUTPUT

        - name: Configure CMake
          working-directory: ${{env.WORKSPACE}}
          run: cmake -B ${{env.WORKSPACE}} -D CMAKE_CXX_COMPILER=g++-11 -D BUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -D DOWNLOAD_UBUNTU_ICU_BUILD=ON -D ENABLE_COVERAGE=true


        - name: Build
          working-directory: ${{env.WORKSPACE}}
          run: cmake --build ${{env.WORKSPACE}} -j 2 --target build_all_tests --config ${{env.BUILD_TYPE}}

  test:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-22.04
    needs: build
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'false'

    # @FIXME: Caching does not work, cmake rebuilds everything anyway
    # Perhaps use https://cristianadam.eu/20200113/speeding-up-c-plus-plus-github-actions-using-ccache/
    # - name: CacheBuild
    #   id: cache-build
    #   uses: actions/cache@v3
    #   with:
    #     path: |
    #       ${{env.WORKSPACE}}/lib/*
    #       ${{env.WORKSPACE}}/bin/*
    #       ${{env.WORKSPACE}}/CMakeFiles/*
    #       ${{env.WORKSPACE}}/CMakeLists.txt
    #       ${{env.WORKSPACE}}/Makefile
    #       ${{env.WORKSPACE}}/CMakeCache.txt
    #       ${{env.WORKSPACE}}/cmake_install.cmake
    #       ${{env.WORKSPACE}}/CTestTestfile.cmake
    #     key: ${{ runner.os }}-cache-build


    - name: Generate a code coverage report
      uses: threeal/gcovr-action@v1.0.0

    - name: Test
      working-directory: ${{env.WORKSPACE}}
      run: ctest -C ${{env.BUILD_TYPE}}
  test-coverage:
    runs-on: ubunt-22.04
    needs: build
    steps:
      - name: Coverage
        working-directory: ${{env.WORKSPACE}}
        run: cmake --build ${{env.WORKSPACE}} -- coverage
