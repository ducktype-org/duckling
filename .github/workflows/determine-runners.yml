name: Determine Runners

# This workflow determines the availability of self-hosted runners based on provided labels.
# Inputs:
# - self-hosted-labels: A comma-separated list of labels to check for self-hosted runners.
#   Example: "build,linux"
# - github-labels: A comma-separated list of labels to use for GitHub-hosted runners if self-hosted runners are unavailable.
#   Example: "ubuntu-latest,windows-latest"
# Outputs:
# - runner1: JSON object containing the group and labels for the first runner.
#   Example: {"group":"SelfHostedRunners","labels":"build,linux"} or {"labels":"ubuntu-latest"}
# - runner2: JSON object containing the group and labels for the second runner.
#   Example: {"group":"SelfHostedRunners","labels":"build,linux"} or {"labels":"ubuntu-latest"}

on:
  workflow_call:
    inputs:
      self-hosted-labels:
        description: 'Comma-separated list of labels to check for self-hosted runners'
        required: true
        type: string
      github-labels:
        description: 'Comma-separated list of labels to use for GitHub-hosted runners'
        required: true
        type: string
    outputs:
      runner1:
        value: ${{ jobs.determine.outputs.runner1 }}
      runner2:
        value: ${{ jobs.determine.outputs.runner2 }}

jobs:
  determine:
    runs-on: ubuntu-latest
    outputs:
      runner1: ${{ steps.set-runner.outputs.runner1 }}
      runner2: ${{ steps.set-runner.outputs.runner2 }}
    steps:
      - name: Check runner availability
        id: set-runner
        env:
          GH_TOKEN: ${{ secrets.WORKLOW_SCHED_TOKEN }}
        run: |
          echo "Checking for runners with labels: ${{ inputs.self-hosted-labels }}"
          echo "Fallback GitHub labels: ${{ inputs.github-labels }}"

          runners=$(gh api -H "Accept: application/vnd.github+json" /orgs/ducktype-org/actions/runners 2>/dev/null || echo '{"runners":[]}')

          available_runners=$(echo "$runners" | \
            jq -r --arg lbls "${{ inputs.self-hosted-labels }}" '
              .runners[]? | 
              select(
                .status == "online" and 
                .busy == false and 
                ([.labels[]?.name] | all($lbls | split(",")[]; index(.)))
              ) | .name' | \
            head -2)

          echo "Available runners:"
          echo "$available_runners"

          mapfile -t runners_array <<< "$available_runners"

          if [ -n "${runners_array[0]}" ]; then
            echo "runner1={\"group\":\"SelfHostedRunners\",\"labels\": [${{ inputs.self-hosted-labels }}]}" >> $GITHUB_OUTPUT
          else
            echo "runner1={\"labels\": [${{ inputs.github-labels }}]}" >> $GITHUB_OUTPUT
          fi

          if [ -n "${runners_array[1]}" ]; then
            echo "runner2={\"group\":\"SelfHostedRunners\",\"labels\": [${{ inputs.self-hosted-labels }}]}" >> $GITHUB_OUTPUT
          else
            echo "runner2={\"labels\": [${{ inputs.github-labels }}]}" >> $GITHUB_OUTPUT
          fi
