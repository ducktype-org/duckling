name: Determine Runners
on:
  workflow_call:
    inputs:
      target-label:
        description: 'Label to check for runners'
        required: true
        type: string
    outputs:
      runner1:
        value: ${{ jobs.determine.outputs.runner1 }}
      runner2:
        value: ${{ jobs.determine.outputs.runner2 }}

jobs:
  determine:
    runs-on: ubuntu-latest
    outputs:
      runner1: ${{ steps.set-runner.outputs.runner1 }}
      runner2: ${{ steps.set-runner.outputs.runner2 }}
    steps:
      - name: Check runner availability
        id: set-runner
        env:
          GH_TOKEN: ${{ secrets.WORKLOW_SCHED_TOKEN }}
          TARGET_LABEL: ${{ inputs.target-label }}
        run: |
          echo "Checking for runners with label: $TARGET_LABEL"
          
          runners=$(gh api -H "Accept: application/vnd.github+json" /orgs/ducktype-org/actions/runners 2>/dev/null || echo '{"runners":[]}')
          echo "Runners found:"
          echo "$runners"
          available_runners=$(echo "$runners" | 
            jq -r --arg lbl "$TARGET_LABEL" '
              .runners[]? | 
              select(
                .status == "online" and 
                .busy == false and 
                (.labels[]?.name == $lbl)
              ) | .name' | 
            head -2)

          echo "Available runners found:"
          echo "$available_runners"
          
          mapfile -t runners_array <<< "$available_runners"
          
          echo "Runner1 candidate: ${runners_array[0]}"
          echo "Runner2 candidate: ${runners_array[1]}"
          
          if [ -n "${runners_array[0]}" ]; then
            echo "runner1={\"group\":\"SelfHostedRunners\",\"labels\":\"$TARGET_LABEL\"}" >> $GITHUB_OUTPUT
          else
            echo "runner1=\"ubuntu-latest\"" >> $GITHUB_OUTPUT
          fi
          
          if [ -n "${runners_array[1]}" ]; then
            echo "runner2={\"group\":\"SelfHostedRunners\",\"labels\":\"$TARGET_LABEL\"}" >> $GITHUB_OUTPUT
          else
            echo "runner2=\"ubuntu-latest\"" >> $GITHUB_OUTPUT
          fi
