name: rust

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  CARGO_DIR: ~/.cargo

jobs:
  determine-runners:
    uses: ./.github/workflows/determine-runners.yml
    with:
      self-hosted-labels: '["ubuntu-24.04"]'
      github-labels: '["ubuntu-24.04"]'
    secrets: inherit

  rust-checks:
    if: github.event.pull_request.draft == false
    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runners)[0] }}

    strategy:
      matrix:
        project:
          - name: duck
            path: dev/src/duck/duck
          - name: quackpack
            path: dev/src/duck/quackpack
      fail-fast: false

    timeout-minutes: 15

    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(fromJson(needs.determine-runners.outputs.runners)[0].group, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        run: . ${{ CARGO_DIR }}/env

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ${{ CARGO_DIR }}/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ${{ CARGO_DIR }}/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.project.path }}/target
          key: ${{ runner.os }}-cargo-build-${{ matrix.project.name }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.project.path)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.project.name }}-

      - name: Remove target/ on main
        if: ${{ env.BRANCH_NAME == 'main' }}
        run: rm -rf ${{ matrix.project.path }}/target

      - name: Run cargo fmt
        working-directory: ${{ matrix.project.path }}
        run: cargo fmt --check

      - name: Run cargo clippy
        working-directory: ${{ matrix.project.path }}
        run: cargo clippy -- -D warnings

      - name: Run cargo test
        working-directory: ${{ matrix.project.path }}
        run: cargo test
