name: rust

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  determine-runners:
    if: github.event.pull_request.draft == false

    uses: ./.github/workflows/determine-runners.yml
    with:
      self-hosted-labels: '["ubuntu-24.04"]'
      github-labels: '["ubuntu-24.04"]'
    secrets: inherit

  clippy:
    if: github.event.pull_request.draft == false
    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runners)[0] }}
    name: cargo clippy / (${{ matrix.project.name }}, ${{ matrix.project.path }})

    strategy:
      matrix:
        project:
          - name: duck & quackpack
            path: dev/src/duck/
      fail-fast: false

    timeout-minutes: 10

    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(fromJson(needs.determine-runners.outputs.runners)[0].group, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - name: Checkout repository
        uses: actions/checkout@v6

      # This has to be before restoring cache, so the env is set. It also puts the toolchain on
      # PATH.
      - name: Setup Rust
        uses: ./.github/actions/setup-linux-rust/

      - name: Run cargo clippy
        working-directory: ${{ matrix.project.path }}
        run: cargo clippy --no-deps --locked -- -D warnings

  rustfmt:
    if: github.event.pull_request.draft == false
    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runners)[0] }}
    name: cargo fmt / (${{ matrix.project.name }}, ${{ matrix.project.path }})

    strategy:
      matrix:
        project:
          - name: duck & quackpack
            path: dev/src/duck/
      fail-fast: false

    timeout-minutes: 10

    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(fromJson(needs.determine-runners.outputs.runners)[0].group, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - name: Checkout repository
        uses: actions/checkout@v6

      # The only job here that does not go through a setup-*-rust action.
      - name: Put the toolchain on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run cargo fmt
        working-directory: ${{ matrix.project.path }}
        run: cargo --locked fmt --check

  test:
    if: github.event.pull_request.draft == false
    needs: determine-runners
    # Unlike the Linux jobs this does not reach the mac through determine-runners.
    runs-on: ${{ matrix.platform == 'macos' && fromJson('{"group":"SelfHostedRunners","labels":"macOS"}') || fromJson(needs.determine-runners.outputs.runners)[0] }}
    name: cargo test / (${{ matrix.project.name }}, ${{ matrix.project.path }}${{ matrix.platform == 'macos' && ', macOS' || '' }})

    strategy:
      matrix:
        project:
          - name: duck & quackpack
            path: dev/src/duck/
        platform: [linux, macos]
      fail-fast: false

    timeout-minutes: 10

    steps:
      - name: Clean workspace (self-hosted only)
        if: ${{ matrix.platform == 'macos' || contains(fromJson(needs.determine-runners.outputs.runners)[0].group, 'SelfHostedRunners') }}
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - name: Checkout repository
        uses: actions/checkout@v6

      # This has to be before restoring cache, so the env is set. It also puts the toolchain on
      # PATH.
      - name: Setup Rust (Linux)
        if: ${{ matrix.platform != 'macos' }}
        uses: ./.github/actions/setup-linux-rust/

      - name: Setup Rust (macOS)
        if: ${{ matrix.platform == 'macos' }}
        uses: ./.github/actions/setup-macos-rust/

      - name: Run cargo test
        working-directory: ${{ matrix.project.path }}
        run: cargo --locked test
