name: Add Run All Workflows Label

on:
  pull_request_review:
    types: [submitted]

jobs:
  add-label:
    if: github.event.review.state == 'approved' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.QUACKER_APP_ID }}
          private-key: ${{ secrets.QUACKER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Add "Run All Workflows" label if missing
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABEL: "Run All Workflows"
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -Fxq "$LABEL"; then
            echo "Label '$LABEL' already present, nothing to do."
          else
            echo "Label '$LABEL' missing, adding it."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL"
          fi
