name: linter

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number}}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CXX_COMPILER: g++-14
  CC_COMPILER: gcc-14
  TIDY_VERSION: 19

jobs:
  determine-runners:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/determine-runners.yml
    with:
      self-hosted-labels: '["ubuntu-24.04", "ubuntu-24.04"]'
      github-labels: '["ubuntu-24.04", "ubuntu-24.04"]'
    secrets: inherit

  cpp-linter:
    if: github.event.pull_request.draft == false

    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runners)[0] }}
    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(fromJson(needs.determine-runners.outputs.runners)[0].group, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - uses: actions/checkout@v4

      - name: Fetch origin/main
        run: git fetch origin main

      - name: Install gvc, LLVM, clang-tidy, clang-format and nlohmann_json
        run: sudo apt -y install libgraphviz-dev llvm-19 llvm-19-dev nlohmann-json3-dev ${{ env.CXX_COMPILER }} ${{ env.CC_COMPILER }} clang-tidy-${{ env.TIDY_VERSION }} clang-format-${{ env.TIDY_VERSION }}
        # @TODO: Remove nlohmann-json3-dev dependency from here. It was added, because linter
        # didn't see nlohmann_json library for some reason. It should be removed, because it is
        # already added through CMake and version from package manager and in our configuration may differ.

      - name: Create compile_commands
        run: |
         cd dev
         cmake -DCMAKE_CXX_COMPILER=${{ env.CXX_COMPILER }} -DCMAKE_C_COMPILER=${{ env.CC_COMPILER }} -D BUILD_DOCS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -B build
        shell: bash

      - name: Run cpp-linter
        run: |
         cd dev
         python3 toolbox.py cpp-linter --branch origin/main --no-merge-base --no-fix -b build -f clang-format-${{ env.TIDY_VERSION }} -t clang-tidy-${{ env.TIDY_VERSION }}
        shell: bash

  duck-linter:
    if: github.event.pull_request.draft == false

    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runners)[1] }}
    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(fromJson(needs.determine-runners.outputs.runners)[1].group, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - uses: actions/checkout@v4

      # Fetch origin/main for the following steps, because by default repo on the runners contains just the bare-minimum.
      - name: Fetch origin/main
        run: |
         git fetch origin main

      - name: Run duck linter
        run: |
         cd dev
         python3 toolbox.py duck-linter --branch origin/main --no-merge-base --verbose --no-fix
        shell: bash

      - name: Run issue checker
        env:
          GH_TOKEN: ${{ secrets.READ_ISSUE_DATA }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
         cd dev
         python3 toolbox.py issue-checker --branch origin/main --no-merge-base
        shell: bash

      - name: Run TODO validation
        env:
          GH_TOKEN: ${{ secrets.READ_ISSUE_DATA }}
        run: |
         cd dev
         python3 toolbox.py todo-validate --branch origin/main --no-merge-base
        shell: bash
