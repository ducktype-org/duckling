name: linter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CXX_COMPILER: g++-14
  CC_COMPILER: gcc-14
  TIDY_VERSION: 19

jobs:
  determine-runners:
    uses: ./.github/workflows/determine-runners.yml
    with:
      self-hosted-label: 'ubuntu-24.04'
      github-label: 'ubuntu-24.04'
    secrets: inherit

  cpp-linter:
    if: github.event.pull_request.draft == false

    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runner1) }}
    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(needs.determine-runners.outputs.runner1, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - uses: actions/checkout@v4

      - name: Install gvc, LLVM and nlohmann_json
        run: sudo apt -y install libgraphviz-dev llvm-19 llvm-19-dev nlohmann-json3-dev ${{ env.CXX_COMPILER }} ${{ env.CC_COMPILER }}
        # @TODO: Remove nlohmann-json3-dev dependency from here. It was added, because linter
        # didn't see nlohmann_json library for some reason. It should be removed, because it is
        # already added through CMake and version from package manager and in our configuration may differ.

      - name: Create compile_commands
        run: |
         cd dev
         cmake -DCMAKE_CXX_COMPILER=${{ env.CXX_COMPILER }} -DCMAKE_C_COMPILER=${{ env.CC_COMPILER }} -D BUILD_DOCS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
         cd ..
        shell: bash

      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.QUACKER_PAT }}
        with:
          style: 'file'
          tidy-checks: ''
          version: ${{ env.TIDY_VERSION }}
          lines-changed-only: true
          database: 'dev'

          # Note that tidy-checks: '', means it uses .clang-tidy file
          # according to the cpp-linter action docs.

          # Enable to let linter post requested format changes in PR thread:
          # format-review: true
          # thread-comments: true

          # The following value will only update a single comment
          # in a pull request's thread. Set it to false to disable the comment.
          # Set it to true to post a new comment (and delete the old comment).
          step-summary: true


      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  duck-linter:
    if: github.event.pull_request.draft == false

    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runner2) }}
    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(needs.determine-runners.outputs.runner2, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - uses: actions/checkout@v4

      - name: Run duck linter
        run: |
         git fetch origin main
         cd dev
         python3 toolbox.py duck-linter --branch origin/main --no-merge-base --verbose
        shell: bash

      - name: Extract linked issues via GraphQL
        id: get-issues
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKLOW_SCHED_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          #!/usr/bin/env bash
          set -eo pipefail

          if [[ -z "$GITHUB_TOKEN" ]]; then
            echo "[ERROR] GITHUB_TOKEN is not set!"
            exit 1
          fi

          QUERY='{
            repository(owner: "'$OWNER'", name: "'$REPO'") {
              pullRequest(number: '$PR_NUMBER') {
                closingIssuesReferences(first: 100) {
                  nodes { number }
                }
              }
            }
          }'

          RESPONSE=$(curl -s -H "Authorization: bearer $GITHUB_TOKEN" \
            -X POST -d "{\"query\":$(jq -Rs . <<< "$QUERY")}" \
            https://api.github.com/graphql)

          if [[ -z "$RESPONSE" ]]; then
            echo "[ERROR] Empty response from GitHub API!"
            exit 1
          fi

          if grep -q '"errors"' <<< "$RESPONSE"; then
            echo "[ERROR] GraphQL error:"
            echo "$RESPONSE"
            exit 1
          fi

          set +e
          ISSUES=$(jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' <<<"$RESPONSE" 2>/dev/null | tr '\n' ' ' | sed 's/ $//')
          set -e

          if [[ -z "$ISSUES" ]]; then
            echo "[INFO] No issues found for PR #$PR_NUMBER."
          else
            echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"
            echo "[INFO] Found issues: $ISSUES"
          fi

      
      - name: Run issue checker
        if: steps.get-issues.outputs.issues != ''
        run: |
         # Convert comma-separated list to space-separated
         issues="${{ steps.get-issues.outputs.issues }}"
         space_separated=$(echo "$issues" | tr ',' ' ')

         git fetch origin main
         cd dev
         python3 toolbox.py issue-checker "$space_separated" --branch origin/main --no-merge-base
        shell: bash
