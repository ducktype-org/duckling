name: linter

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number}}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CXX_COMPILER: g++-14
  CC_COMPILER: gcc-14
  CLANG_COMPILER: clang-19
  TIDY_VERSION: 19
  # Kept in sync with tests.yml so the linter configures the very same build the
  # per-PR tests matrix does.
  WORKSPACE: ${{ github.workspace }}/dev
  BUILD_DIR: ${{ github.workspace }}/dev/build
  BUILD_SYSTEM: Ninja

jobs:
  # GitHub silently stops creating runs for a workflow whose file does not
  # parse, so this check must live outside tests.yml to report its breakage.
  # Runs on drafts too - broken workflows should surface as early as possible.
  workflows-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Install click and PyYAML
        run: sudo pip install click pyyaml --break-system-packages --no-input

      - name: Validate workflow YAML
        run: |
          cd dev
          python3 toolbox.py workflows-lint
        shell: bash

  determine-runners:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/determine-runners.yml
    with:
      self-hosted-labels: '["ubuntu-24.04", "ubuntu-24.04"]'
      github-labels: '["ubuntu-24.04", "ubuntu-24.04"]'
    secrets: inherit

  cpp-linter:
    if: github.event.pull_request.draft == false

    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runners)[0] }}
    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(fromJson(needs.determine-runners.outputs.runners)[0].group, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - uses: actions/checkout@v6

      - name: Update apt
        run: sudo apt update

      - name: Install gvc, LLVM and nlohmann_json
        run: sudo apt -y install libgraphviz-dev llvm-19 llvm-19-dev ${{ env.CLANG_COMPILER }} clang-tools-${{ env.TIDY_VERSION }} pkg-config libffi-dev xxd ninja-build ${{ env.CXX_COMPILER }} ${{ env.CC_COMPILER }}

      - name: Install click and PyYAML
        run: sudo pip install click pyyaml --break-system-packages --no-input

      - name: Initialize project
        working-directory: ${{ env.WORKSPACE }}
        run: ./toolbox.py init

      # The build is configured through the toolbox with the same compiler and flags the
      # per-PR tests matrix uses, so the linter cannot break on a configuration that no
      # other workflow exercises. compile_commands.json is exported by dev/CMakeLists.txt
      # itself, so no extra flag is needed here.
      # --jit Yes enables C&P too, so the C&P stencil sources (only compiled with C&P)
      # appear in compile_commands.json.
      - name: Create compile_commands
        working-directory: ${{ env.WORKSPACE }}
        run: |
          ./toolbox.py setup-build \
            -b ${{ env.BUILD_DIR }} \
            -s ${{ env.BUILD_SYSTEM }} \
            -c ${{ env.CC_COMPILER }} \
            -x ${{ env.CXX_COMPILER }} \
            -t Dev \
            --jit Yes \
            --no-coverage \
            --no-docs \
            --ccache

      # lspgen runs as a build step, so configuring alone leaves lsp/types.h and the rest of the
      # generated headers missing and every file that reaches them fails to parse.
      - name: Generate the lsp-framework headers
        run: cmake --build ${{ env.BUILD_DIR }} --target lsp -j "$(nproc)"

      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.QUACKER_PAT }}
        with:
          style: "file"
          tidy-checks: ""
          version: ${{ env.TIDY_VERSION }}
          lines-changed-only: true
          database: "dev/build"
          ignore: "**/*.c"
          # compile_commands.json is produced by GCC, which knows warning flags clang-tidy
          # does not; without this every translation unit reports unknown-warning-option.
          extra-args: "-Wno-unknown-warning-option"

          # Note that tidy-checks: '', means it uses .clang-tidy file
          # according to the cpp-linter action docs.

          # Enable to let linter post requested format changes in PR thread:
          # format-review: true
          # thread-comments: true

          # The following value will only update a single comment
          # in a pull request's thread. Set it to false to disable the comment.
          # Set it to true to post a new comment (and delete the old comment).
          step-summary: true

      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  duck-linter:
    if: github.event.pull_request.draft == false

    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runners)[1] }}
    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(fromJson(needs.determine-runners.outputs.runners)[1].group, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - uses: actions/checkout@v6

      # Fetch origin/main for the following steps, because by default repo on the runners contains just the bare-minimum.
      - name: Fetch origin/main
        run: |
          git fetch origin main

      - name: Run duck linter
        run: |
          cd dev
          python3 toolbox.py duck-linter --branch origin/main --no-merge-base --verbose --no-fix
        shell: bash

      - name: Run issue checker
        env:
          GH_TOKEN: ${{ secrets.READ_ISSUE_DATA }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cd dev
          python3 toolbox.py issue-checker --branch origin/main --no-merge-base
        shell: bash

      - name: Run TODO validation
        env:
          GH_TOKEN: ${{ secrets.READ_ISSUE_DATA }}
        run: |
          cd dev
          python3 toolbox.py todo-validate --branch origin/main --no-merge-base
        shell: bash
