name: linter

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number}}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CXX_COMPILER: g++-14
  CC_COMPILER: gcc-14
  CLANGXX_COMPILER: clang++-19
  CLANG_COMPILER: clang-19
  TIDY_VERSION: 19

jobs:
  # GitHub silently stops creating runs for a workflow whose file does not
  # parse, so this check must live outside tests.yml to report its breakage.
  # Runs on drafts too - broken workflows should surface as early as possible.
  workflows-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Install click and PyYAML
        run: sudo pip install click pyyaml --break-system-packages --no-input

      - name: Validate workflow YAML
        run: |
          cd dev
          python3 toolbox.py workflows-lint
        shell: bash

  determine-runners:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/determine-runners.yml
    with:
      self-hosted-labels: '["ubuntu-24.04", "ubuntu-24.04"]'
      github-labels: '["ubuntu-24.04", "ubuntu-24.04"]'
    secrets: inherit

  cpp-linter:
    if: github.event.pull_request.draft == false

    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runners)[0] }}
    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(fromJson(needs.determine-runners.outputs.runners)[0].group, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}
          echo "Workspace cleaned."

      - uses: actions/checkout@v6

      - name: Install gvc, LLVM and nlohmann_json
        run: sudo apt -y install libgraphviz-dev llvm-19 ${{ env.CLANG_COMPILER }} llvm-19-dev nlohmann-json3-dev pkg-config libffi-dev ${{ env.CXX_COMPILER }} ${{ env.CC_COMPILER }}
        # @TODO: Remove nlohmann-json3-dev dependency from here. It was added, because linter
        # didn't see nlohmann_json library for some reason. It should be removed, because it is
        # already added through CMake and version from package manager and in our configuration may differ.

      - name: Create compile_commands
        run: |
          cd dev
          cmake -DCMAKE_CXX_COMPILER=${{ env.CLANGXX_COMPILER }} -DCMAKE_C_COMPILER=${{ env.CLANG_COMPILER }} -DJIT_ENABLED=ON -DBUILD_DOCS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cd ..
        env: # Hot fix for GH issues:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://quacker-bot:${{ secrets.QUACKER_PAT }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_CONFIG_KEY_1: http.version
          GIT_CONFIG_VALUE_1: HTTP/1.1

      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.QUACKER_PAT }}
        with:
          style: "file"
          tidy-checks: ""
          version: ${{ env.TIDY_VERSION }}
          lines-changed-only: true
          database: "dev"
          ignore: "**/*.c"

          # Note that tidy-checks: '', means it uses .clang-tidy file
          # according to the cpp-linter action docs.

          # Enable to let linter post requested format changes in PR thread:
          # format-review: true
          # thread-comments: true

          # The following value will only update a single comment
          # in a pull request's thread. Set it to false to disable the comment.
          # Set it to true to post a new comment (and delete the old comment).
          step-summary: true

      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  duck-linter:
    if: github.event.pull_request.draft == false

    needs: determine-runners
    runs-on: ${{ fromJson(needs.determine-runners.outputs.runners)[1] }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Clean workspace (self-hosted only)
        if: contains(fromJson(needs.determine-runners.outputs.runners)[1].group, 'SelfHostedRunners')
        run: |
          echo "Cleaning up workspace on self-hosted runner..."
          rm -rf -- "$GITHUB_WORKSPACE"
          mkdir -p -- "$GITHUB_WORKSPACE"
          echo "Workspace cleaned."

      - uses: actions/checkout@v6

      # we use SHA because branch names can be parsed incorrectly
      - name: Fetch PR target branch
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "refs/heads/$PR_BASE_REF"
          base_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          echo "PR_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - name: Run duck linter
        working-directory: dev
        run: |
          python3 toolbox.py duck-linter --branch "$PR_BASE_SHA" --no-merge-base --verbose --no-fix

      - name: Run header checker
        working-directory: dev
        run: |
          python3 toolbox.py header-checker --branch "$PR_BASE_SHA" --no-merge-base

      - name: Run issue checker
        working-directory: dev
        env:
          GH_TOKEN: ${{ secrets.READ_ISSUE_DATA }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 toolbox.py issue-checker --branch "$PR_BASE_SHA" --no-merge-base

      - name: Run TODO validation
        working-directory: dev
        env:
          GH_TOKEN: ${{ secrets.READ_ISSUE_DATA }}
        run: |
          python3 toolbox.py todo-validate --branch "$PR_BASE_SHA" --no-merge-base
