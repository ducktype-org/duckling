name: cpp-linter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  cpp-linter:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gvc, LLVM and nlohmann_json
        run: sudo apt -y install libgraphviz-dev llvm llvm-dev nlohmann-json3-dev
        # @TODO: Remove nlohmann-json3-dev dependency from here. It was added, because linter
        # didn't see nlohmann_json library for some reason. It should be removed, because it is
        # already added through CMake and version from package manager and in our configuration may differ.

      - name: Create compile_commands
        run: |
         cd dev
         cmake -DCMAKE_CXX_COMPILER=g++-13 -D BUILD_DOCS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
         cd ..
        shell: bash
      
      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.QUACKER_PAT }}
        with:
          style: 'file'
          tidy-checks: ''
          version: 17
          lines-changed-only: true
          database: 'dev'

          # Note that tidy-checks: '', means it uses .clang-tidy file
          # according to the cpp-linter action docs.

          # Enable to let linter post requested format changes in PR thread:
          # format-review: true
          # thread-comments: true

          # The following value will only update a single comment
          # in a pull request's thread. Set it to false to disable the comment.
          # Set it to true to post a new comment (and delete the old comment).
          step-summary: true


      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  duck-linter:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run duck linter
        run: |
         git fetch origin main
         cd dev
         python3 toolbox.py duck-linter --branch origin/main 
        shell: bash
